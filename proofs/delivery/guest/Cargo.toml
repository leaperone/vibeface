[package]
name = "vibeface-delivery-guest"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace]

[package.metadata.risc0]
rustc-flags = [
    "--remap-path-prefix=/work=/src",
    "--remap-path-prefix=/cargo=/deps",
    "--remap-path-prefix=/risc0=/toolchain",
    "--remap-path-prefix=/artifacts=/build",
]

[dependencies]
vibeface-delivery = { path = "../../../crates/delivery" }
risc0-zkvm = { version = "=3.0.6", default-features = false, features = ["std"] }

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.9-risczero.0" }
curve25519-dalek = { git = "https://github.com/risc0/curve25519-dalek", tag = "curve25519-4.1.3-risczero.0" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.5-risczero.0" }
