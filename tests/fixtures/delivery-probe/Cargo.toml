[package]
name = "vibeface-delivery-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace]

[dependencies]
anyhow = "1"
futures-util = "0.3"
hex = "0.4"
iroh = "=1.3.0"
iroh-dns = "=1.3.0"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
vibeface-secure = { path = "../../../crates/secure" }
zeroize = "1"
