base_branch = "main"

[[scope]]
prefix = ""
name = "Rust workspace"
check = "bash scripts/build-web.sh && cargo fmt --all -- --check"
build = "cargo test --workspace --locked"

[[domain_check]]
name = "Rust diagnostics"
trigger_paths = ["crates/**", "Cargo.toml", "Cargo.lock"]
command = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[[domain_check]]
name = "JavaScript syntax"
trigger_paths = ["crates/node/sdk/**", "crates/node/web/**", "scripts/crypto-client.mjs"]
command = "node --check crates/node/sdk/codex-manager.mjs && node --check crates/node/web/transport.js && node --check scripts/crypto-client.mjs"

[[domain_check]]
name = "Delivery scripts and workflow"
trigger_paths = ["install.sh", "scripts/*.sh", "scripts/execution/**", ".github/workflows/**"]
command = "bash -n install.sh && bash -n scripts/package-node.sh scripts/install-node-service.sh scripts/build-web-crypto.sh scripts/build-web.sh scripts/verify-schema.sh scripts/build-execution-image.sh && shellcheck install.sh scripts/package-node.sh scripts/install-node-service.sh scripts/build-web-crypto.sh scripts/build-web.sh scripts/verify-schema.sh scripts/build-execution-image.sh && bash install.sh --self-test && actionlint .github/workflows/ci.yml"

[[domain_check]]
name = "Fresh schema integrity"
trigger_paths = ["crates/node/schema.hcl", "crates/node/migrations/**", "scripts/verify-schema.sh"]
command = "bash scripts/verify-schema.sh"

[review]
extra_checklist = "Check command deduplication, uncertain write results, device connection ownership, local socket permissions, and manager token budgets. A public Node may also schedule or execute; no permanent coordinator or task owner. Verify network and conversation scoping, complete DAG context and no side effects from replay."

[report]
language = "zh"
