base_branch = "main"

[[scope]]
prefix = ""
name = "CI policy and Python syntax"
check = "python3 scripts/ci.py --self-test && actionlint .github/workflows/ci.yml"
build = "python3 -c 'import ast,pathlib; [ast.parse(pathlib.Path(p).read_text()) for p in (\"scripts/ci.py\", \"scripts/verify-node.py\", \"scripts/build-inputs.py\")]'"

[[domain_check]]
name = "Rust workspace"
trigger_paths = ["crates/node/src/**", "crates/bridge/src/**", "crates/protocol/src/**", "crates/secure/src/**", "crates/*/Cargo.toml", "crates/node/build.rs", "crates/node/migrations/**", "crates/node/schema.hcl", "Cargo.toml", "Cargo.lock", "rust-toolchain*", ".cargo/**"]
command = "bash scripts/build-web-crypto.sh && bash scripts/build-web.sh && cargo fmt --all -- --check && python3 scripts/ci.py test --tier fast --packages vibeface-protocol vibeface-bridge vibeface-secure vibeface && cargo clippy --workspace --all-targets --locked -- -D warnings"

[[domain_check]]
name = "Web build and packaged resources"
trigger_paths = ["crates/node/web/**", "scripts/build-web.sh", "scripts/build-web-crypto.sh"]
command = "bash scripts/build-web-crypto.sh && bash scripts/build-web.sh && cargo build -p vibeface --locked && python3 scripts/verify-node.py --binary target/debug/vibeface --artifacts .artifacts/preflight-web --web-only"

[[domain_check]]
name = "JavaScript syntax"
trigger_paths = ["scripts/crypto-client.mjs", "npm/**", "scripts/package-npm.mjs"]
command = "node --check scripts/crypto-client.mjs && node --check npm/bin/vibeface.mjs && node --check scripts/package-npm.mjs && node scripts/package-npm.mjs --self-test"

[[domain_check]]
name = "Delivery scripts and workflow"
trigger_paths = ["install.sh", "scripts/*.sh", ".github/workflows/**"]
command = "bash -n install.sh && bash -n scripts/package-node.sh scripts/install-node-service.sh scripts/build-web-crypto.sh scripts/build-web.sh && shellcheck install.sh scripts/package-node.sh scripts/install-node-service.sh scripts/build-web-crypto.sh scripts/build-web.sh && bash install.sh --self-test && actionlint .github/workflows/ci.yml .github/workflows/npm-publish.yml"

[[domain_check]]
name = "Migration integrity"
trigger_paths = ["crates/node/migrations/**", "crates/node/schema.hcl"]
command = "atlas migrate validate --dir file://crates/node/migrations"

[review]
extra_checklist = "Check command deduplication, uncertain write results, device connection ownership, local socket permissions, and manager token budgets. A public Node may also schedule or execute; no permanent coordinator or task owner. Verify network and conversation scoping, complete DAG context and no side effects from replay."

[report]
language = "zh"
