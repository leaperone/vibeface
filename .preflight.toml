base_branch = "main"

[[scope]]
prefix = ""
name = "Rust workspace"
check = "cargo fmt --all -- --check"
build = "bash scripts/build-web.sh && cargo test --workspace --locked"

[[domain_check]]
name = "Rust diagnostics"
trigger_paths = ["crates/**", "Cargo.toml", "Cargo.lock"]
command = "bash scripts/build-web.sh && cargo clippy --workspace --all-targets --locked -- -D warnings"

[[domain_check]]
name = "JavaScript syntax"
trigger_paths = ["crates/node/sdk/**", "crates/node/web/**"]
command = "node --check crates/node/sdk/codex-manager.mjs && bash scripts/build-web.sh"

[[domain_check]]
name = "Delivery scripts and workflow"
trigger_paths = ["scripts/*.sh", ".github/workflows/**"]
command = "bash -n scripts/package-node.sh scripts/install-node-service.sh scripts/build-web.sh && shellcheck scripts/package-node.sh scripts/install-node-service.sh scripts/build-web.sh && actionlint .github/workflows/ci.yml"

[[domain_check]]
name = "Migration integrity"
trigger_paths = ["crates/node/migrations/**"]
command = "atlas migrate validate --dir file://crates/node/migrations"

[review]
extra_checklist = "Check command deduplication, uncertain write results, device connection ownership, local socket permissions, and manager token budgets. A public Node may also schedule or execute; no permanent coordinator or task owner. Verify network and conversation scoping, complete DAG context and no side effects from replay."

[report]
language = "zh"
