<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <title>页面不存在 · Vibeface</title>
    <script>
      const systemDark = matchMedia('(prefers-color-scheme: dark)').matches;
      let dark = systemDark;
      try {
        const theme = localStorage.getItem('theme');
        dark = theme === 'dark' || ((!theme || theme === 'system') && systemDark);
      } catch {}
      document.documentElement.classList.toggle('dark', dark);
    </script>
    <style>:root{color-scheme:light;--bg:#f8faf8;--fg:#152019;--link:#166534}:root.dark{color-scheme:dark;--bg:#080b09;--fg:#f2f6f0;--link:#4ade80}body{font:16px system-ui,sans-serif;margin:0;padding:18vh 8vw;background:var(--bg);color:var(--fg)}a{color:var(--link)}h1{font-size:clamp(2.5rem,8vw,5rem);letter-spacing:-.06em}</style>
  </head>
  <body>
    <p>404 · 页面不存在</p>
    <h1>这条路径没有内容。</h1>
    <p><a href="/">回到 Vibeface 首页</a></p>
  </body>
</html>
