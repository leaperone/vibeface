[package]
name = "vibeface-core"
version = "0.0.1-hourly.2026111314"
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
argon2.workspace = true
alloy-primitives = { version = "=1.4.1", features = ["serde", "k256"] }
alloy-sol-types = "=1.4.1"
alloy-consensus = { version = "=1.0.41", features = ["k256"] }
alloy-eips = "=1.0.41"
axum.workspace = true
base64 = "0.22"
clap.workspace = true
chacha20poly1305 = "0.10.1"
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
k256 = { version = "0.13", features = ["ecdsa"] }
iroh.workspace = true
iroh-gossip = "0.102.0"
iroh-relay.workspace = true
mdns-sd = { version = "=0.21.6", default-features = false, features = ["async"] }
plist = "1.10"
rand.workspace = true
rcgen = "0.14"
reqwest.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
socket2 = "0.6"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite.workspace = true
tower-service = "0.3"
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
vibeface-protocol.workspace = true
vibeface-bridge.workspace = true
vibeface-control.workspace = true
vibeface-secure = { path = "../../crates/secure" }
vibeface-secure-ffi = { path = "../../crates/secure-ffi" }
vibeface-delivery = { path = "../../crates/delivery" }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
vibeface-client.workspace = true
