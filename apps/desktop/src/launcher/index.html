<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Vibeface</title>
    <link rel="stylesheet" href="./launcher.css" />
  </head>
  <body>
    <header class="identity">
      <svg class="mark" viewBox="0 0 1024 1024" role="img" aria-label="Vibeface">
        <rect width="1024" height="1024" rx="224" fill="#0B100D" />
        <g fill="none" stroke="#4ADE80" stroke-width="64" stroke-linecap="round" stroke-linejoin="round">
          <path d="M336 476 L400 404 L464 476" />
          <path d="M560 476 L624 404 L688 476" />
        </g>
        <rect x="442" y="580" width="140" height="72" rx="16" fill="#4ADE80" />
      </svg>
      <div class="identity-text">
        <h1>Vibeface</h1>
        <p id="scope" class="meta"></p>
      </div>
      <span id="indicator" class="indicator" data-tone="idle">
        <span class="dot" aria-hidden="true"></span>
        <span id="indicator-text">读取中</span>
      </span>
    </header>

    <main>
      <section id="card" class="card" aria-live="polite">
        <h2 id="headline"></h2>
        <p id="explain"></p>
        <p id="failure" class="failure" role="alert" hidden></p>
        <div id="actions" class="actions"></div>
        <p id="discovery-message" class="meta" aria-live="polite"></p>
        <ul id="nodes" class="node-list" aria-label="发现的本机节点"></ul>
        <section id="background-node" class="background-node" hidden aria-live="polite">
          <h3>后台节点</h3>
          <p id="background-message" class="meta"></p>
          <div id="background-actions" class="actions"></div>
        </section>
        <details id="diagnostics" class="diagnostics" hidden>
          <summary>连接详情</summary>
          <dl id="facts" class="facts"></dl>
        </details>
      </section>

      <details id="settings" class="settings">
        <summary>设置</summary>
        <div class="settings-body">
          <label class="toggle">
            <input id="auto-open" type="checkbox" role="switch" />
            <span class="toggle-text">
              连接后自动打开 Vibeface 窗口
              <span class="meta">连接就绪后直接进入 Vibeface。</span>
            </span>
          </label>
          <dl class="facts">
            <dt>桌面配置目录</dt>
            <dd id="profile-dir" class="path"></dd>
            <dt>捆绑的 Core 程序</dt>
            <dd id="core-path" class="path"></dd>
            <dt>桌面版本</dt>
            <dd id="version"></dd>
          </dl>
          <div class="actions">
            <button id="forget" type="button" class="ghost">清除记住的数据目录</button>
            <button id="releases" type="button" class="ghost">发行版本</button>
          </div>
        </div>
      </details>
    </main>

    <script src="./launcher.js"></script>
  </body>
</html>
