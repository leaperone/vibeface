name: Set up Rust
description: Install the Rust toolchain and only the components and targets requested by the job.
inputs:
  toolchain:
    description: Rust toolchain
    default: stable
  components:
    description: Extra Rust components, as a comma-separated list
  targets:
    description: Extra Rust targets, as a comma-separated list
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
