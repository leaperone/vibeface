name: Set up Node.js
description: Set up Node.js and, for pnpm workspace jobs, its package manager and cache.
inputs:
  node-version:
    description: Node.js version
    default: '24'
  pnpm:
    description: Set up the root package.json's package manager and lockfile cache
    default: 'false'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      if: inputs.pnpm == 'true'
      with:
        package_json_file: package.json
        run_install: 'false'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.pnpm == 'true' && 'pnpm' || '' }}
        cache-dependency-path: ${{ inputs.pnpm == 'true' && 'pnpm-lock.yaml' || '' }}
