name: mobile

# Extended platform build: run by hand or from the delivery proof workflow.
on:
  workflow_dispatch:
    inputs:
      runner_probe:
        description: 'Run only the temporary iOS runner diagnosis'
        type: boolean
        default: false
      feedback:
        description: 'Replace older ordinary mobile feedback on this branch'
        type: boolean
        default: false
  workflow_call:
    outputs:
      android_artifact_id:
        value: ${{ jobs.android.outputs.artifact_id }}
    inputs:
      android_only:
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && !inputs.runner_probe && inputs.feedback && github.run_attempt == 1 && 'feedback' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.runner_probe && inputs.feedback && github.run_attempt == 1 }}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  android:
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.runner_probe) && (inputs.android_only || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prepare the Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-mobile-secure.sh android
      - name: Verify generated native sources match this commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -B scripts/run-delivery-live.py --verify-source-commit "$SOURCE_COMMIT"
      - name: Build the release APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Bind release APK and native ABI bytes to this source commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/run-delivery-live.py --record-android-apk apps/mobile/android/app/build/outputs/apk/release --source-commit "$SOURCE_COMMIT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibeface-android-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/mobile-android/
          if-no-files-found: error

  ios-build:
    outputs:
      artifact_id: ${{ steps.inputs.outputs.artifact-id }}
      producer_attempt: ${{ github.run_attempt }}
    if: ${{ !inputs.android_only && github.event_name == 'workflow_dispatch' && !inputs.runner_probe }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ios-host-target-v1
          workspaces: |
            . -> target
            . -> .artifacts/native/target
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-mobile-secure.sh ios
      - name: Build the simulator app
        working-directory: apps/mobile
        run: |
          mkdir -p ../../.artifacts/native
          npx expo prebuild --platform ios
          xcodebuild -workspace ios/Vibeface.xcworkspace -scheme Vibeface -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath ../../.artifacts/native/ios-build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          # Ad-hoc signing writes the simulator entitlements into the binary; without them the Keychain refuses SecureStore.
          otool -l ../../.artifacts/native/ios-build/Build/Products/Release-iphonesimulator/Vibeface.app/Vibeface | grep -q "sectname __entitlements"
          cd ../../.artifacts/native/ios-build/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/.artifacts/native/vibeface-ios-simulator.zip" Vibeface.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibeface-ios-simulator-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/native/vibeface-ios-simulator.zip
          if-no-files-found: error
      - name: Build the same-source host Node and browser cryptography
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/native/target
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(uname -m)" = arm64
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          bash scripts/build-web-crypto.sh
          bash scripts/build-web.sh
          bash scripts/package-node.sh --target aarch64-apple-darwin --native-output .artifacts/native/host.tar.gz
      - name: Seal the complete public iOS acceptance input
        run: python3 scripts/build-inputs.py seal ios --app .artifacts/native/vibeface-ios-simulator.zip --native .artifacts/native/host.tar.gz --output .artifacts/native/ios-input.tar.gz
      - id: inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-input-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/native/ios-input.tar.gz
          if-no-files-found: error
          retention-days: 7

  ios-accept:
    needs: ios-build
    if: ${{ !inputs.android_only && github.event_name == 'workflow_dispatch' && !inputs.runner_probe }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter .
      - name: Require explicit producer artifact IDs
        env:
          ARTIFACT_IDS: ${{ needs.ios-build.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_IDS" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.ios-build.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/native-download
      - name: Restore and verify the successful producer input
        env:
          PRODUCER_ATTEMPT: ${{ needs.ios-build.outputs.producer_attempt }}
        run: |
          python3 scripts/build-inputs.py restore ios --input .artifacts/native-download/ios-input.tar.gz --output .artifacts/ios-input --producer-attempt "$PRODUCER_ATTEMPT"
          app=.artifacts/native/ios-build/Build/Products/Release-iphonesimulator/Vibeface.app
          codesign --verify --strict "$app"
          otool -l "$app/Vibeface" | grep -q 'sectname __entitlements'
          .artifacts/native/target/release/vibeface --version
          .artifacts/native/target/release/vibeface-core --version
          umask 077
          mkdir -p .artifacts/native/private
      - name: Create the dedicated iOS Provider simulator
        env:
          VIBEFACE_E2E_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          umask 077
          python3 - <<'PY'
          import json, os, pathlib, platform, re, subprocess
          pathlib.Path(".artifacts/native/private/stage.txt").write_text("simulator-create\n")
          assert platform.machine() == "arm64"
          app = pathlib.Path(".artifacts/native/ios-build/Build/Products/Release-iphonesimulator/Vibeface.app").resolve()
          assert "arm64" in subprocess.check_output(["lipo", "-archs", str(app / "Vibeface")], text=True).split()
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))["runtimes"]
          available = [row for row in runtimes if row.get("isAvailable") and ".SimRuntime.iOS-" in row["identifier"]]
          assert available, "A usable iOS runtime is required"
          runtime = max(available, key=lambda row: tuple(map(int, row["version"].split("."))))["identifier"]
          types = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "--json"]))["devicetypes"]
          device_type = next(row["identifier"] for row in types if row["name"] == "iPhone 17" and row["productFamily"] == "iPhone")
          name = "vibeface-provider-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          simulator = subprocess.check_output(["xcrun", "simctl", "create", name, device_type, runtime], text=True).strip()
          assert re.fullmatch(r"[a-fA-F0-9-]{36}", simulator)
          pathlib.Path(".artifacts/native/simulator.txt").write_text(simulator)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, value in {"VIBEFACE_E2E_SIMULATOR": simulator, "VIBEFACE_E2E_IOS_RUNTIME": runtime,
                                 "VIBEFACE_E2E_IOS_DEVICE_TYPE": device_type, "VIBEFACE_E2E_IOS_APP": str(app),
                                 "VIBEFACE_E2E_BINARY": str(pathlib.Path(".artifacts/native/target/release/vibeface").resolve()),
                                 "VIBEFACE_E2E_APP_DIR": str(pathlib.Path("apps/app/dist/client").resolve()),
                                 "VIBEFACE_E2E_CRYPTO_MODULE": str(pathlib.Path("apps/app/dist/client/vibeface_secure.js").resolve())}.items():
                  output.write(key + "=" + value + "\n")
          subprocess.run(["xcrun", "simctl", "boot", simulator], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", simulator, "-b"], check=True)
          PY
      - name: Verify Provider settings and cancellation in the installed iOS app
        env:
          VIBEFACE_E2E_SOURCE_COMMIT: ${{ github.sha }}
          E2E_TELEMETRY_DISABLED: '1'
        run: |
          umask 077
          printf '%s\n' typecheck > .artifacts/native/private/stage.txt
          pnpm test:e2e:check > .artifacts/native/private/typecheck.log 2>&1
          printf '%s\n' selection > .artifacts/native/private/stage.txt
          pnpm exec e2e list --config tests/e2e/e2e.native.config.ts --grep '^provider ' --reporter json > .artifacts/native/private/selection.json 2> .artifacts/native/private/selection.log
          python3 - <<'PY'
          import json
          pairs = json.load(open(".artifacts/native/private/selection.json"))["pairs"]
          assert len(pairs) == 1 and pairs[0]["disposition"] == "run", "Exactly one runnable native Provider test is required"
          PY
          printf '%s\n' ui-run > .artifacts/native/private/stage.txt
          set +e
          pnpm exec e2e run --config tests/e2e/e2e.native.config.ts --grep '^provider ' --action-timeout 240000 --trace off --video off --retries 0 > .artifacts/native/private/ui.log 2>&1
          result=$?
          set -e
          echo "Native Provider e2e exit code: $result"
          exit "$result"
      - name: Clean up this task and require final UI acceptance
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          umask 077
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, shutil, stat, subprocess
          root = pathlib.Path(".artifacts/native")
          public = root / "public"
          public.mkdir(parents=True, exist_ok=True, mode=0o700)
          receipt_path = public / "provider.json"
          receipt = json.loads(receipt_path.read_text()) if receipt_path.exists() else {"source_commit": os.environ["SOURCE_COMMIT"]}
          simulator_file = root / "simulator.txt"
          removed, fixture_stopped, selected_passed, private_removed = not simulator_file.exists(), False, False, False
          stage_path = root / "private/stage.txt"
          stage = stage_path.read_text().strip() if stage_path.exists() else "not_started"
          stages = {"host-source", "host-build", "simulator-create", "typecheck", "selection", "ui-run"}
          diagnostics = {"stage": stage if stage in stages else "not_started", "report": "missing", "failures": []}
          ui_log = root / "private/ui.log"
          if ui_log.exists():
              diagnostics["runner_prepare_fallback_reported"] = "automation runner not prepared" in ui_log.read_text(errors="replace")
          navigation_path = public / "provider-navigation.json"
          if navigation_path.exists():
              try:
                  navigation = json.loads(navigation_path.read_text())
                  keys = {"settings_visible", "connected_computer_link", "current_entry", "can_rename", "ai_link", "device_missing"}
                  assert set(navigation) == keys | {"stage"} and navigation["stage"] in {"settings", "device"}
                  assert all(value is None or type(value) is bool for key, value in navigation.items() if key in keys)
                  diagnostics["navigation"] = navigation
              except (OSError, ValueError, TypeError, AssertionError):
                  diagnostics["navigation"] = {"stage": "invalid"}

          def safe_error(error, source=None, api=None):
              if not isinstance(error, dict):
                  return None
              code = error.get("code")
              result = {"code": code if isinstance(code, str) and re.fullmatch(r"[A-Z][A-Z0-9_]{0,63}", code) else "UNCLASSIFIED_ERROR"}
              message = error.get("message")
              if code == "ENGINE_FAILURE" and isinstance(message, str):
                  lowered = message.lower()
                  result["engine_timeout_kind"] = next((kind for needle, kind in (
                      ("timed out while reading snapshot viewport on the xctest main thread", "snapshot-viewport"),
                      ("timed out while reading private ax viewport on the xctest main thread", "snapshot-private-ax"),
                      ("timed out while processing tree snapshot on the xctest main thread", "snapshot-tree"),
                      ("timed out while running query-sweep snapshot on the xctest main thread", "snapshot-query-sweep"),
                      ("main thread execution timed out", "runner-main-thread"),
                      ("daemon request timed out", "daemon-rpc"),
                      ("runner connection deadline exceeded", "runner-connect"),
                      ("runner command deadline exceeded", "runner-command"),
                      ("timed out waiting for xctest runner over usbmux", "runner-usbmux"),
                  ) if needle in lowered), "unknown")
                  if "the xctest tree capture exceeded its " in lowered and "s time slice" in lowered:
                      result["engine_timeout_kind"] = "snapshot-tree-slice"
                  result["engine_reason"] = next((reason for needle, reason in (
                      ("could not be masked", "secure-mask"),
                      ("no focused text input was available for typing", "text-input-not-focused"),
                      ("reliable text synthesis is unavailable while the software keyboard is hidden", "text-synthesis-unavailable"),
                      ("the runner could not confirm the typed text reached the field", "text-commit-unobserved"),
                      ("the runner could not clear the field before typing", "text-clear-unobserved"),
                      ("the text is longer than one runner command can type at this pace", "text-synthesis-budget"),
                      ("text entry read-back did not match", "text-entry-mismatch"),
                      ("no text input found at the provided coordinates to clear", "text-input-target-missing"),
                      ("no focused text input to clear", "text-input-target-missing"),
                      ("xctest recorded a failure while executing", "xctest-recorded-failure"),
                      ("app_not_running", "app-not-running"),
                      ("app is not running", "app-not-running"),
                      ("main thread", "main-thread"),
                      ("main-thread", "main-thread"),
                      ("wedged", "runner-wedged"),
                      ("runner busy", "runner-busy"),
                      ("presentation", "presentation"),
                      ("timed out", "timeout"),
                      ("snapshot", "snapshot"),
                      ("screenshot", "screenshot"),
                  ) if needle in lowered), "unknown")
              source = error.get("source", source)
              if isinstance(source, dict) and source.get("file") in {"native-transfers.e2e.ts", "e2e.native.config.ts"}:
                  line = source.get("line")
                  if type(line) is int and 1 <= line <= 100000:
                      result.update(file=source["file"], line=line)
              if api in {"app.open", "app.screenshot", "device.installApp", "device.clearKeychain", "device.openLink", "device.dismissKeyboard",
                         "screen.scrollUntilVisible", "locator.click", "locator.tap", "locator.fill", "expect.toBeVisible", "expect.toBeHidden",
                         "expect.toHaveAccessibleName", "expect.toEqual", "expect.toBe", "expect.poll"}:
                  result["api"] = api
              if error.get("phase") in {"config", "collection", "filter", "launch", "beforeAll", "beforeEach", "body", "afterEach", "afterAll", "cleanup", "report"}:
                  result["phase"] = error["phase"]
              return result

          runner_root = pathlib.Path("tests/e2e/.artifacts/native")
          report_path = runner_root / "e2e/report.json"
          if report_path.exists():
              try:
                  run = json.loads(report_path.read_text())["run"]
                  diagnostics["report"] = "present"
                  summary = run["summary"]
                  selected_passed = run["exitCode"] == 0 and not run["errors"] and summary["selected"] == summary["passed"] == 1 and all(
                      summary[key] == 0 for key in ("failed", "skipped", "interrupted", "flaky"))
                  failures = [safe_error(error) for error in run["errors"]]
                  for result in run["results"]:
                      for attempt in result["attempts"]:
                          failures += [safe_error(error, result.get("source")) for error in [attempt.get("error"), *attempt.get("secondaryErrors", [])]]
                          for step in attempt["steps"]:
                              failure = safe_error(step.get("error"), step.get("source"), step.get("api"))
                              if failure:
                                  events = step.get("events")
                                  polls = [event for event in events if isinstance(event, dict) and event.get("kind") == "poll" and event.get("name") == "expect"] if isinstance(events, list) else []
                                  if len(polls) == 1 and type(polls[0].get("count")) is int and polls[0]["count"] >= 0:
                                      failure["completed_poll_samples"] = polls[0]["count"]
                                  failures.append(failure)
                          source = result.get("source")
                          if result.get("selected") is True and isinstance(source, dict) and source.get("file") == "native-transfers.e2e.ts" and attempt.get("status") == "failed":
                              screen = {"status": "unavailable", "reason": "missing_screen_id"}
                              descriptors = []
                              try:
                                  evidence = attempt.get("failure")
                                  assert isinstance(evidence, dict)
                                  screen_id = evidence.get("screen")
                                  assert isinstance(screen_id, str) and screen_id
                                  screen["reason"] = "invalid_metadata"
                                  artifacts = attempt.get("artifacts")
                                  assert isinstance(artifacts, list)
                                  matches = [item for item in artifacts if isinstance(item, dict) and item.get("id") == screen_id]
                                  assert len(matches) == 1
                                  artifact = matches[0]
                                  assert artifact.get("kind") == "log" and artifact.get("mediaType") == "text/plain" and artifact.get("redaction") == "complete"
                                  assert artifact.get("url") is None and artifact.get("ref") is None
                                  size, digest, name = artifact.get("size"), artifact.get("sha256"), artifact.get("path")
                                  assert type(size) is int and 0 <= size <= 262144 and isinstance(digest, str) and re.fullmatch(r"[a-f0-9]{64}", digest)
                                  screen["reason"] = "unsafe_path"
                                  assert isinstance(name, str) and name and "\\" not in name and "\0" not in name and "trash" not in name.lower()
                                  parts = name.split("/")
                                  assert len(parts) <= 16 and all(part not in {"", ".", ".."} for part in parts) and not re.match(r"[A-Za-z]:", name)
                                  assert len(parts) >= 3 and re.fullmatch(r"attempt-[1-9][0-9]*", parts[-2]) and parts[-1] == "screen-at-failure.txt"
                                  screen["reason"] = "file_unavailable"
                                  descriptor = os.open(".", os.O_RDONLY | os.O_DIRECTORY)
                                  descriptors.append(descriptor)
                                  for part in (*runner_root.parts, "e2e", "results", *parts[:-1]):
                                      descriptor = os.open(part, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW, dir_fd=descriptor)
                                      descriptors.append(descriptor)
                                  descriptor = os.open(parts[-1], os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=descriptor)
                                  descriptors.append(descriptor)
                                  metadata = os.fstat(descriptor)
                                  screen["reason"] = "metadata_mismatch"
                                  assert stat.S_ISREG(metadata.st_mode) and metadata.st_size == size
                                  content = os.read(descriptor, 262145)
                                  assert len(content) == size and hashlib.sha256(content).hexdigest() == digest
                                  screen["reason"] = "invalid_encoding"
                                  listing = content.decode("utf-8")
                                  controls = {}
                                  for key, role, label in (
                                      ("welcome", None, "连接你的网络"), ("ready", None, "已填入加入链接"),
                                      ("invitation", "textbox", "加入链接"), ("device_name", "textbox", "这台设备的名字"),
                                      ("join", "button", "加入"), ("invalid_link", None, "这不是有效的加入链接"),
                                      ("add_device", None, "添加设备"), ("open_button", "button", "Open"), ("cancel_button", "button", "Cancel"),
                                      ("spent_link", None, "这条加入链接已用过或已过期。在已有设备上点“添加设备”重新生成。"),
                                  ):
                                      prefix = r"^\s*#\S+ " + (re.escape(role) + " " if role else r"(?:[a-z-]+ )?")
                                      quoted = re.escape(json.dumps(label, ensure_ascii=False))
                                      pattern = prefix + (quoted[:-1] + r'(?=["\s,，])' if role == "textbox" else quoted + r"(?:\s|$)")
                                      controls[key] = True if re.search(pattern, listing, re.MULTILINE) else None
                                  markers = {"[observation truncated at the resolved observation byte limit]", "[observation truncated: the engine stopped listing nodes at its limit]"}
                                  screen = {"status": "captured", "controls_reported": controls, "truncation_marker_reported": any(line in markers for line in listing.splitlines())}
                              except (AssertionError, OSError, ValueError, TypeError):
                                  pass
                              finally:
                                  for descriptor in reversed(descriptors):
                                      os.close(descriptor)
                              diagnostics["failure_screen"] = screen
                  for failure in failures:
                      if failure and failure not in diagnostics["failures"] and len(diagnostics["failures"]) < 16:
                          diagnostics["failures"].append(failure)
              except (OSError, ValueError, KeyError, TypeError):
                  diagnostics["report"] = "unreadable"
                  selected_passed = False
          try:
              if simulator_file.exists():
                  simulator = simulator_file.read_text().strip()
                  assert re.fullmatch(r"[a-fA-F0-9-]{36}", simulator)
                  devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "--json"]))["devices"]
                  matches = [row for rows in devices.values() for row in rows if row["udid"] == simulator]
                  expected = "vibeface-provider-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
                  assert len(matches) == 1 and matches[0]["name"] == expected
                  if matches[0]["state"] != "Shutdown":
                      subprocess.run(["xcrun", "simctl", "shutdown", simulator], check=True, stdout=subprocess.DEVNULL)
                  subprocess.run(["xcrun", "simctl", "delete", simulator], check=True, stdout=subprocess.DEVNULL)
                  removed = True
              cleanup = root / "network/cleanup.json"
              fixture_stopped = cleanup.exists() and json.loads(cleanup.read_text()).get("fixture_stopped") is True
          except Exception:
              diagnostics["stage"] = "cleanup"
          finally:
              try:
                  for path in [*(root / name for name in ("network", "agent-device", "cache", "e2e", "private")), runner_root]:
                      assert not path.is_symlink()
                      if path.exists():
                          shutil.rmtree(path)
                  private_removed = True
              except Exception:
                  diagnostics["stage"] = "cleanup"
              finally:
                  passed = receipt.get("status") == "ui_passed" and removed and fixture_stopped and selected_passed and private_removed
                  if receipt.get("status") == "ui_passed" and not passed:
                      diagnostics["stage"] = "cleanup"
                  receipt.update(status="passed" if passed else "failed", simulator_removed=removed, fixture_stopped=fixture_stopped,
                                 private_state_removed=private_removed, selected_test_passed=selected_passed,
                                 diagnostics=diagnostics, run_id=os.environ["GITHUB_RUN_ID"], run_attempt=os.environ["GITHUB_RUN_ATTEMPT"])
                  receipt_path.write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(diagnostics, sort_keys=True))
          raise SystemExit(0 if passed else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && !cancelled() }}
        with:
          name: native-provider-ios-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/native/public/provider.json
            .artifacts/native/public/provider-probe.json
            .artifacts/native/public/provider-initial.png
            .artifacts/native/public/provider-selectable.png
            .artifacts/native/public/provider-controlled.png
            .artifacts/native/public/provider-typed.png
            .artifacts/native/public/terminology-device-kinds.png
          if-no-files-found: error
          retention-days: 7

  mobile-gate:
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.runner_probe) }}
    needs: [android, ios-build, ios-accept]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require all selected mobile jobs
        env:
          MOBILE_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py mobile-gate --needs-env MOBILE_NEEDS ${{ inputs.android_only && '--android-only' || '' }}

  runner-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_probe }}
