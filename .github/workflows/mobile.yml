                                  screen["reason"] = "invalid_encoding"
                                  listing = content.decode("utf-8")
                                  controls = {}
                                  for key, role, label in (
                                      ("welcome", None, "连接你的网络"), ("ready", None, "已填入加入链接"),
                                      ("invitation", "textbox", "加入链接"), ("device_name", "textbox", "这台设备的名字"),
                                      ("join", "button", "加入"), ("invalid_link", None, "这不是有效的加入链接"),
                                      ("add_device", None, "添加设备"), ("open_button", "button", "Open"), ("cancel_button", "button", "Cancel"),
                                      ("spent_link", None, "这条加入链接已用过或已过期。在已有设备上点“添加设备”重新生成。"),
                                  ):
                                      prefix = r"^\s*#\S+ " + (re.escape(role) + " " if role else r"(?:[a-z-]+ )?")
                                      quoted = re.escape(json.dumps(label, ensure_ascii=False))
                                      pattern = prefix + (quoted[:-1] + r'(?=["\s,，])' if role == "textbox" else quoted + r"(?:\s|$)")
                                      controls[key] = True if re.search(pattern, listing, re.MULTILINE) else None
                                  markers = {"[observation truncated at the resolved observation byte limit]", "[observation truncated: the engine stopped listing nodes at its limit]"}
                                  screen = {"status": "captured", "controls_reported": controls, "truncation_marker_reported": any(line in markers for line in listing.splitlines())}
                              except (AssertionError, OSError, ValueError, TypeError):
                                  pass
                              finally:
                                  for descriptor in reversed(descriptors):
                                      os.close(descriptor)
                              diagnostics["failure_screen"] = screen
                  for failure in failures:
                      if failure and failure not in diagnostics["failures"] and len(diagnostics["failures"]) < 16:
                          diagnostics["failures"].append(failure)
              except (OSError, ValueError, KeyError, TypeError):
                  diagnostics["report"] = "unreadable"
                  selected_passed = False
          try:
              if simulator_file.exists():
                  simulator = simulator_file.read_text().strip()
                  assert re.fullmatch(r"[a-fA-F0-9-]{36}", simulator)
                  devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "--json"]))["devices"]
                  matches = [row for rows in devices.values() for row in rows if row["udid"] == simulator]
                  expected = "vibeface-provider-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
                  assert len(matches) == 1 and matches[0]["name"] == expected
                  if matches[0]["state"] != "Shutdown":
