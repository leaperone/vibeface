name: CI / Mobile builds
run-name: >-
  Mobile builds · ${{ github.event_name }} · ${{ github.ref_name }} ·
  ${{ (inputs.android_only || inputs.platforms == 'android') && 'Android native build' || inputs.platforms == 'ios' && 'iOS simulator build' || github.event_name == 'workflow_dispatch' && 'Android native build + iOS simulator build' || 'no platform selected' }}

# iOS simulator and Android native builds, separate from device archives.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Android native build or iOS simulator build
        type: choice
        options: [all, android, ios]
        default: all
  workflow_call:
    inputs:
      android_only:
        type: boolean
        default: false

concurrency:
  group: ci-mobile-ui-${{ github.workflow }}-${{ github.ref }}-${{ inputs.android_only && 'android' || inputs.platforms || 'all' }}${{ github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.run_attempt == 1 }}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  android:
    name: Android native build
    if: inputs.android_only || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'ios')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prepare the Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-mobile-secure.sh android
      - name: Verify generated native sources match this commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -B scripts/run-delivery-live.py --verify-source-commit "$SOURCE_COMMIT"
      - name: Build the release APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew :lan-browser:testDebugUnitTest --tests one.leaper.vibeface.lanbrowser.DiscoveryLifetimeTest --build-cache
          ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Bind release APK and native ABI bytes to this source commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/run-delivery-live.py --record-android-apk apps/mobile/android/app/build/outputs/apk/release --source-commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibeface-android-${{ github.sha }}
          path: .artifacts/mobile-android/
          if-no-files-found: error

  ios:
    name: iOS simulator build
    if: ${{ !inputs.android_only && github.event_name == 'workflow_dispatch' && inputs.platforms != 'android' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          key: native-targets-${{ hashFiles('scripts/release-rustflags.py') }}
          workspaces: |
            . -> target
            . -> .artifacts/native/target
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # The app embeds no commit, so a rerun or an unrelated change reuses the app built from the
      # same inputs, Xcode image and Rust toolchain instead of spending its build again.
      - name: Key the simulator app by its inputs
        id: app
        run: echo "key=ios-simulator-app-$ImageOS-$ImageVersion-$( (rustc -V; node -v) | shasum -a 256 | cut -c1-16)-${{ hashFiles('apps/mobile/**', 'packages/**', '!packages/docs/**', 'crates/**', 'config/**', 'package.json', 'pnpm-workspace.yaml', 'Cargo.toml', 'Cargo.lock', 'pnpm-lock.yaml', 'scripts/build-mobile-secure.sh', 'scripts/release-rustflags.py', '.github/workflows/mobile.yml', '!**/node_modules/**') }}" >> "$GITHUB_OUTPUT"
      - name: Restore the simulator app built from the same inputs
        id: app_cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .artifacts/native/ios-build/Build/Products/Release-iphonesimulator/Vibeface.app
          key: ${{ steps.app.outputs.key }}
      - run: pnpm install --frozen-lockfile
      - name: Check native mobile types before the simulator build
        run: |
          pnpm --filter @vibeface/secure-native run typecheck
          pnpm --filter vibeface-mobile run typecheck
      - if: steps.app_cache.outputs.cache-hit != 'true'
        run: scripts/build-mobile-secure.sh ios
      - name: Build the simulator app
        if: steps.app_cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios
          xcodebuild -workspace ios/Vibeface.xcworkspace -scheme Vibeface -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath ../../.artifacts/native/ios-build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          # Only an app built from the committed sources, including the regenerated bindings, may be cached.
          test -z "$(git status --porcelain --untracked-files=normal)"
      - name: Save the simulator app for the same inputs
        if: steps.app_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .artifacts/native/ios-build/Build/Products/Release-iphonesimulator/Vibeface.app
          key: ${{ steps.app.outputs.key }}
      - name: Package the simulator app
        run: |
          mkdir -p .artifacts/native
          # Ad-hoc signing writes the simulator entitlements into the binary; without them the Keychain refuses SecureStore.
          otool -l .artifacts/native/ios-build/Build/Products/Release-iphonesimulator/Vibeface.app/Vibeface | grep -q "sectname __entitlements"
          cd .artifacts/native/ios-build/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/.artifacts/native/vibeface-ios-simulator.zip" Vibeface.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibeface-ios-simulator-${{ github.sha }}
          path: .artifacts/native/vibeface-ios-simulator.zip
          if-no-files-found: error
