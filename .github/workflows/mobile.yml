              catch { report.cleanup.daemon_stop = 'failed'; }
            } else report.cleanup.daemon_stop = 'absent';
            if (existsSync(simulatorPath)) {
              const simulator = readFileSync(simulatorPath, 'utf8').trim();
              assert(/^[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}$/i.test(simulator));
              for (const [command, key] of [['shutdown', 'simulator_shutdown'], ['delete', 'simulator_delete']]) {
                try { raw('xcrun', ['simctl', command, simulator], true); report.cleanup[key] = 'passed'; }
                catch { report.cleanup[key] = 'failed'; }
              }
            } else {
