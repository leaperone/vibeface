          if census_module.artifact_layout_safe(repo) and all(not path.is_symlink() for path in public.iterdir()):
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write("safe_public_artifacts=true\n")
          raise SystemExit(0 if passed else 1)
          PY
