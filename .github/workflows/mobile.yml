                  marker_info = marker.lstat()
                  assert stat.S_ISREG(marker_info.st_mode) and marker_info.st_size <= 128
                  simulator = marker.read_text(encoding="utf-8").strip()
                  assert re.fullmatch(r"[a-fA-F0-9-]{36}", simulator)
                  expected = "vibeface-provider-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
                  devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "--json"], timeout=5))["devices"]
                  matches = [row for rows in devices.values() for row in rows if row["udid"].casefold() == simulator.casefold()]
                  assert len(matches) == 1 and matches[0]["name"] == expected and matches[0]["state"] == "Booted"
                  return public_census_projection(value)
              except (OSError, subprocess.SubprocessError, ValueError, TypeError, AssertionError, KeyError):
                  return {"status": "invalid"}

          diagnostics["driver"] = safe_driver_diagnostic()
          diagnostics["runner_prepare"] = safe_runner_prepare()
          diagnostics["ios_actor_census"] = safe_actor_census()

          runner_root = pathlib.Path("tests/e2e/.artifacts/native")
          report_path = runner_root / "e2e/report.json"
          canonical_report = report_path.exists()
          exit_path = root / "private/ui-exit-code.txt"
          ui_log = root / "private/ui.log"
          if exit_path.exists():
              value = exit_path.read_text().strip()
              if re.fullmatch(r"[0-9]{1,3}", value) and int(value) <= 255:
                  diagnostics["runner_exit_code"] = int(value)
          if not canonical_report and ui_log.exists():
              logged = ui_log.read_text(errors="replace")
              for code in ("ENVIRONMENT_UNAVAILABLE", "ENGINE_FAILURE", "CONFIG_LOAD_FAILED", "INVALID_CONFIG", "SESSION_UNAVAILABLE", "SESSION_CONTRACT", "INTERNAL_ERROR"):
                  match = re.search(r"(?m)^" + code + r": ([^\n]*)", logged)
                  if match:
                      diagnostics["failures"].append(safe_error({"code": code, "message": match[1]}))
                      break

          if not canonical_report:
              report_path = root / "private/ui.json"
          if report_path.exists():
              try:
                  run = json.loads(report_path.read_text())["run"]
                  diagnostics["report"] = "present" if canonical_report else "stdout_only"
                  summary = run["summary"]
                  selected_passed = canonical_report and run["exitCode"] == 0 and not run["errors"] and summary["selected"] == summary["passed"] == 1 and all(
                      summary[key] == 0 for key in ("failed", "skipped", "interrupted", "flaky"))
                  failures = [safe_error(error) for error in run["errors"]]
                  for result in run["results"]:
                      for attempt in result["attempts"]:
                          failures += [safe_error(error, result.get("source")) for error in [attempt.get("error"), *attempt.get("secondaryErrors", [])]]
                          for step in attempt["steps"]:
                              failure = safe_error(step.get("error"), step.get("source"), step.get("api"))
                              if failure:
                                  events = step.get("events")
                                  polls = [event for event in events if isinstance(event, dict) and event.get("kind") == "poll" and event.get("name") == "expect"] if isinstance(events, list) else []
                                  if len(polls) == 1 and type(polls[0].get("count")) is int and polls[0]["count"] >= 0:
                                      failure["completed_poll_samples"] = polls[0]["count"]
                                  failures.append(failure)
                          source = result.get("source")
                          if result.get("selected") is True and isinstance(source, dict) and source.get("file") == "native-transfers.e2e.ts" and attempt.get("status") == "failed":
                              screen = {"status": "unavailable", "reason": "missing_screen_id"}
                              descriptors = []
                              try:
                                  evidence = attempt.get("failure")
                                  assert isinstance(evidence, dict)
                                  screen_id = evidence.get("screen")
