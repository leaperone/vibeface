            'runner_reply_lost', 'runner_connect_refused', 'runner_endpoint_probe_exhausted',
            'runner_readiness_preflight_failed', 'runner_cache_uncertifiable', 'runner_process_dead',
            'runner_reported_failure', 'xcodebuild_exited_early', 'simulator_service_hub_unavailable',
            'simulator_set_destination_not_found', 'build_failed_unclassified',
            'IOS_RUNNER_CONNECT_TIMEOUT', 'IOS_RUNNER_DEVICE_NOT_PROVISIONED', 'BOOT_COMMAND_FAILED',
