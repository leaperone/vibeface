name: mobile

# Extended platform build: run by hand or from the delivery proof workflow.
on:
  workflow_dispatch:
    inputs:
      feedback:
        description: 'Replace older ordinary mobile feedback on this branch'
        type: boolean
        default: false
      platforms:
        description: Native mobile platforms to build and verify
        type: choice
        options: [all, android, ios]
        default: all
  workflow_call:
    outputs:
      android_artifact_id:
        value: ${{ jobs.android.outputs.artifact_id }}
    inputs:
      android_only:
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.ref }}-${{ inputs.android_only && 'android-only' || inputs.platforms || 'all' }}-${{ github.event_name == 'workflow_dispatch' && !inputs.android_only && inputs.feedback && github.run_attempt == 1 && 'feedback' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && !inputs.android_only && inputs.feedback && github.run_attempt == 1 }}

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  android:
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    if: inputs.android_only || (github.event_name == 'workflow_dispatch' && inputs.platforms != 'ios')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prepare the Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-mobile-secure.sh android
      - name: Verify generated native sources match this commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -B scripts/run-delivery-live.py --verify-source-commit "$SOURCE_COMMIT"
      - name: Build the release APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Bind release APK and native ABI bytes to this source commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/run-delivery-live.py --record-android-apk apps/mobile/android/app/build/outputs/apk/release --source-commit "$SOURCE_COMMIT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibeface-android-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/mobile-android/
          if-no-files-found: error

  ios-build:
    outputs:
      artifact_id: ${{ steps.inputs.outputs.artifact-id }}
      producer_attempt: ${{ github.run_attempt }}
    if: ${{ !inputs.android_only && github.event_name == 'workflow_dispatch' && inputs.platforms != 'android' }}
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ios-host-target-v1
          workspaces: |
            . -> target
            . -> .artifacts/native/target
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-mobile-secure.sh ios
      - name: Build the simulator app
        working-directory: apps/mobile
        run: |
          mkdir -p ../../.artifacts/native
          npx expo prebuild --platform ios
          xcodebuild -workspace ios/Vibeface.xcworkspace -scheme Vibeface -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath ../../.artifacts/native/ios-build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          # Ad-hoc signing writes the simulator entitlements into the binary; without them the Keychain refuses SecureStore.
          otool -l ../../.artifacts/native/ios-build/Build/Products/Release-iphonesimulator/Vibeface.app/Vibeface | grep -q "sectname __entitlements"
          cd ../../.artifacts/native/ios-build/Build/Products/Release-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/.artifacts/native/vibeface-ios-simulator.zip" Vibeface.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibeface-ios-simulator-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/native/vibeface-ios-simulator.zip
          if-no-files-found: error
      - name: Build the same-source host Node and browser cryptography
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/native/target
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=normal)"
          test "$(uname -m)" = arm64
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          bash scripts/build-web-crypto.sh
          bash scripts/build-web.sh
          bash scripts/package-node.sh --target aarch64-apple-darwin --native-output .artifacts/native/host.tar.gz
      - name: Seal the complete public iOS acceptance input
        run: python3 scripts/build-inputs.py seal ios --app .artifacts/native/vibeface-ios-simulator.zip --native .artifacts/native/host.tar.gz --output .artifacts/native/ios-input.tar.gz
      - id: inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-input-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/native/ios-input.tar.gz
          if-no-files-found: error
          retention-days: 7

  ios-accept:
    needs: ios-build
    if: ${{ !inputs.android_only && github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter .
      - name: Require explicit producer artifact IDs
        env:
          ARTIFACT_IDS: ${{ needs.ios-build.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_IDS" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.ios-build.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/native-download
      - name: Restore and verify the successful producer input
        env:
          PRODUCER_ATTEMPT: ${{ needs.ios-build.outputs.producer_attempt }}
        run: |
          python3 scripts/build-inputs.py restore ios --input .artifacts/native-download/ios-input.tar.gz --output .artifacts/ios-input --producer-attempt "$PRODUCER_ATTEMPT"
          app=.artifacts/native/ios-build/Build/Products/Release-iphonesimulator/Vibeface.app
          codesign --verify --strict "$app"
          otool -l "$app/Vibeface" | grep -q 'sectname __entitlements'
          .artifacts/native/target/release/vibeface --version
          .artifacts/native/target/release/vibeface-core --version
          umask 077
          mkdir -p .artifacts/native/private
      - name: Create the dedicated iOS Provider simulator
        env:
          VIBEFACE_E2E_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          umask 077
          python3 - <<'PY'
          import json, os, pathlib, platform, re, subprocess
          pathlib.Path(".artifacts/native/private/stage.txt").write_text("simulator-create\n")
          assert platform.machine() == "arm64"
          app = pathlib.Path(".artifacts/native/ios-build/Build/Products/Release-iphonesimulator/Vibeface.app").resolve()
          assert "arm64" in subprocess.check_output(["lipo", "-archs", str(app / "Vibeface")], text=True).split()
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "--json"]))["runtimes"]
          available = [row for row in runtimes if row.get("isAvailable") and ".SimRuntime.iOS-" in row["identifier"]]
          assert available, "A usable iOS runtime is required"
          runtime = max(available, key=lambda row: tuple(map(int, row["version"].split("."))))["identifier"]
          types = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devicetypes", "--json"]))["devicetypes"]
          device_type = next(row["identifier"] for row in types if row["name"] == "iPhone 17" and row["productFamily"] == "iPhone")
          name = "vibeface-provider-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
          simulator = subprocess.check_output(["xcrun", "simctl", "create", name, device_type, runtime], text=True).strip()
          assert re.fullmatch(r"[a-fA-F0-9-]{36}", simulator)
          pathlib.Path(".artifacts/native/simulator.txt").write_text(simulator)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              for key, value in {"VIBEFACE_E2E_SIMULATOR": simulator, "VIBEFACE_E2E_IOS_RUNTIME": runtime,
                                 "VIBEFACE_E2E_IOS_DEVICE_TYPE": device_type, "VIBEFACE_E2E_IOS_APP": str(app),
                                 "VIBEFACE_E2E_BINARY": str(pathlib.Path(".artifacts/native/target/release/vibeface").resolve()),
                                 "VIBEFACE_E2E_APP_DIR": str(pathlib.Path("apps/app/dist/client").resolve()),
                                 "VIBEFACE_E2E_CRYPTO_MODULE": str(pathlib.Path("apps/app/dist/client/vibeface_secure.js").resolve())}.items():
                  output.write(key + "=" + value + "\n")
          subprocess.run(["xcrun", "simctl", "boot", simulator], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", simulator, "-b"], check=True)
          PY
      - name: Prepare the task simulator's XCTest runner
        env:
          AGENT_DEVICE_HOME: ${{ github.workspace }}/.artifacts/native/agent-device
          AGENT_DEVICE_STATE_DIR: ${{ github.workspace }}/.artifacts/native/agent-device
          AGENT_DEVICE_SESSION: vdp-native-acceptance
        run: |
          umask 077
          printf '%s\n' runner-prepare > .artifacts/native/private/stage.txt
          [[ "$VIBEFACE_E2E_SIMULATOR" =~ ^[a-fA-F0-9-]{36}$ ]]
          test "$(cat .artifacts/native/simulator.txt)" = "$VIBEFACE_E2E_SIMULATOR"
          agent_device_bin="$(node -e 'const fs = require("node:fs"); const path = require("node:path"); const entry = require.resolve("@e2e-dev/mobile"); const container = path.resolve(path.dirname(path.dirname(entry)), "..", ".."); const pkg = fs.realpathSync(path.join(container, "agent-device")); const bin = path.join(pkg, "bin", "agent-device.mjs"); if (!fs.existsSync(bin)) process.exit(2); process.stdout.write(bin)')"
          if AGENT_DEVICE_HOME="$GITHUB_WORKSPACE/.artifacts/native/agent-device" \
             AGENT_DEVICE_STATE_DIR="$GITHUB_WORKSPACE/.artifacts/native/agent-device" \
             node "$agent_device_bin" prepare ios-runner --platform ios --udid "$VIBEFACE_E2E_SIMULATOR" --json \
               > .artifacts/native/private/ios-runner-prepare.raw.json \
               2> .artifacts/native/private/ios-runner-prepare.stderr.log; then
            prepare_exit_code=0
          else
            prepare_exit_code=$?
          fi
          PREPARE_EXIT_CODE="$prepare_exit_code" python3 - <<'PY'
          import json, math, os, pathlib, sys
          raw_path = pathlib.Path(".artifacts/native/private/ios-runner-prepare.raw.json")
          error_path = pathlib.Path(".artifacts/native/private/ios-runner-prepare.stderr.log")
          summary_path = pathlib.Path(".artifacts/native/private/ios-runner-prepare.json")
          def prepare_error_detail(error):
              codes = {"INVALID_ARGS", "DEVICE_NOT_FOUND", "DEVICE_IN_USE", "TOOL_MISSING", "APP_NOT_INSTALLED",
                       "UNSUPPORTED_PLATFORM", "UNSUPPORTED_OPERATION", "NOT_IMPLEMENTED", "COMMAND_FAILED",
                       "SESSION_NOT_FOUND", "UNAUTHORIZED", "AMBIGUOUS_MATCH", "REPLAY_DIVERGENCE",
                       "REPAIR_SESSION_EXPIRED", "REPAIR_COMMIT_FAILED", "UNKNOWN"}
              if not isinstance(error, dict):
                  return {"code": "unknown"}
              code = error.get("code")
              result = {"code": code if isinstance(code, str) and code in codes else "unknown"}
              details = error.get("details")
              if not isinstance(details, dict):
                  return result
              projected = {}
              for key, allowed in (
                  ("reason", {"runner_start_budget_exhausted", "runner_phase_budget_exhausted", "prepare_deadline_expired",
                              "simulator_set_destination_not_found", "simulator_service_hub_unavailable", "build_failed_unclassified",
                              "bundle_identifier_already_registered", "signing_no_development_team", "signing_provisioning_profile_missing",
                              "signing_unspecified", "devtools_security_developer_mode_disabled", "device_developer_disk_image_unavailable",
                              "IOS_RUNNER_CONNECT_TIMEOUT", "IOS_RUNNER_DEVICE_NOT_PROVISIONED", "IOS_BOOT_TIMEOUT", "IOS_TOOL_MISSING",
                              "BOOT_COMMAND_FAILED", "CI_RESOURCE_STARVATION_SUSPECTED", "UNKNOWN", "request_canceled",
                              "daemon_transport_timeout", "daemon_transport_failure", "startup-stalled", "startup-ceiling", "startup-exited"}),
                  ("runnerConnectFailureReason", {"runner_connect_refused", "runner_endpoint_probe_exhausted", "xcodebuild_exited_early"}),
                  ("phase", {"runner_session", "runner_rebuild", "runner_health", "runner_xctestrun_build"}),
              ):
                  value = details.get(key)
                  if isinstance(value, str) and value in allowed:
                      projected[key] = value
              for key in ("timeoutMs", "startupTimeoutMs"):
                  value = details.get(key)
                  if type(value) in {int, float} and 0 <= value <= 600000:
                      projected[key] = value
              attempts = details.get("startupAttempts")
              if type(attempts) is int and 1 <= attempts <= 2:
                  projected["startupAttempts"] = attempts
              xcodebuild_result = details.get("xcodebuild")
              value = xcodebuild_result.get("exitCode") if isinstance(xcodebuild_result, dict) else None
              if type(value) is int and 0 <= value <= 255:
                  projected["xcodebuild"] = {"exitCode": value}
              if projected:
                  result["details"] = projected
              return result

          def read_prepare_error():
              try:
                  if raw_path.is_symlink() or not raw_path.is_file():
                      return {"code": "unknown"}
                  with raw_path.open("rb") as stream:
                      raw = stream.read(262145)
                  assert len(raw) <= 262144
                  result = json.loads(raw)
                  assert isinstance(result, dict) and result.get("success") is False
                  return prepare_error_detail(result.get("error"))
              except (OSError, ValueError, TypeError, AssertionError, RecursionError):
                  return {"code": "unknown"}

          def write_failure(reason, exit_code, error=None):
              summary = {"status": "failed", "reason": reason, "exit_code": exit_code}
              if error is not None:
                  summary["error"] = error
              summary_path.write_text(json.dumps(summary) + "\n")
              print("iOS XCTest runner preparation failed: " + reason, file=sys.stderr)
              raise SystemExit(1)

          def tail(path):
              if path.is_symlink() or not path.is_file():
                  return ""
              size = path.stat().st_size
              with path.open("rb") as stream:
                  stream.seek(max(0, size - 32768))
                  return stream.read(32768).decode("utf-8", errors="replace")

          exit_code = int(os.environ["PREPARE_EXIT_CODE"])
          if exit_code != 0:
              text = "\n".join(tail(path) for path in (raw_path, error_path)).lower()
              reason = next((category for needle, category in (
                  ("runner_start_budget_exhausted", "runner_start_budget_exhausted"),
                  ("xcodebuild build-for-testing failed", "xctest_build_failed"),
                  ("runner did not accept connection", "runner_connect_failed"),
                  ("daemon request timed out", "daemon_request_timeout"),
              ) if needle in text), "prepare_command_failed")
              write_failure(reason, exit_code, read_prepare_error())
          try:
              text = raw_path.read_text(encoding="utf-8")
              try:
                  result = json.loads(text)
              except ValueError:
                  result = None
                  for line in reversed(text.splitlines()):
                      try:
                          candidate = json.loads(line)
                      except ValueError:
                          continue
                      payload = candidate.get("data") if isinstance(candidate, dict) else None
                      if not isinstance(payload, dict) and isinstance(candidate, dict):
                          payload = candidate.get("result")
                      if isinstance(candidate, dict) and (candidate.get("action") == "ios-runner"
                                                          or isinstance(payload, dict) and payload.get("action") == "ios-runner"):
                          result = candidate
                          break
              for _ in range(3):
                  if isinstance(result, dict) and isinstance(result.get("data"), dict):
                      result = result["data"]
                  elif isinstance(result, dict) and isinstance(result.get("result"), dict):
                      result = result["result"]
                  else:
                      break
              assert isinstance(result, dict)
              if result.get("failureReason") is not None:
                  write_failure("prepare_reported_failure", exit_code)
              assert result.get("action") == "ios-runner" and result.get("platform") == "ios" and result.get("kind") == "simulator"
              assert isinstance(result.get("runner"), dict)
              assert type(result.get("healthCheckMs")) in {int, float} and math.isfinite(result["healthCheckMs"]) and result["healthCheckMs"] >= 0
              if result.get("recoveryReason") is not None:
                  write_failure("runner_prepare_required_recovery", exit_code)
              cache = result.get("cache")
              artifact = result.get("artifact")
              cache = cache if cache in {"exact", "miss", "external"} else "unknown"
              artifact = artifact if artifact in {"valid", "rebuilt"} else "unknown"
              build_ms = result.get("buildMs")
              assert build_ms is None or type(build_ms) in {int, float} and math.isfinite(build_ms) and 0 <= build_ms <= 600000
              summary = {"status": "healthy", "cache": cache, "artifact": artifact,
                         "build_ms": build_ms, "connect_ms": result["connectMs"],
                         "health_check_ms": result["healthCheckMs"]}
              for key in ("connect_ms", "health_check_ms"):
                  assert type(summary[key]) in {int, float} and math.isfinite(summary[key]) and 0 <= summary[key] <= 600000
          except (OSError, ValueError, TypeError, AssertionError, KeyError):
              write_failure("prepare_result_invalid", exit_code)
          summary_path.write_text(json.dumps(summary) + "\n")
          print("iOS XCTest runner healthy: " + json.dumps(summary, sort_keys=True))
          PY
      - name: Check bounded iOS actor diagnostics
        run: python3 scripts/ios-actor-census.py --self-test
      - name: Verify Provider settings and cancellation in the installed iOS app
        env:
          VIBEFACE_E2E_SOURCE_COMMIT: ${{ github.sha }}
          E2E_TELEMETRY_DISABLED: '1'
          AGENT_DEVICE_HOME: ${{ github.workspace }}/.artifacts/native/agent-device
          AGENT_DEVICE_STATE_DIR: ${{ github.workspace }}/.artifacts/native/agent-device
          AGENT_DEVICE_SESSION: vdp-native-acceptance
        run: |
          umask 077
          printf '%s\n' typecheck > .artifacts/native/private/stage.txt
          pnpm test:e2e:check > .artifacts/native/private/typecheck.log 2>&1
          printf '%s\n' selection > .artifacts/native/private/stage.txt
          pnpm exec e2e list --config tests/e2e/e2e.native.config.ts --grep '^provider ' --reporter json > .artifacts/native/private/selection.json 2> .artifacts/native/private/selection.log
          python3 - <<'PY'
          import json
          pairs = json.load(open(".artifacts/native/private/selection.json"))["pairs"]
          assert len(pairs) == 1 and pairs[0]["disposition"] == "run", "Exactly one runnable native Provider test is required"
          PY
          printf '%s\n' ui-run > .artifacts/native/private/stage.txt
          set +e
          pnpm exec e2e run --config tests/e2e/e2e.native.config.ts --grep '^provider ' --action-timeout 240000 --trace off --video off --retries 0 --reporter json > .artifacts/native/private/ui.json 2> .artifacts/native/private/ui.log
          result=$?
          set -e
          printf '%s\n' "$result" > .artifacts/native/private/ui-exit-code.txt
          echo "Native Provider e2e exit code: $result"
          exit "$result"
      - name: Clean up this task and require final UI acceptance
        id: native_cleanup
        if: always()
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          umask 077
          echo "safe_public_artifacts=false" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, re, shutil, stat, subprocess, sys
          repo = pathlib.Path.cwd().resolve()
          root = repo / ".artifacts/native"
          spec = importlib.util.spec_from_file_location("ios_actor_census", repo / "scripts/ios-actor-census.py")
          census_module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(census_module)
          if not census_module.artifact_layout_safe(repo):
              # Marker paths cannot be trusted here. The unique task name still identifies
              # this run's simulator without following a rejected filesystem path.
              simulator_cleanup = "unavailable"
              try:
                  run_id, attempt = os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
                  assert run_id.isdigit() and attempt.isdigit()
                  expected = "vibeface-provider-" + run_id + "-" + attempt
                  devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "--json"], timeout=5))["devices"]
                  matches = [row for rows in devices.values() for row in rows if row["name"] == expected]
                  assert len(matches) <= 1
                  simulator_cleanup = "not_present"
                  if matches:
                      simulator = matches[0]["udid"]
                      assert re.fullmatch(r"[a-fA-F0-9-]{36}", simulator)
                      if matches[0]["state"] != "Shutdown":
                          subprocess.run(["xcrun", "simctl", "shutdown", simulator], check=True,
                                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=15)
                      subprocess.run(["xcrun", "simctl", "delete", simulator], check=True,
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, timeout=15)
                      simulator_cleanup = "removed"
              except Exception:
                  simulator_cleanup = "unavailable"
              finally:
                  # Remove only independently validated task directories. Untrusted roots
                  # remain untouched and are never read by the artifact upload step.
                  for relative in (".artifacts/native/network", ".artifacts/native/agent-device", ".artifacts/native/cache",
                                   ".artifacts/native/e2e", ".artifacts/native/private", "tests/e2e/.artifacts/native"):
                      try:
                          path = census_module.checked_task_path(repo, repo / relative)
                          if path.is_dir():
                              shutil.rmtree(path)
                      except (OSError, ValueError):
                          pass
              print(json.dumps({"artifact_layout": "refused", "simulator_cleanup": simulator_cleanup}))
              raise SystemExit("refusing task artifact paths with symlink components")
          public_census_projection = census_module.public_census_projection
          public = root / "public"
          public.mkdir(parents=True, exist_ok=True, mode=0o700)
          receipt_path = public / "provider.json"
          receipt = json.loads(receipt_path.read_text()) if receipt_path.exists() else {"source_commit": os.environ["SOURCE_COMMIT"]}
          simulator_file = root / "simulator.txt"
          removed, fixture_stopped, selected_passed, private_removed = not simulator_file.exists(), False, False, False
          stage_path = root / "private/stage.txt"
          stage = stage_path.read_text().strip() if stage_path.exists() else "not_started"
          stages = {"host-source", "host-build", "simulator-create", "runner-prepare", "typecheck", "selection", "ui-run"}
          diagnostics = {"stage": stage if stage in stages else "not_started", "report": "missing", "failures": []}
          navigation_path = public / "provider-navigation.json"
          if navigation_path.exists():
              try:
                  navigation = json.loads(navigation_path.read_text())
                  keys = {"settings_visible", "connected_computer_link", "current_entry", "can_rename", "ai_link", "device_missing"}
                  assert set(navigation) == keys | {"stage"} and navigation["stage"] in {"settings", "device"}
                  assert all(value is None or type(value) is bool for key, value in navigation.items() if key in keys)
                  diagnostics["navigation"] = navigation
              except (OSError, ValueError, TypeError, AssertionError):
                  diagnostics["navigation"] = {"stage": "invalid"}

          clipboard_path = public / "provider-clipboard.json"
          if clipboard_path.exists() or clipboard_path.is_symlink():
              try:
                  info = clipboard_path.lstat()
                  assert stat.S_ISREG(info.st_mode) and info.st_size <= 1024
                  clipboard = json.loads(clipboard_path.read_text(encoding="utf-8"))
                  counts = {"started", "fulfilled", "rejected", "equal", "empty", "other"}
                  flags = {"capped", "inflight_at_poll_failure"}
                  assert isinstance(clipboard, dict) and set(clipboard) == counts | flags
                  assert all(type(clipboard[key]) is int and 0 <= clipboard[key] <= 4096 for key in counts)
                  assert all(type(clipboard[key]) is bool for key in flags)
                  diagnostics["clipboard"] = {key: clipboard[key] for key in counts | flags}
              except (OSError, ValueError, TypeError, AssertionError):
                  diagnostics["clipboard"] = {"status": "invalid"}

          def safe_error(error, source=None, api=None):
              if not isinstance(error, dict):
                  return None
              code = error.get("code")
              result = {"code": code if isinstance(code, str) and re.fullmatch(r"[A-Z][A-Z0-9_]{0,63}", code) else "UNCLASSIFIED_ERROR"}
              message = error.get("message")
              if isinstance(message, str):
                  fixture = re.search(r"Native fixture failure ([A-Za-z_]{1,50}) \[([^\]]{0,500})\]", message)
                  if fixture:
                      frames = []
                      for raw in fixture[2].split(";"):
                          frame = re.fullmatch(r"verify-node\.py:([1-9][0-9]{0,4}):([A-Za-z_][A-Za-z0-9_]{0,70})", raw)
                          if frame and len(frames) < 4:
                              frames.append({"file": "verify-node.py", "line": int(frame[1]), "function": frame[2]})
                      result["fixture"] = {"error_type": fixture[1], "frames": frames}
              if code in {"ENGINE_FAILURE", "ENVIRONMENT_UNAVAILABLE"} and isinstance(message, str):
                  lowered = message.lower()
                  result["engine_timeout_kind"] = next((kind for needle, kind in (
                      ("timed out while reading snapshot viewport on the xctest main thread", "snapshot-viewport"),
                      ("timed out while reading private ax viewport on the xctest main thread", "snapshot-private-ax"),
                      ("timed out while processing tree snapshot on the xctest main thread", "snapshot-tree"),
                      ("timed out while running query-sweep snapshot on the xctest main thread", "snapshot-query-sweep"),
                      ("main thread execution timed out", "runner-main-thread"),
                      ("daemon request timed out", "daemon-rpc"),
                      ("runner connection deadline exceeded", "runner-connect"),
                      ("runner command deadline exceeded", "runner-command"),
                      ("timed out waiting for xctest runner over usbmux", "runner-usbmux"),
                  ) if needle in lowered), "unknown")
                  if "the xctest tree capture exceeded its " in lowered and "s time slice" in lowered:
                      result["engine_timeout_kind"] = "snapshot-tree-slice"
                  result["engine_reason"] = next((reason for needle, reason in (
                      ("could not be masked", "secure-mask"),
                      ("no focused text input was available for typing", "text-input-not-focused"),
                      ("reliable text synthesis is unavailable while the software keyboard is hidden", "text-synthesis-unavailable"),
                      ("the runner could not confirm the typed text reached the field", "text-commit-unobserved"),
                      ("the runner could not clear the field before typing", "text-clear-unobserved"),
                      ("the text is longer than one runner command can type at this pace", "text-synthesis-budget"),
                      ("text entry read-back did not match", "text-entry-mismatch"),
                      ("no text input found at the provided coordinates to clear", "text-input-target-missing"),
                      ("no focused text input to clear", "text-input-target-missing"),
                      ("xctest recorded a failure while executing", "xctest-recorded-failure"),
                      ("app_not_running", "app-not-running"),
                      ("app is not running", "app-not-running"),
                      ("main thread", "main-thread"),
                      ("main-thread", "main-thread"),
                      ("wedged", "runner-wedged"),
                      ("runner busy", "runner-busy"),
                      ("presentation", "presentation"),
                      ("timed out", "timeout"),
                      ("snapshot", "snapshot"),
                      ("screenshot", "screenshot"),
                  ) if needle in lowered), "unknown")
              source = error.get("source", source)
              if isinstance(source, dict) and source.get("file") in {"native-transfers.e2e.ts", "e2e.native.config.ts"}:
                  line = source.get("line")
                  if type(line) is int and 1 <= line <= 100000:
                      result.update(file=source["file"], line=line)
              if api in {"app.open", "app.screenshot", "device.installApp", "device.clearKeychain", "device.openLink", "device.dismissKeyboard", "device.clipboard",
                         "screen.scrollUntilVisible", "locator.click", "locator.tap", "locator.fill", "expect.toBeVisible", "expect.toBeHidden",
                         "expect.toHaveAccessibleName", "expect.toEqual", "expect.toBe", "expect.poll"}:
                  result["api"] = api
              if error.get("phase") in {"config", "collection", "filter", "launch", "beforeAll", "beforeEach", "body", "afterEach", "afterAll", "cleanup", "report"}:
                  result["phase"] = error["phase"]
              return result

          def safe_driver_diagnostic():
              private_dir = root / "private"
              pointer_path = root / "private/ios-driver-failure.json"
              if private_dir.is_symlink() or not pointer_path.is_file() or pointer_path.is_symlink():
                  return {"status": "pointer_missing"}
              try:
                  pointer = json.loads(pointer_path.read_text(encoding="utf-8"))
                  assert isinstance(pointer, dict)
                  output = {"status": "captured"}
                  if pointer.get("code") in {"ENGINE_FAILURE", "COMMAND_FAILED"}:
                      output["code"] = pointer["code"]
                  if pointer.get("reason") in {"daemon_transport_timeout", "daemon_request_timeout"}:
                      output["reason"] = pointer["reason"]
                  if pointer.get("message_kind") == "daemon_request_timeout":
                      output["message_kind"] = pointer["message_kind"]
                  timeout_ms = pointer.get("timeout_ms")
                  if type(timeout_ms) is int and 0 <= timeout_ms <= 600000:
                      output["timeout_ms"] = timeout_ms
                  log_path = pointer.get("log_path")
                  if not isinstance(log_path, str) or len(log_path) > 4096:
                      output["log"] = "pointer_unavailable"
                      return output
                  candidate = pathlib.Path(log_path)
                  state_dir = root / "agent-device"
                  if state_dir.is_symlink():
                      output["log"] = "pointer_refused"
                      return output
                  allowed = state_dir.resolve()
                  if (not candidate.is_absolute() or ".." in candidate.parts
                          or "trash" in str(candidate).lower()
                          or candidate.is_symlink()):
                      output["log"] = "pointer_refused"
                      return output
                  resolved = candidate.resolve(strict=True)
                  if (not resolved.is_relative_to(allowed)
                          or "trash" in str(resolved).lower()
                          or not resolved.is_file() or resolved.stat().st_size > 1048576):
                      output["log"] = "pointer_refused"
                      return output
                  events = []
                  for line in resolved.read_text(encoding="utf-8").splitlines():
                      try:
                          event = json.loads(line)
                      except ValueError:
                          continue
                      if isinstance(event, dict) and event.get("phase") == "daemon_request_timeout":
                          events.append(event)
                  if not events:
                      output["log"] = "event_missing"
                      return output
                  event = events[-1]
                  data = event.get("data")
                  summary = {}
                  duration = event.get("durationMs")
                  if type(duration) in {int, float} and 0 <= duration <= 600000:
                      summary["duration_ms"] = int(duration)
                  if isinstance(data, dict):
                      timeout = data.get("timeoutMs")
                      if type(timeout) is int and 0 <= timeout <= 600000:
                          summary["timeout_ms"] = timeout
                      for source, destination in (("daemonLivenessProbeAnswered", "liveness_probe_answered"),
                                                  ("daemonPreservedAfterTimeout", "daemon_preserved")):
                          if type(data.get(source)) is bool:
                              summary[destination] = data[source]
                      retirement = data.get("daemonRetirement")
                      if isinstance(retirement, dict) and retirement.get("status") in {"retired", "retained", "absent"}:
                          summary["retirement"] = retirement["status"]
                          termination = retirement.get("termination")
                          if isinstance(termination, dict) and termination.get("status") in {"exited", "already-exited", "retained"}:
                              summary["termination"] = termination["status"]
                  output["log"] = "event_found"
                  output["event"] = summary
                  return output
              except (OSError, ValueError, TypeError, AssertionError):
                  return {"status": "unreadable"}

          def prepare_error_detail(error):
              codes = {"INVALID_ARGS", "DEVICE_NOT_FOUND", "DEVICE_IN_USE", "TOOL_MISSING", "APP_NOT_INSTALLED",
                       "UNSUPPORTED_PLATFORM", "UNSUPPORTED_OPERATION", "NOT_IMPLEMENTED", "COMMAND_FAILED",
                       "SESSION_NOT_FOUND", "UNAUTHORIZED", "AMBIGUOUS_MATCH", "REPLAY_DIVERGENCE",
                       "REPAIR_SESSION_EXPIRED", "REPAIR_COMMIT_FAILED", "UNKNOWN"}
              if not isinstance(error, dict):
                  return {"code": "unknown"}
              code = error.get("code")
              result = {"code": code if isinstance(code, str) and code in codes else "unknown"}
              details = error.get("details")
              if not isinstance(details, dict):
                  return result
              projected = {}
              for key, allowed in (
                  ("reason", {"runner_start_budget_exhausted", "runner_phase_budget_exhausted", "prepare_deadline_expired",
                              "simulator_set_destination_not_found", "simulator_service_hub_unavailable", "build_failed_unclassified",
                              "bundle_identifier_already_registered", "signing_no_development_team", "signing_provisioning_profile_missing",
                              "signing_unspecified", "devtools_security_developer_mode_disabled", "device_developer_disk_image_unavailable",
                              "IOS_RUNNER_CONNECT_TIMEOUT", "IOS_RUNNER_DEVICE_NOT_PROVISIONED", "IOS_BOOT_TIMEOUT", "IOS_TOOL_MISSING",
                              "BOOT_COMMAND_FAILED", "CI_RESOURCE_STARVATION_SUSPECTED", "UNKNOWN", "request_canceled",
                              "daemon_transport_timeout", "daemon_transport_failure", "startup-stalled", "startup-ceiling", "startup-exited"}),
                  ("runnerConnectFailureReason", {"runner_connect_refused", "runner_endpoint_probe_exhausted", "xcodebuild_exited_early"}),
                  ("phase", {"runner_session", "runner_rebuild", "runner_health", "runner_xctestrun_build"}),
              ):
                  value = details.get(key)
                  if isinstance(value, str) and value in allowed:
                      projected[key] = value
              for key in ("timeoutMs", "startupTimeoutMs"):
                  value = details.get(key)
                  if type(value) in {int, float} and 0 <= value <= 600000:
                      projected[key] = value
              attempts = details.get("startupAttempts")
              if type(attempts) is int and 1 <= attempts <= 2:
                  projected["startupAttempts"] = attempts
              xcodebuild_result = details.get("xcodebuild")
              value = xcodebuild_result.get("exitCode") if isinstance(xcodebuild_result, dict) else None
              if type(value) is int and 0 <= value <= 255:
                  projected["xcodebuild"] = {"exitCode": value}
              if projected:
                  result["details"] = projected
              return result

          def safe_runner_prepare():
              path = root / "private/ios-runner-prepare.json"
              if path.is_symlink() or not path.is_file():
                  return {"status": "missing"}
              try:
                  with path.open("rb") as stream:
                      raw = stream.read(8193)
                  assert len(raw) <= 8192
                  result = json.loads(raw)
                  assert isinstance(result, dict)
                  if result.get("status") == "failed":
                      reason = result.get("reason")
                      exit_code = result.get("exit_code")
                      if (reason not in {"runner_start_budget_exhausted", "xctest_build_failed", "runner_connect_failed",
                                         "daemon_request_timeout", "prepare_command_failed", "prepare_result_invalid",
                                         "prepare_reported_failure", "runner_prepare_required_recovery"}
                              or type(exit_code) is not int or not 0 <= exit_code <= 255):
                          return {"status": "invalid"}
                      summary = {"status": "failed", "reason": reason, "exit_code": exit_code}
                      if "error" in result:
                          summary["error"] = prepare_error_detail(result["error"])
                      return summary
                  assert result.get("status") == "healthy"
                  assert result.get("cache") in {"exact", "miss", "external", "unknown"}
                  assert result.get("artifact") in {"valid", "rebuilt", "unknown"}
                  summary = {"status": "healthy", "cache": result["cache"], "artifact": result["artifact"]}
                  for key in ("build_ms", "connect_ms", "health_check_ms"):
                      value = result.get(key)
                      if key == "build_ms" and value is None:
                          summary[key] = None
                          continue
                      if type(value) not in {int, float} or not 0 <= value <= 600000:
                          return {"status": "invalid"}
                      summary[key] = int(value)
                  return summary
              except (OSError, ValueError, TypeError, AssertionError, KeyError, RecursionError):
                  return {"status": "invalid"}

          def safe_actor_census():
              path = root / "private/ios-actor-census.json"
              try:
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_size > 8192:
                      return {"status": "missing"}
                  value = json.loads(path.read_text(encoding="utf-8"))
                  assert isinstance(value, dict)
                  assert value.get("stage") == "initial-accessibility-failure"
                  assert value.get("source_commit") == os.environ["GITHUB_SHA"]
                  assert value.get("run_id") == os.environ["GITHUB_RUN_ID"]
                  assert value.get("run_attempt") == os.environ["GITHUB_RUN_ATTEMPT"]
