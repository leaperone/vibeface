name: mobile

# Extended platform build: run by hand, or on a pull request labelled `mobile`.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      android_only:
        type: boolean
        default: false
  pull_request:
    types: [labeled, unlabeled, synchronize]

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    if: >-
      (inputs.android_only || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'mobile')) &&
      !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nightly'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Prepare the Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-mobile-secure.sh android
      - name: Verify generated native sources match this commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 -c 'import os, runpy; runpy.run_path("scripts/run-delivery-live.py")["source_commit"](os.environ["SOURCE_COMMIT"])'
      - name: Build the release APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Bind release APK and native ABI bytes to this source commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/run-delivery-live.py --record-android-apk apps/mobile/android/app/build/outputs/apk/release --source-commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibeface-android-${{ github.sha }}
          path: .artifacts/mobile-android/
          if-no-files-found: error

  ios:
    if: >-
      !inputs.android_only &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'mobile')) &&
      !(github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'nightly'))
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-mobile-secure.sh ios
      - name: Build the simulator app
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios
          xcodebuild -workspace ios/Vibeface.xcworkspace -scheme Vibeface -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
          # Ad-hoc signing writes the simulator entitlements into the binary; without them the Keychain refuses SecureStore.
          otool -l build/Build/Products/Release-iphonesimulator/Vibeface.app/Vibeface | grep -q "sectname __entitlements"
          cd build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/vibeface-ios-simulator.zip" Vibeface.app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vibeface-ios-simulator-${{ github.sha }}
          path: vibeface-ios-simulator.zip
          if-no-files-found: error
