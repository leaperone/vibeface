name: Desktop application checks
# Called from ci.yml so a manual dispatch on a branch can reach it; it never dispatches on its own.
on:
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      runner: {type: string, required: true}
      target: {type: string, required: true}
      package_artifact: {type: string, default: ''}
permissions:
  contents: read
jobs:
  desktop:
    name: desktop (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.9.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: pnpm, cache-dependency-path: pnpm-lock.yaml}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.package_artifact != ''
        with:
          name: ${{ inputs.package_artifact }}
          path: .artifacts/packages
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.package_artifact == ''
        with:
          name: crypto-web-${{ inputs.source_sha }}
          path: apps/app/generated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.package_artifact == ''
        with:
          name: web-${{ inputs.source_sha }}
          path: apps/app/dist/client
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        if: inputs.package_artifact == ''
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: inputs.package_artifact == ''
        with:
          key: desktop-native-${{ inputs.target }}${{ runner.os == 'Windows' && '-static-crt' || '' }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - uses: ./.github/actions/msvc-environment
        if: runner.os == 'Windows'
      - name: Select this platform's Python
        run: printf 'PY=%s\n' "$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      - name: Build this platform's native runtime
        if: inputs.package_artifact == ''
        env:
          TARGET: ${{ inputs.target }}
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"
          if [[ "$TARGET" == *-windows-* ]]; then
            "$PY" -B scripts/package-node-windows.py
          else
            bash scripts/package-node.sh --target "$TARGET"
          fi
      - name: Keep this platform's runtime independently reviewable
        if: inputs.package_artifact == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-runtime-${{ inputs.target }}-${{ inputs.source_sha }}
          path: .artifacts/packages/*
          if-no-files-found: error
      - name: Unpack the verified runtime for this platform
        id: runtime
        run: |
          shopt -s nullglob
          archives=(.artifacts/packages/*.tar.gz)
          [[ "${#archives[@]}" == 1 ]]
          name="$(basename "${archives[0]}" .tar.gz)"
          "$PY" -B scripts/checksum.py ".artifacts/packages/$name.tar.gz.sha256"
          mkdir -p .artifacts/runtime
          tar -xzf "${archives[0]}" -C .artifacts/runtime
          {
            printf 'dir=%s\n' "$PWD/.artifacts/runtime/$name"
            printf 'archive=%s\n' "$PWD/${archives[0]}"
          } >> "$GITHUB_OUTPUT"
      - name: Verify native Windows processes and private platform operations
        if: runner.os == 'Windows'
        env:
          PACKAGE: ${{ steps.runtime.outputs.dir }}
        run: |
          node scripts/private-control.mjs --self-test
          "$PY" -B scripts/verify-windows-node.py --package "$PACKAGE" --artifacts .artifacts/ci-windows-node
      - name: Build the desktop host from this source
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/desktop typecheck
          pnpm --dir apps/desktop test
          pnpm --dir apps/desktop build
      - name: Build the desktop application around the verified runtime
        env:
          TARGET: ${{ inputs.target }}
          RUNTIME_DIR: ${{ steps.runtime.outputs.dir }}
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.archive }}
        run: |
          # CI builds an explicitly unsigned development preview; signed distribution stays in the release workflow.
          node scripts/build-desktop.mjs --target "$TARGET" --runtime-dir "$RUNTIME_DIR" --runtime-archive "$RUNTIME_ARCHIVE" --output .artifacts/desktop
      - name: Verify the built application and its provenance
        env:
          TARGET: ${{ inputs.target }}
        run: node scripts/verify-desktop.mjs --target "$TARGET" --input .artifacts/desktop
      - name: Unpack the built application for the window tests
        id: application
        env:
          TARGET: ${{ inputs.target }}
        run: |
          shopt -s nullglob
          archives=(.artifacts/desktop/*.zip)
          [[ "${#archives[@]}" == 1 ]]
          mkdir -p .artifacts/desktop-app
          if [[ "$RUNNER_OS" == Linux ]]; then
            unzip -q "${archives[0]}" -d .artifacts/desktop-app
          elif [[ "$RUNNER_OS" == Windows ]]; then
            "$PY" - "${archives[0]}" .artifacts/desktop-app <<'PY'
          import os, pathlib, subprocess, sys
          tar = pathlib.Path(os.environ['SystemRoot']) / 'System32/tar.exe'
          subprocess.run([str(tar), '-xf', sys.argv[1], '-C', sys.argv[2]], check=True)
          PY
          else
            tar -xf "${archives[0]}" -C .artifacts/desktop-app
          fi
          if [[ "$TARGET" == *-apple-darwin ]]; then
            application="$PWD/.artifacts/desktop-app/Vibeface.app"
          elif [[ "$TARGET" == *-windows-* ]]; then
            application="$PWD/.artifacts/desktop-app/Vibeface.exe"
          else
            images=(.artifacts/desktop/*.AppImage)
            [[ "${#images[@]}" == 1 ]]
            image="$PWD/${images[0]}"
            chmod +x "$image"
            (cd .artifacts/desktop-app && "$image" --appimage-extract > "$RUNNER_TEMP/vibeface-appimage-extract.log")
            application="$PWD/.artifacts/desktop-app/squashfs-root/AppRun"
          fi
          test -e "$application"
          printf 'path=%s\n' "$application" >> "$GITHUB_OUTPUT"
      - name: Prepare the Linux GUI and sandbox helper
        if: runner.os == 'Linux'
        run: |
          command -v xvfb-run
          # Hosted images omit CJK fonts; the real Chinese UI must remain readable in captures.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          test -f .artifacts/desktop-app/squashfs-root/chrome-sandbox
          # A disposable hosted runner installs the extracted Chromium helper with its required
          # ownership; the application keeps its Chromium sandbox enabled throughout the test.
          sudo chown root:root .artifacts/desktop-app/squashfs-root/chrome-sandbox
          sudo chmod 4755 .artifacts/desktop-app/squashfs-root/chrome-sandbox
      - name: Prepare the hosted Linux current-user service session
        if: runner.os == 'Linux'
        run: |
          user_id="$(id -u)"
          test "$user_id" -gt 0
          command -v systemctl
          # user@ starts the real logind-managed user session and its D-Bus socket.
          # Reusing an existing manager is idempotent; the test removes only its own services.
          sudo systemctl start "user@$user_id.service"
          export XDG_RUNTIME_DIR="/run/user/$user_id"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          test -S "$XDG_RUNTIME_DIR/bus"
          systemctl --user show-environment >/dev/null
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=%s\n' "$XDG_RUNTIME_DIR" "$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
      - name: Drive the real desktop window end to end
        env:
          VIBEFACE_E2E_DESKTOP_APP: ${{ steps.application.outputs.path }}
          VIBEFACE_E2E_DESKTOP_RUNTIME: ${{ steps.runtime.outputs.dir }}
          E2E_TELEMETRY_DISABLED: '1'
        run: |
          pnpm test:e2e:check
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run --auto-servernum --server-args='-screen 0 1440x1000x24' pnpm exec e2e run --config tests/e2e/e2e.desktop.config.ts
          else
            pnpm exec e2e run --config tests/e2e/e2e.desktop.config.ts
          fi
      - name: Keep compact desktop failure evidence independently
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: desktop-diagnostics-${{ inputs.target }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci-windows-node
            .artifacts/e2e/desktop/*.log
            tests/e2e/.artifacts/desktop
            !tests/e2e/.artifacts/desktop/**/downloads/**
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: desktop-${{ inputs.target }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/desktop/*
            .artifacts/ci-windows-node
            .artifacts/e2e/desktop/*.log
            tests/e2e/.artifacts/desktop
            !tests/e2e/.artifacts/desktop/**/downloads/**
          if-no-files-found: warn
          retention-days: 14
