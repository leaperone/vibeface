name: Desktop application checks
# Called from ci.yml so a manual dispatch on a branch can reach it; it never dispatches on its own.
on:
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      runner: {type: string, required: true}
      target: {type: string, required: true}
      package_artifact: {type: string, required: true}
permissions:
  contents: read
jobs:
  desktop:
    name: desktop (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.9.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: pnpm, cache-dependency-path: pnpm-lock.yaml}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.package_artifact }}
          path: .artifacts/packages
      - name: Select this platform's Python
        run: printf 'PY=%s\n' "$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      - name: Unpack the verified runtime for this platform
        id: runtime
        run: |
          shopt -s nullglob
          archives=(.artifacts/packages/*.tar.gz)
          [[ "${#archives[@]}" == 1 ]]
          name="$(basename "${archives[0]}" .tar.gz)"
          (cd .artifacts/packages && shasum -a 256 -c "$name.tar.gz.sha256")
          mkdir -p .artifacts/runtime
          tar -xzf "${archives[0]}" -C .artifacts/runtime
          {
            printf 'dir=%s\n' "$PWD/.artifacts/runtime/$name"
            printf 'archive=%s\n' "$PWD/${archives[0]}"
          } >> "$GITHUB_OUTPUT"
      - name: Build the desktop host from this source
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/desktop typecheck
          pnpm --dir apps/desktop test
          pnpm --dir apps/desktop build
      - name: Build the desktop application around the verified runtime
        env:
          TARGET: ${{ inputs.target }}
          RUNTIME_DIR: ${{ steps.runtime.outputs.dir }}
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.archive }}
        run: |
          # CI builds an explicitly unsigned development preview; signed distribution stays in the release workflow.
          node scripts/build-desktop.mjs --target "$TARGET" --runtime-dir "$RUNTIME_DIR" --runtime-archive "$RUNTIME_ARCHIVE" --output .artifacts/desktop
      - name: Verify the built application and its provenance
        env:
          TARGET: ${{ inputs.target }}
        run: node scripts/verify-desktop.mjs --target "$TARGET" --input .artifacts/desktop
      - name: Unpack the built application for the window tests
        id: application
        env:
          TARGET: ${{ inputs.target }}
        run: |
          shopt -s nullglob
          archives=(.artifacts/desktop/*.zip)
          [[ "${#archives[@]}" == 1 ]]
          mkdir -p .artifacts/desktop-app
          tar -xf "${archives[0]}" -C .artifacts/desktop-app
          if [[ "$TARGET" == *-apple-darwin ]]; then application="$PWD/.artifacts/desktop-app/Vibeface.app"; else application="$PWD/.artifacts/desktop-app/Vibeface.exe"; fi
          test -e "$application"
          printf 'path=%s\n' "$application" >> "$GITHUB_OUTPUT"
      - name: Drive the real desktop window end to end
        env:
          VIBEFACE_E2E_DESKTOP_APP: ${{ steps.application.outputs.path }}
          VIBEFACE_E2E_DESKTOP_RUNTIME: ${{ steps.runtime.outputs.dir }}
          E2E_TELEMETRY_DISABLED: '1'
        run: |
          pnpm test:e2e:check
          pnpm exec e2e run --config tests/e2e/e2e.desktop.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: desktop-${{ inputs.target }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            .artifacts/desktop/*
            .artifacts/e2e/desktop/*.log
            tests/e2e/.artifacts/desktop
            !tests/e2e/.artifacts/desktop/**/downloads/**
          if-no-files-found: error
          retention-days: 14
