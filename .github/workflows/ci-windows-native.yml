name: Windows native checks
# Called from ci.yml so a manual dispatch on a branch can reach it; it never dispatches on its own.
on:
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      package_artifact_id: {type: string, default: ''}
      package_run_id: {type: string, default: ''}
      rust_checks: {type: boolean, default: true}
permissions:
  contents: read
  actions: read
jobs:
  rust:
    if: inputs.rust_checks
    name: windows rust (${{ matrix.scope }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: core
            packages: vibeface-core
          - scope: bridge
            packages: vibeface-protocol vibeface-bridge vibeface-secure vibeface-control
          - scope: cli
            packages: vibeface
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run: {shell: bash}
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: {components: clippy}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ci-windows-native-${{ matrix.scope }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Select this platform's Python
        run: printf 'PY=%s\n' "$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/msvc-environment
      - name: Confirm the host really is the MSVC target
        run: |
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p')" = x86_64-pc-windows-msvc
          cl.exe 2>&1 | head -n 1 | grep -q 'Microsoft (R) C/C++'
      - name: Lint this native Windows scope
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          read -ra selected <<< "$PACKAGES"
          "$PY" -B scripts/ci.py check --packages "${selected[@]}"
      - name: Run this scope's native Windows tests
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          read -ra selected <<< "$PACKAGES"
          "$PY" -B scripts/ci.py test --tier fast --packages "${selected[@]}"

  process:
    if: inputs.package_artifact_id != '' || inputs.package_run_id != ''
    name: windows packaged processes
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Validate the package source mode
        env:
          PACKAGE_ARTIFACT_ID: ${{ inputs.package_artifact_id }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          RUST_CHECKS: ${{ inputs.rust_checks }}
        run: |
          if [[ -n "$PACKAGE_RUN_ID" ]]; then
            [[ -z "$PACKAGE_ARTIFACT_ID" && "$RUST_CHECKS" == false ]] || {
              echo '::error::A prior-run package diagnostic must select one run and skip native Rust checks.'
              exit 1
            }
            [[ "$PACKAGE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]] || {
              echo '::error::The prior workflow run ID must be a positive decimal integer.'
              exit 1
            }
          else
            [[ "$PACKAGE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || {
              echo '::error::This run requires an exact successful package producer artifact ID.'
              exit 1
            }
            [[ "$RUST_CHECKS" == true ]] || {
              echo '::error::Native Rust checks can only be skipped for a prior-run package diagnostic.'
              exit 1
            }
          fi
      - name: Select the exact successful Windows package from a prior ci.yml run
        id: select
        if: inputs.package_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p .artifacts/windows-diagnostic/metadata
          run_id="$PACKAGE_RUN_ID"
          metadata=.artifacts/windows-diagnostic/metadata
          if ! gh api "repos/$REPOSITORY/actions/runs/$run_id" > "$metadata/run.json" 2> "$metadata/run.err"; then
            echo '::error::Could not read metadata for the selected prior workflow run.'
            exit 1
          fi
          if ! gh api "repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100" > "$metadata/jobs.json" 2> "$metadata/jobs.err"; then
            echo '::error::Could not read producer job metadata for the selected prior workflow run.'
            exit 1
          fi
          if ! gh api "repos/$REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$metadata/artifacts.json" 2> "$metadata/artifacts.err"; then
            echo '::error::Could not read artifact metadata for the selected prior workflow run.'
            exit 1
          fi
          python3 -B scripts/windows-diagnostic-input.py select \
            --run-id "$run_id" \
            --repository "$REPOSITORY" \
            --run-json "$metadata/run.json" \
            --jobs-json "$metadata/jobs.json" \
            --artifacts-json "$metadata/artifacts.json" \
            --output .artifacts/windows-diagnostic/selection.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Download the exact package by artifact ID
        if: inputs.package_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.select.outputs.package_artifact_id }}
          merge-multiple: true
          run-id: ${{ inputs.package_run_id }}
          github-token: ${{ github.token }}
          path: .artifacts/packages
      - name: Download this run's package by artifact ID
        if: inputs.package_run_id == '' && inputs.package_artifact_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.package_artifact_id }}
          merge-multiple: true
          path: .artifacts/packages
      - name: Select this platform's Python
        run: printf 'PY=%s\n' "$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      - name: Unpack the verified Windows package
        id: unpack
        run: |
          shopt -s nullglob
          archives=(.artifacts/packages/*.tar.gz)
          [[ "${#archives[@]}" == 1 ]]
          name="$(basename "${archives[0]}" .tar.gz)"
          "$PY" -B scripts/checksum.py ".artifacts/packages/$name.tar.gz.sha256"
          mkdir -p .artifacts/unpacked
          tar -xzf "${archives[0]}" -C .artifacts/unpacked
          printf 'package=%s\n' "$PWD/.artifacts/unpacked/$name" >> "$GITHUB_OUTPUT"
          printf 'archive=%s\n' "$PWD/${archives[0]}" >> "$GITHUB_OUTPUT"
      - name: Verify the package source and create diagnostic provenance
        if: inputs.package_run_id != ''
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
          PACKAGE_ARCHIVE: ${{ steps.unpack.outputs.archive }}
          PACKAGE_SOURCE_SHA: ${{ steps.select.outputs.package_source_sha }}
          HARNESS_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          mkdir -p .artifacts/ci-windows-node
          python3 -B scripts/windows-diagnostic-input.py verify-package \
            --package "$PACKAGE" \
            --archive "$PACKAGE_ARCHIVE" \
            --selection .artifacts/windows-diagnostic/selection.json \
            --harness-source "$HARNESS_SOURCE_SHA" \
            --output .artifacts/ci-windows-node/diagnostic-origin.json
      - name: Verify real Windows processes, private IPC, service, update and provider fixtures
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: |
          # scripts/verify-windows-node.py ships with the Windows runtime; without it this check cannot pass.
          [[ -f scripts/verify-windows-node.py ]] || { echo '::error::scripts/verify-windows-node.py is missing from this source; the Windows process verification cannot run.'; exit 1; }
          "$PY" -B scripts/verify-windows-node.py --package "$PACKAGE" --artifacts .artifacts/ci-windows-node
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.package_run_id != '' && format('windows-node-diagnostic-{0}-{1}-{2}', inputs.package_run_id, steps.select.outputs.package_source_sha, github.run_attempt) || format('windows-node-{0}-{1}', inputs.source_sha, github.run_attempt) }}
          path: .artifacts/ci-windows-node
          if-no-files-found: warn
          retention-days: 7
