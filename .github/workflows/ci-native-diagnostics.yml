name: CI / Native diagnostics
run-name: >-
  Native diagnostics · ${{ github.ref_name }} · ${{ inputs.installer_source_run != '' && 'installer' || 'compiler' }}

on:
  workflow_dispatch:
    inputs:
      native_tests:
        description: Run controlled tests for each successfully compiled native package
        type: boolean
        default: false
      native_test_scope:
        description: Select all controlled tests or Desktop only; compilation still checks all native callers
        type: choice
        options: [all, desktop]
        default: all
      native_frames:
        description: Measure native async frames and inspect controlled cold start
        type: boolean
        default: false
      native_benchmarks:
        description: Measure signed local appends, synchronization or the full size matrix
        type: choice
        options: [none, small, ingest, full]
        default: none
      installer_source_run:
        description: Optional completed Desktop acceptance or historical CI run for installer diagnostics
        type: string
        default: ''
      installer_source_sha:
        description: Exact source SHA of the selected installer input run
        type: string
        default: ''
      installer_source_attempt:
        description: Exact installer input run attempt
        type: string
        default: '1'
      installer_rebuild:
        description: Rebuild only the normal installer and run its full guarded acceptance
        type: boolean
        default: false

concurrency:
  group: native-diagnostics-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  native-installer-diagnostic:
    if: inputs.installer_source_run != ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-installer-diagnostic.yml
    with:
      source_run: ${{ inputs.installer_source_run }}
      source_sha: ${{ inputs.installer_source_sha }}
      source_attempt: ${{ inputs.installer_source_attempt }}
      rebuild_installer: ${{ inputs.installer_rebuild }}

  native-prepare:
    name: Prepare native lockfile, formatting and compiler evidence
    if: inputs.installer_source_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: ./.github/actions/native-desktop
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: gpui-native-prepare
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Resolve workspace additions while preserving locked third-party packages
        id: lockfile
        run: |
          mkdir -p .artifacts/native-prepare
          cargo update --workspace 2>&1 | tee .artifacts/native-prepare/lockfile.log
      - name: Format the native workspace and keep a reviewable patch
        id: formatting
        run: cargo fmt --all 2>&1 | tee .artifacts/native-prepare/rustfmt.log
      - name: Compile all native callers and test targets
        id: compile
        if: ${{ always() && steps.lockfile.outcome == 'success' }}
        run: |
          result=0
          for package in vibeface-client vibeface-core vibeface vibeface-desktop; do
            options=()
            if [[ "$package" == vibeface-desktop ]]; then options+=(--features native-ui-tests); fi
            printf '\nChecking %s\n' "$package" | tee -a .artifacts/native-prepare/compiler.log
            if cargo check --all-targets -p "$package" "${options[@]}" 2>&1 | tee -a .artifacts/native-prepare/compiler.log; then
              printf '%s=success\n' "$package" >> "$GITHUB_OUTPUT"
            else
              printf '%s=failure\n' "$package" >> "$GITHUB_OUTPUT"
              result=1
            fi
          done
          exit "$result"
      - name: Measure native async frame sizes before the runtime suite
        id: native-frames
        if: ${{ always() && (inputs.native_tests || inputs.native_frames) && steps.compile.outputs.vibeface-desktop == 'success' }}
        run: |
          xvfb-run -a cargo test --locked -p vibeface-desktop --features native-ui-tests --test native_ui_frames -- --nocapture 2>&1 | tee .artifacts/native-prepare/native-frames.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && (inputs.native_tests || inputs.native_frames) && steps.compile.outputs.vibeface-desktop == 'success' }}
        with:
          name: native-frames-${{ github.sha }}-${{ github.run_id }}
          path: .artifacts/native-prepare/native-frames.log
          if-no-files-found: error
          retention-days: 7
      - name: Prepare debugger for the requested controlled cold-start diagnosis
        if: ${{ always() && inputs.native_frames && steps.compile.outputs.vibeface-desktop == 'success' }}
        run: |
          if ! command -v gdb >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends gdb
          fi
      - name: Inspect the controlled native cold-start stack
        id: native-offline-diagnostic
        if: ${{ always() && inputs.native_frames && steps.compile.outputs.vibeface-desktop == 'success' }}
        run: |
          cargo test --locked -p vibeface-desktop --features native-ui-tests --test native_ui_offline --no-run --message-format=json > .artifacts/native-prepare/offline-build.jsonl
          python3 - <<'PYBINARY'
          import json, pathlib
          root = pathlib.Path('.artifacts/native-prepare')
          matches = [record['executable'] for line in (root / 'offline-build.jsonl').read_text().splitlines()
                     if (record := json.loads(line)).get('reason') == 'compiler-artifact'
                     and record['target']['name'] == 'native_ui_offline' and record.get('executable')]
          if len(matches) != 1: raise SystemExit('Expected exactly one same-source native offline test executable')
          (root / 'offline-binary.txt').write_text(matches[0])
          PYBINARY
          binary="$(cat .artifacts/native-prepare/offline-binary.txt)"
          if command -v gdb >/dev/null 2>&1; then
            cat > .artifacts/native-prepare/stack-probe.gdb <<'GDBSTACK'
          set pagination off
          set print frame-arguments none
          run
          python
          thread = gdb.selected_thread()
          if thread is not None:
              frame = gdb.newest_frame()
              measured = 0
              while frame is not None and measured < 3:
                  if (frame.name() or '').startswith('native_ui_offline::views::backend::'):
                      frame.select()
                      print('native poll frame %s: %s' % (measured, (frame.name() or '?')[:140]))
                      gdb.execute('info frame')
                      gdb.execute('info registers rsp rbp rip')
                      block = frame.block()
                      while block is not None and block.function is None:
                          block = block.superblock
                      if block is not None:
                          gdb.execute('disassemble /r 0x%x,0x%x' % (block.start, block.start + 160))
                      measured += 1
                  frame = frame.older()
          end
          thread apply all bt 16
          GDBSTACK
            xvfb-run -a gdb --batch --return-child-result --command=.artifacts/native-prepare/stack-probe.gdb --args "$binary" native_backend_cold_offline_stages_original_input_in_actual_outbox --exact --nocapture 2>&1 | tee .artifacts/native-prepare/native-offline-stack.log
          else
            printf 'No installed debugger; recording the exact controlled test result.\n' | tee .artifacts/native-prepare/native-offline-stack.log
            xvfb-run -a "$binary" native_backend_cold_offline_stages_original_input_in_actual_outbox --exact --nocapture 2>&1 | tee -a .artifacts/native-prepare/native-offline-stack.log
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && inputs.native_frames && steps.compile.outputs.vibeface-desktop == 'success' }}
        with:
          name: native-offline-stack-${{ github.sha }}-${{ github.run_id }}
          path: .artifacts/native-prepare/native-offline-stack.log
          if-no-files-found: error
          retention-days: 7
      - name: Run controlled native and runtime tests
        id: native-tests
        if: ${{ always() && steps.lockfile.outcome == 'success' && inputs.native_tests }}
        env:
          CLIENT_COMPILE: ${{ steps.compile.outputs.vibeface-client }}
          CORE_COMPILE: ${{ steps.compile.outputs.vibeface-core }}
          DESKTOP_COMPILE: ${{ steps.compile.outputs.vibeface-desktop }}
          VIBEFACE_NATIVE_TEST_SCOPE: ${{ inputs.native_test_scope }}
        run: |
          result=0
          if [[ "$VIBEFACE_NATIVE_TEST_SCOPE" == all ]]; then
          for package in vibeface-protocol vibeface-bridge vibeface-client; do
            if [[ "$package" == vibeface-client && "$CLIENT_COMPILE" != success ]]; then continue; fi
            if ! cargo test --locked -p "$package" 2>&1 | tee -a .artifacts/native-prepare/tests.log; then result=1; fi
          done
          for filter in store::actor store::schema_guard store::client_receipts store::tests::performance_tests fresh_main_input_tests conversation_history conversation_sections conversation_settings scheduler_history hold_query_tests workspace::lookup_tests scheduler::context_tests memory_sync_conflicts overwritten attachment_scope workspace_channel_upload_and_download client:: local_access:: runtime::permission_fences runtime::work_input runtime::opencode::tests:: a_rebuild_never_touches_local_ledgers a_waiting_recovery cli_round_trip runtime::pi::transport_tests runtime::codex_server delivery::isolation_tests delivery::wallet delivery::keys delivery::charity; do
            if [[ "$CORE_COMPILE" != success ]]; then break; fi
            test_options=(--test-threads=1)
            if [[ "$filter" == conversation_history ]]; then test_options+=(--nocapture); fi
            if ! cargo test --locked -p vibeface-core --lib "$filter" -- "${test_options[@]}" 2>&1 | tee -a .artifacts/native-prepare/tests.log; then result=1; fi
          done
          fi
          if [[ "$DESKTOP_COMPILE" == success ]]; then
            if ! xvfb-run -a cargo test --locked -p vibeface-desktop --features native-ui-tests --no-fail-fast -- --test-threads=1 2>&1 | tee -a .artifacts/native-prepare/tests.log; then result=1; fi
          fi
          exit "$result"
      - name: Measure signed ingestion and concurrent display/control on controlled data
        id: native-benchmarks
        if: ${{ always() && steps.compile.outputs.vibeface-core == 'success' && inputs.native_benchmarks != 'none' }}
        env:
          BENCHMARK_MODE: ${{ inputs.native_benchmarks }}
        run: |
          export VIBEFACE_PERF_SIZES=1000
          export VIBEFACE_PERF_KINDS=assistant
          filters=(signed_local_main_input_append_scale signed_ingest_concurrency signed_history_scale)
          if [[ "$BENCHMARK_MODE" == ingest ]]; then filters=(signed_fresh_main_ingest_scale); fi
          if [[ "$BENCHMARK_MODE" == full ]]; then
            export VIBEFACE_PERF_SIZES=1000,10000,100000
            export VIBEFACE_PERF_KINDS=assistant,input,fork,multi
            filters=(signed_history_scale signed_ingest_concurrency)
            filters+=(signed_pending_cascade_scale local_journal_scale lookup_read_scale_preserves_graph_oracle_without_full_graph_reads)
          fi
          result=0
          for filter in "${filters[@]}"; do
            if ! cargo test --locked -p vibeface-core --lib "$filter" -- --ignored --nocapture --test-threads=1 2>&1 | tee -a .artifacts/native-prepare/benchmarks.log; then result=1; fi
          done
          exit "$result"
      - name: Record exact preparation outcomes even when the compiler rejects the source
        if: always()
        env:
          LOCKFILE_OUTCOME: ${{ steps.lockfile.outcome }}
          FORMATTING_OUTCOME: ${{ steps.formatting.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          TEST_OUTCOME: ${{ steps.native-tests.outcome }}
          BENCHMARK_OUTCOME: ${{ steps.native-benchmarks.outcome }}
          FRAME_OUTCOME: ${{ steps.native-frames.outcome }}
          OFFLINE_DIAGNOSTIC_OUTCOME: ${{ steps.native-offline-diagnostic.outcome }}
          VIBEFACE_NATIVE_TEST_SCOPE: ${{ inputs.native_test_scope }}
        run: |
          mkdir -p .artifacts/native-prepare
          cp Cargo.lock .artifacts/native-prepare/Cargo.lock
          git diff --binary > .artifacts/native-prepare/format-and-lock.patch
          rustc -vV > .artifacts/native-prepare/rustc.txt
          python3 - <<'PYMETA'
          import json, os, pathlib, subprocess
          root = pathlib.Path('.artifacts/native-prepare')
          data = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                  'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                  'lockfile': os.environ['LOCKFILE_OUTCOME'], 'formatting': os.environ['FORMATTING_OUTCOME'],
                  'compile': os.environ['COMPILE_OUTCOME'], 'tests': os.environ['TEST_OUTCOME'],
                  'benchmarks': os.environ['BENCHMARK_OUTCOME'], 'native_frames': os.environ['FRAME_OUTCOME'],
                  'offline_diagnostic': os.environ['OFFLINE_DIAGNOSTIC_OUTCOME'],
                  'test_scope': os.environ['VIBEFACE_NATIVE_TEST_SCOPE'], 'publishing': False}
          (root / 'outcomes.json').write_text(json.dumps(data, indent=2) + '\n')
          PYMETA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-prepare-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/native-prepare/*
          if-no-files-found: error
          retention-days: 7
