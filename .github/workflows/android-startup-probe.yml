name: android-startup-probe

on:
  push:
    branches: [feat/optional-paid-delivery]
    paths:
      - .github/workflows/android-startup-probe.yml
      - scripts/run-delivery-live.py

permissions:
  contents: read

concurrency:
  group: android-startup-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Prepare the same live host dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/vdp/live-ui/browsers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg acl
          pnpm install --frozen-lockfile --filter .
          pnpm exec e2e-web install chromium --with-deps
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
      - name: Diagnose task Android startup before any Node or proof
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, re, runpy, shutil, subprocess, sys, tempfile
          os.umask(0o077)
          root = pathlib.Path.cwd()
          spec = importlib.util.spec_from_file_location("startup_probe", root / "scripts/run-delivery-live.py")
          live = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = live
          spec.loader.exec_module(live)
          live.ARTIFACTS.mkdir(parents=True, exist_ok=True)
          checks = runpy.run_path(str(root / "scripts/check-delivery.py"))
          with tempfile.TemporaryDirectory(prefix="startup-context-", dir=live.ARTIFACTS) as directory:
              context = pathlib.Path(directory)
              for name in ("proofs/delivery/Sandbox.Dockerfile", "proofs/delivery/confined-gnark.sh"):
                  target = context / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(root / name, target)
              build, _ = checks["sandbox_commands"](context)
              subprocess.run(build, check=True)
          source = os.environ["GITHUB_SHA"]
          allowed = ("PATH", "JAVA_HOME", "LANG", "LC_ALL", "TMPDIR", "ANDROID_HOME", "ANDROID_SDK_ROOT", "RUNNER_TRACKING_ID")
          selected = {key: os.environ[key] for key in allowed if key in os.environ}
          os.environ.clear()
          os.environ.update(selected)
          live.UI = root / ".artifacts/vdp/android-startup-probe"
          live.UI.mkdir(mode=0o700)
          before = shutil.disk_usage(root).free
          host = live.AndroidHost()
          booted, failure, cleanup = False, None, True
          try:
              host.start()
              booted = True
          except Exception as error:
              failure = type(error).__name__
          finally:
              exited = None if host.process is None else host.process.poll()
              try:
                  host.close()
              except Exception:
                  cleanup = False
          log = live.UI / "private-android-setup.log"
          data = log.read_bytes() if log.is_file() else b""
          markers = {
              "disk-space": rb"not enough disk space|no space left on device|not enough space",
              "gpu-mode": rb"invalid gpu mode|invalid value for -gpu|invalid gpu renderer",
              "kvm": rb"requires hardware acceleration|failed to open /dev/kvm|could not open /dev/kvm|kvm is not installed",
              "shared-library": rb"error while loading shared libraries|cannot open shared object file|library not loaded",
              "avd-path": rb"unknown avd name|cannot find avd system path|could not find an avd named",
              "avd-lock": rb"another emulator instance|running multiple emulators with the same avd",
              "qt-display": rb"could not load the qt platform plugin|could not connect to display",
              "vulkan": rb"failed to initialize vulkan|vulkan initialization failed",
              "image": rb"missing kernel file|missing userdata image",
          }
          libraries = sorted({value.decode() for value in re.findall(rb"error while loading shared libraries: ([A-Za-z0-9_.+-]{1,80}):", data)})
          partitions = []
          for config in (live.UI / "avd").glob("*.avd/config.ini"):
              match = re.search(rb"^disk\.dataPartition\.size=([0-9]+[KMG]?)$", config.read_bytes(), re.M)
              if match:
                  partitions.append(match[1].decode())
          report = {"scope": "Android startup only; no APK, app, Node, wallet or proof", "sourceCommit": source,
                    "booted": booted, "failureType": failure, "processExitBeforeCleanup": exited, "cleanupConfirmed": cleanup,
                    "hostFreeBytesBefore": before, "hostFreeBytesAfter": shutil.disk_usage(root).free,
                    "kvmReadWrite": os.access("/dev/kvm", os.R_OK | os.W_OK), "avdDataPartitions": partitions,
                    "markers": [name for name, pattern in markers.items() if re.search(pattern, data, re.I)],
                    "missingLibraries": libraries, "privateLogSha256": hashlib.sha256(data).hexdigest()}
          (live.UI / "diagnostics.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          raise SystemExit(0 if booted and cleanup else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: android-startup-diagnostics-${{ github.sha }}
          path: .artifacts/vdp/android-startup-probe/diagnostics.json
          if-no-files-found: warn
          retention-days: 3
