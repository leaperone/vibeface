name: Reusable / Build desktop package
on:
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      runner: {type: string, required: true}
      target: {type: string, required: true}
      native_artifact_id: {type: string, required: true}
      sign: {type: boolean, default: false}
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: {required: false}
      MACOS_CERTIFICATE_PASSWORD: {required: false}
      APPLE_API_KEY_P8_BASE64: {required: false}
      APPLE_API_KEY_ID: {required: false}
      APPLE_API_ISSUER_ID: {required: false}
      WINDOWS_CERTIFICATE_PFX_BASE64: {required: false}
      WINDOWS_CERTIFICATE_PASSWORD: {required: false}
      WINDOWS_CERTIFICATE_SUBJECT: {required: false}
      WINDOWS_CERTIFICATE_THUMBPRINT: {required: false}
    outputs:
      artifact_id:
        value: ${{ jobs.desktop.outputs.artifact_id }}
permissions:
  contents: read
jobs:
  desktop:
    name: Build desktop / ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run: {shell: bash}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.native_artifact_id }}
          merge-multiple: true
          path: .artifacts/native-release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Select this platform's Python
        run: printf 'PY=%s\n' "$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/native-desktop
      - uses: ./.github/actions/msvc-environment
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: gpui-native-${{ inputs.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Unpack the released runtime for this platform
        id: runtime
        env:
          TARGET: ${{ inputs.target }}
        run: |
          version=$("$PY" -B scripts/release.py plan --app product | "$PY" -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          archive=".artifacts/native-release/vibeface-$version-$TARGET.tar.gz"
          "$PY" -B scripts/checksum.py ".artifacts/native-release/vibeface-$version-$TARGET.tar.gz.sha256"
          mkdir -p .artifacts/runtime
          tar -xzf "$archive" -C .artifacts/runtime
          {
            printf 'dir=%s\n' "$PWD/.artifacts/runtime/vibeface-$version-$TARGET"
            printf 'archive=%s\n' "$PWD/$archive"
          } >> "$GITHUB_OUTPUT"
      - name: Import the Developer ID signing identity
        if: inputs.sign && runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/import-mac-identity.sh
      - name: Build the desktop application around the sealed runtime
        env:
          TARGET: ${{ inputs.target }}
          RUNTIME_DIR: ${{ steps.runtime.outputs.dir }}
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.archive }}
          SIGN: ${{ inputs.sign }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          VIBEFACE_WINDOWS_EXPECTED_SUBJECT: ${{ secrets.WINDOWS_CERTIFICATE_SUBJECT }}
          VIBEFACE_WINDOWS_EXPECTED_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          arguments=(--target "$TARGET" --runtime-dir "$RUNTIME_DIR" --runtime-archive "$RUNTIME_ARCHIVE" --output .artifacts/desktop)
          if [[ "$SIGN" == true && ( "$TARGET" == *-apple-darwin || -n "$WIN_CSC_LINK" ) ]]; then arguments+=(--sign); fi
          node scripts/build-desktop.mjs "${arguments[@]}"
      - name: Verify the built application and its provenance
        env:
          TARGET: ${{ inputs.target }}
        run: |
          node scripts/verify-desktop.mjs --target "$TARGET" --input .artifacts/desktop
          "$PY" -B scripts/release.py manifest product .artifacts/desktop
      - name: Remove the signing keychain and notary key
        if: always() && inputs.sign && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/vibeface-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/vibeface-notary.p8" "$RUNNER_TEMP/vibeface-signing.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: desktop-release-${{ inputs.target }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: .artifacts/desktop/*
          if-no-files-found: error
