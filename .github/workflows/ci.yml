name: ci

on:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      delivery_live:
        description: 'Run genuine local paid delivery proofs and settlement in the bounded Linux sandbox'
        type: boolean
        default: false
      delivery_small:
        description: 'Run only the bounded 4 KiB proof, settlement and exposed-key experiments'
        type: boolean
        default: false
      delivery_small_resume_run:
        description: 'Optional explicit same-source small-experiment run ID to reuse verified public parts'
        type: string
        default: ''
      windows_only:
        description: 'Run only the native MSVC platform, Core and CLI checks'
        type: boolean
        default: false
      mobile_apps:
        description: 'Build native mobile apps independently, without the desktop acceptance jobs'
        type: choice
        options: [none, ios, android, both]
        default: none
      desktop_only:
        description: 'Run only independent Mac and Windows native builds, desktop windows and Windows platform checks'
        type: boolean
        default: false
      desktop:
        description: 'Also run the hosted Windows native checks and the real Mac and Windows desktop window tests'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.delivery_small && 'delivery-small' || format('{0}-{1}-{2}', github.event_name, github.ref, (github.event_name == 'workflow_dispatch' || github.run_attempt > 1) && github.run_id || '') }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  plan:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.delivery_small || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      web: ${{ steps.select.outputs.web }}
      www: ${{ steps.select.outputs.www }}
      rust: ${{ steps.select.outputs.rust }}
      slow: ${{ steps.select.outputs.slow }}
      delivery: ${{ steps.select.outputs.delivery }}
      package: ${{ steps.select.outputs.package }}
      package_matrix: ${{ steps.select.outputs.package_matrix }}
      package_mode: ${{ steps.select.outputs.package_mode }}
      npm: ${{ steps.select.outputs.npm }}
      version: ${{ steps.select.outputs.version }}
      msrv: ${{ steps.select.outputs.msrv }}
      channel: ${{ steps.select.outputs.channel }}
      prerelease: ${{ steps.select.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Select checks from the complete change and event
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci.py plan --github-output "$GITHUB_OUTPUT"

  quick-check:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.desktop_only) }}
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: ariga/setup-atlas@d1698c9cc991e6d65a02ce8bb9cd69fba6223cff # v0
        if: needs.plan.outputs.rust == 'true'
        with:
          version: v1.3.0
      - name: Validate migration files without opening a database
        if: needs.plan.outputs.rust == 'true'
        run: atlas migrate validate --dir file://apps/core/migrations
      - name: Check workflow, selectors and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python3 scripts/ci.py --self-test
          python3 scripts/check-delivery.py --self-test
          python3 scripts/install-delivery-toolchain.py --self-test
          python3 scripts/run-delivery-live.py --self-test
          python3 scripts/daily-nightly.py --self-test
          python3 scripts/release.py self-test
          python3 scripts/package-node-windows.py --self-test
          python3 scripts/checksum.py --self-test
          python3 scripts/ios_device.py --self-test
          python3 -c 'import ast, pathlib; [ast.parse(pathlib.Path(path).read_text(), filename=path) for path in ("scripts/ci.py", "scripts/verify-node.py", "scripts/check-delivery.py", "scripts/install-delivery-toolchain.py", "scripts/run-delivery-live.py", "scripts/release.py", "scripts/package-node-windows.py", "scripts/verify-windows-imports.py", "scripts/check-release-workflow.py", "scripts/daily-nightly.py")]'
          bash -n install.sh
          bash -n scripts/package-node.sh scripts/install-node-service.sh scripts/build-web-crypto.sh scripts/build-web.sh scripts/import-mac-identity.sh
          shellcheck install.sh scripts/package-node.sh scripts/install-node-service.sh scripts/build-web-crypto.sh scripts/build-web.sh scripts/import-mac-identity.sh
          bash install.sh --self-test
      - name: Check JavaScript syntax
        run: |
          node --check scripts/crypto-client.mjs
          node --check apps/cli/npm/bin/vibeface.mjs
          node --check scripts/package-npm.mjs
          node --check scripts/build-desktop.mjs
          node --check scripts/verify-desktop.mjs
          node --check scripts/e2e-desktop.mjs
          node --check apps/desktop/electron-builder.cjs
          node scripts/package-npm.mjs --self-test
          node scripts/publish-npm.mjs --self-test
          node scripts/build-desktop.mjs --self-test
          node scripts/verify-desktop.mjs --self-test
      - run: cargo fmt --all -- --check

  www:
    needs: plan
    if: ${{ (needs.plan.outputs.www == 'true') && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build the static www portal
        run: |
          pnpm --filter vibeface-www run typecheck
          pnpm --filter vibeface-www run build
          pnpm --filter vibeface-www run check:static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: www-${{ github.sha }}
          path: apps/www/dist/client
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  crypto-web:
    needs: plan
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: crypto-web
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build shared browser cryptography
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          npm install -g binaryen@132.0.0
          bash scripts/build-web-crypto.sh
          cargo build -p vibeface-secure --example secure-probe --locked
          node scripts/crypto-client.mjs --self-test --native-probe target/debug/examples/secure-probe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crypto-web-${{ github.sha }}
          path: |
            apps/app/generated/vibeface_secure.js
            apps/app/generated/vibeface_secure_bg.wasm
            apps/app/generated/*.d.ts
            apps/app/generated/.vibeface-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  web:
    needs: [plan, crypto-web]
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crypto-web-${{ github.sha }}
          path: apps/app/generated
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Build and typecheck the static web client
        run: bash scripts/build-web.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ github.sha }}
          path: apps/app/dist/client
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  rust-check:
    needs: [plan, quick-check]
    if: ${{ (needs.plan.outputs.rust == 'true') && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Check affected crates with Clippy and optional minimum Rust version
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          MSRV: ${{ needs.plan.outputs.msrv }}
        run: python3 scripts/ci.py check --plan-env CI_PLAN --msrv "$MSRV"

  rust-fast:
    needs: plan
    if: ${{ (needs.plan.outputs.rust == 'true') && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG: 'line-tables-only'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-opt1
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Run affected Rust tests except the exact heavy scenarios
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: /usr/bin/time -v python3 scripts/ci.py test --tier fast --plan-env CI_PLAN

  rust-slow:
    needs: plan
    if: ${{ (needs.plan.outputs.slow == 'true') && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG: 'line-tables-only'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-opt1
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Run the exact heavy Node scenarios
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: /usr/bin/time -v python3 scripts/ci.py test --tier slow --plan-env CI_PLAN

  delivery:
    needs: plan
    if: ${{ (needs.plan.outputs.delivery == 'true') && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    runs-on: ubuntu-24.04
    env:
      RISC0_HOME: /risc0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: delivery
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          workspaces: |
            . -> .artifacts/vdp/domain-target
            crates/delivery/proof -> ../../../.artifacts/vdp/proof-target
      - name: Check public delivery fixtures when present
        run: python3 scripts/check-delivery.py --check-fixtures
      - name: Install checksum-pinned guest compiler in artifacts
        run: python3 scripts/install-delivery-toolchain.py
      - name: Bind canonical Linux build paths
        run: |
          mkdir -p .artifacts/vdp "${CARGO_HOME:-$HOME/.cargo}"
          sudo mkdir -p /work /cargo /risc0 /artifacts
          sudo mount --bind "$PWD" /work
          sudo mount --bind "${CARGO_HOME:-$HOME/.cargo}" /cargo
          sudo mount --bind "$PWD/.artifacts/vdp/risc0" /risc0
          sudo mount --bind "$PWD/.artifacts/vdp" /artifacts
      - name: Rebuild guest and verify real delivery receipts on host and EVM
        working-directory: /work
        env:
          CARGO_HOME: /cargo
        run: python3 scripts/check-delivery.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: delivery-${{ github.sha }}
          path: |
            .artifacts/vdp/host-info.json
            .artifacts/vdp/proof-results.json
            .artifacts/vdp/public-vectors.json
            .artifacts/vdp/contracts/*-results.json
          if-no-files-found: warn
          retention-days: 7

  package:
    needs: [plan, crypto-web, web]
    if: ${{ (needs.plan.outputs.package == 'true') && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crypto-web-${{ github.sha }}
          path: apps/app/generated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-${{ github.sha }}
          path: apps/app/dist/client
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: package-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Import Developer ID signing identity
        if: matrix.target == 'aarch64-apple-darwin' && github.event_name != 'merge_group'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/import-mac-identity.sh
      - name: Select this platform's Python
        run: printf 'PY=%s\n' "$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/msvc-environment
        if: runner.os == 'Windows'
      - name: Build native release package
        run: |
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == "$PACKAGE_TARGET" ]]
          if [[ "$PACKAGE_TARGET" == *-windows-* ]]; then
            "$PY" scripts/package-node-windows.py
          else
            bash scripts/package-node.sh --target "$PACKAGE_TARGET"
          fi
          if [[ -n "${VIBEFACE_NOTARY_KEY:-}" ]]; then
            security delete-keychain "$RUNNER_TEMP/vibeface-signing.keychain-db"
            rm -f "$VIBEFACE_NOTARY_KEY"
          fi
      - name: Verify checksum and unpacked source identity
        id: unpack
        run: |
          shopt -s nullglob
          archives=(.artifacts/packages/*.tar.gz)
          [[ "${#archives[@]}" == 1 ]]
          archive="${archives[0]}"
          name="$(basename "$archive" .tar.gz)"
          "$PY" -B scripts/checksum.py ".artifacts/packages/$name.tar.gz.sha256"
          mkdir -p .artifacts/unpacked
          tar -xzf "$archive" -C .artifacts/unpacked
          package="$PWD/.artifacts/unpacked/$name"
          "$PY" - "$package/BUILD-INFO.json" <<'PY'
          import json, os, pathlib, re, subprocess, sys
          info = json.load(open(sys.argv[1]))
          config = pathlib.Path("crates/control/src/lib.rs").read_text()
          protocol, epoch = (int(re.search(rf"^pub const {name}: u32 = (\d+);$", config, re.M)[1]) for name in ("UPDATE_PROTOCOL", "DATA_EPOCH"))
          assert set(info) == {"version", "target", "source_commit", "update_protocol", "data_epoch", "core_version", "core_source_commit", "app_version", "app_source_commit"}
          assert info["update_protocol"] == protocol and info["data_epoch"] == epoch
          assert info["source_commit"] == os.environ["GITHUB_SHA"]
          assert info["target"] == os.environ["PACKAGE_TARGET"]
          suffix = ".exe" if info["target"].endswith("-pc-windows-msvc") else ""
          binary = pathlib.Path(sys.argv[1]).parent / f"vibeface{suffix}"
          web = binary.parent / "web"
          assert (web / "_shell.html").stat().st_size > 0
          assert (web / "index.html").stat().st_size > 0
          assert (web / "_redirects").stat().st_size > 0
          assert (web / "_headers").stat().st_size > 0
          assert (web / ".vibeface-build.json").stat().st_size > 0
          assert (web / "vibeface_secure.js").stat().st_size > 0
          assert (web / "vibeface_secure_bg.wasm").read_bytes().startswith(b"\x00asm")
          assert (binary.parent / f"vibeface-core{suffix}").stat().st_size > 0
          installer = "install-node-service.ps1" if suffix else "install-node-service.sh"
          assert (binary.parent / "scripts" / installer).stat().st_size > 0
          assert subprocess.check_output([str(binary), "--version"], text=True).strip() == f'vibeface {info["version"]}'
          assert subprocess.check_output([str(binary.parent / f"vibeface-core{suffix}"), "--version"], text=True).strip() == f'vibeface-core {info["core_version"]}'
          PY
          exe=''
          if [[ "$PACKAGE_TARGET" == *-windows-* ]]; then exe='.exe'; fi
          "$package/vibeface$exe" --help
          "$package/vibeface-core$exe" --help
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
          printf 'exe=%s\n' "$exe" >> "$GITHUB_OUTPUT"
      - name: Verify Developer ID signature
        if: matrix.target == 'aarch64-apple-darwin' && github.event_name != 'merge_group'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: |
          set -o pipefail
          for binary in "$PACKAGE/vibeface" "$PACKAGE/vibeface-core"; do
            codesign --verify --strict "$binary"
            details="$(codesign -dvvv "$binary" 2>&1)"
            printf '%s\n' "$details"
            grep -qx 'Identifier=cn.leaperone.vibeface' <<< "$details"
            grep -qx "TeamIdentifier=$VIBEFACE_CODESIGN_TEAM" <<< "$details"
            grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' <<< "$details"
            binary_sha="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
            delays=(15 30 60 120 120 120 120 120 120)
            for attempt in $(seq 0 "${#delays[@]}"); do
              assessment="$RUNNER_TEMP/gatekeeper-assessment-$(basename "$binary")-$attempt.txt"
              if spctl -a -vvv --ignore-cache --no-cache -t open --context context:primary-signature "$binary" >"$assessment" 2>&1; then
                assessment_status=0
              else
                assessment_status=$?
              fi
              cat "$assessment"
              printf 'Gatekeeper assessment %s exited %s\n' "$attempt" "$assessment_status"
              test "$(shasum -a 256 "$binary" | cut -d ' ' -f 1)" = "$binary_sha"
              if test "$assessment_status" -eq 0; then
                grep -qx 'source=Notarized Developer ID' "$assessment"
                break
              fi
              if test "$assessment_status" -ne 3 || ! grep -qx 'source=Unnotarized Developer ID' "$assessment" || test "$attempt" -eq "${#delays[@]}"; then
                exit "$assessment_status"
              fi
              sleep "${delays[$attempt]}"
            done
          done
      - name: Verify packaged Web assets and process
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-web --web-only
      - name: Verify packaged free discovery and charity delivery over real Node processes
        if: needs.plan.outputs.delivery == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
          VIBEFACE_PROBE_SOURCE_ROOT: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/delivery-probe/target
        run: |
          cargo fmt --manifest-path tests/fixtures/delivery-probe/Cargo.toml -- --check
          cargo build --manifest-path tests/fixtures/delivery-probe/Cargo.toml --locked
          python3 scripts/verify-node.py --delivery-charity --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts "$PWD/.artifacts/ci-delivery" --delivery-probe "$CARGO_TARGET_DIR/debug/vibeface-delivery-probe" --delivery-source-root "$PWD" --delivery-profile "$PWD/crates/delivery/proof/profile.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && needs.plan.outputs.delivery == 'true' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: delivery-charity-${{ github.sha }}
          path: .artifacts/ci-delivery/delivery-charity-*/report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Use official Ubuntu package mirror
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: printf 'https://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
      - name: Cache Chromium binaries
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .artifacts/e2e/browsers
          key: ${{ matrix.runner }}-${{ runner.arch }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Verify packaged Web onboarding in Chromium
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          VIBEFACE_E2E_BINARY: ${{ steps.unpack.outputs.package }}/vibeface
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/e2e/browsers
          E2E_TELEMETRY_DISABLED: '1'
        run: |
          pnpm install --frozen-lockfile --filter .
          pnpm test:e2e:check
          pnpm exec e2e-web install chromium --with-deps
          pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && matrix.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: e2e-${{ github.sha }}
          path: |
            tests/e2e/.artifacts/results
            !tests/e2e/.artifacts/results/**/downloads/**
          if-no-files-found: warn
          retention-days: 7
      - name: Verify unpacked Node scheduling and signed log without model calls
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-node --phase1
      - name: Verify multi-Node sync, entrances and delivery over iroh
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-multi-node
      - name: Verify bot tools and startup event recovery
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'aarch64-apple-darwin'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-chat-agent --chat-agent
      - name: Verify cross-device coordination, owner moves and attachments
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-phase4 --phase4
      - name: Verify the public entry and its relay token
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-public-entry --public-entry
      - name: Verify discovery-only assistance and headless Nodes
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-discovery --discovery
      - name: Verify write protection, status and diagnostics
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'aarch64-apple-darwin'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-phase5 --phase5
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-package-${{ matrix.target }}-${{ github.sha }}
          path: |
            .artifacts/packages/*.tar.gz
            .artifacts/packages/*.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Node failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-process-failure-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci-web/web-process-*/report.json
            .artifacts/ci-web/web-process-*/WEB/process.log
            .artifacts/ci-node/phase1-process-*/report.json
            .artifacts/ci-node/phase1-process-*/A/process.log
            .artifacts/ci-node/phase1-process-*/fixture-manager-*.stderr.log
            .artifacts/ci-chat-agent/chat-agent-process-*/report.json
            .artifacts/ci-chat-agent/chat-agent-process-*/A/process.log
            .artifacts/ci-chat-agent/chat-agent-process-*/fixture-manager-*.stderr.log
            .artifacts/ci-chat-agent/chat-agent-process-*/manager-tool-errors.jsonl
            .artifacts/ci-phase4/phase4-*/report.json
            .artifacts/ci-phase4/phase4-*/*/node.log
            .artifacts/ci-discovery/discovery-*/report.json
            .artifacts/ci-discovery/discovery-*/*/node.log
            .artifacts/ci-public-entry/public-entry-*/report.json
            .artifacts/ci-public-entry/public-entry-*/*/node.log
            .artifacts/ci-phase5/phase5-*/report.json
            .artifacts/ci-phase5/phase5-*/*/node.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing keychain and notary key
        if: always() && matrix.target == 'aarch64-apple-darwin' && github.event_name != 'merge_group'
        run: |
          security delete-keychain "$RUNNER_TEMP/vibeface-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/vibeface-notary.p8" "$RUNNER_TEMP/vibeface-signing.p12"

  delivery-small-prepare:
    if: github.event_name == 'workflow_dispatch' && inputs.delivery_small
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.run.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require a single explicit experiment mode
        env:
          DELIVERY_LIVE: ${{ inputs.delivery_live }}
        run: test "$DELIVERY_LIVE" = false
      - name: Rebuild the canonical profile and verify two actual fixture replays
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.delivery_small_resume_run }}
        run: |
          args=(--sandbox --prove-small prepare)
          if [[ -n "$RESUME_RUN" ]]; then args+=(--resume-run "$RESUME_RUN"); fi
          python3 scripts/check-delivery.py "${args[@]}"
      - name: Preserve validated public preparation evidence
        if: ${{ always() && steps.run.outputs.public-directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-small-prepare-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run.outputs.public-directory }}
          if-no-files-found: error
          retention-days: 14

  delivery-small-proofs:
    needs: delivery-small-prepare
    if: github.event_name == 'workflow_dispatch' && inputs.delivery_small
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.delivery-small-prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prove the selected relation or independently verify its saved part
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          WORK_ITEM: ${{ matrix.item }}
          RESUME_RUN: ${{ inputs.delivery_small_resume_run }}
        run: |
          args=(--sandbox --prove-small "$WORK_ITEM")
          if [[ -n "$RESUME_RUN" ]]; then args+=(--resume-run "$RESUME_RUN"); fi
          python3 scripts/check-delivery.py "${args[@]}"
      - name: Preserve independently verified public part or unqualified diagnostic
        if: ${{ always() && steps.run.outputs.public-directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-small-${{ matrix.item }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run.outputs.public-directory }}
          if-no-files-found: error
          retention-days: 14

  delivery-small-accept:
    needs: [delivery-small-prepare, delivery-small-proofs]
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.delivery_small && needs.delivery-small-prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require all four qualified parts before the original money and recovery checks
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.delivery_small_resume_run }}
        run: |
          args=(--sandbox --prove-small accept)
          if [[ -n "$RESUME_RUN" ]]; then args+=(--resume-run "$RESUME_RUN"); fi
          python3 scripts/check-delivery.py "${args[@]}"
      - name: Preserve independently verified final public evidence
        if: ${{ always() && steps.run.outputs.public-directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delivery-small-accept-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.run.outputs.public-directory }}
          if-no-files-found: error
          retention-days: 14

