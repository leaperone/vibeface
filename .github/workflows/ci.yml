  npm-package:
    needs: [plan, package-linux, package-linux-arm, package-macos]
    if: needs.plan.outputs.npm == 'true'
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require explicit producer artifact IDs
        env:
          ARTIFACT_IDS: ${{ needs.package-linux.outputs.artifact_id }},${{ needs.package-linux-arm.outputs.artifact_id }},${{ needs.package-macos.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_IDS" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.package-linux.outputs.artifact_id }},${{ needs.package-linux-arm.outputs.artifact_id }},${{ needs.package-macos.outputs.artifact_id }}
          path: .artifacts/npm-input
          merge-multiple: true
      - name: Package verified native releases for npm
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/package-npm.mjs --input .artifacts/npm-input --source-commit "$SOURCE_COMMIT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package-${{ github.sha }}-${{ github.run_attempt }}
          path: .artifacts/npm/leaperone-vibeface-*.tgz*
          if-no-files-found: error
          retention-days: 14

  npm-smoke:
    needs: [plan, npm-package]
    if: needs.plan.outputs.npm == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require explicit producer artifact IDs
        env:
          ARTIFACT_IDS: ${{ needs.npm-package.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_IDS" =~ ^[1-9][0-9]*(,[1-9][0-9]*)*$ ]]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.npm-package.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/npm
      - name: Install npm artifact without lifecycle scripts
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          prefix="$PWD/.artifacts/npm-installed"
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund "$PWD/.artifacts/npm/leaperone-vibeface-$PACKAGE_VERSION.tgz"
          [[ "$("$prefix/bin/vibeface" --version)" == "vibeface $PACKAGE_VERSION" ]]
          core_version="$(node -p "require('$prefix/lib/node_modules/@leaperone/vibeface/vendor/$PACKAGE_TARGET/BUILD-INFO.json').core_version")"
          [[ "$("$prefix/lib/node_modules/@leaperone/vibeface/vendor/$PACKAGE_TARGET/vibeface-core" --version)" == "vibeface-core $core_version" ]]
          "$prefix/bin/vibeface" --help
      - name: Verify npm startup and bundled web
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          prefix="$PWD/.artifacts/npm-installed"
          python3 scripts/verify-node.py --binary "$prefix/bin/vibeface" --core-binary "$prefix/lib/node_modules/@leaperone/vibeface/vendor/$PACKAGE_TARGET/vibeface-core" --crypto-module "$prefix/lib/node_modules/@leaperone/vibeface/vendor/$PACKAGE_TARGET/web/vibeface_secure.js" --artifacts .artifacts/ci-npm --web-only

  ci-gate:
    name: ci-gate
    if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.delivery_small) }}
    needs: [plan, quick-check, crypto-web, web, www, rust-check, rust-fast, rust-slow, delivery, delivery-live, native-linux, native-linux-arm, native-macos, package-linux, package-linux-arm, package-macos, npm-package, npm-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every check selected for this commit and scenario
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py gate --needs-env CI_NEEDS ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_live && '--delivery-live' || '' }}

  daily-nightly:
    needs: ci-gate
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: daily-nightly
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Reconcile daily version PR and immutable Nightly archives
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RELEASE_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
        run: |
          gh auth setup-git
          python3 scripts/daily-nightly.py --run-id "$GITHUB_RUN_ID"
