  npm-package:
    needs: [plan, package]
    if: ${{ (needs.plan.outputs.npm == 'true') && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: node-package-*-${{ github.sha }}
          path: .artifacts/npm-input
          merge-multiple: true
      - name: Package verified native releases for npm
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/package-npm.mjs --input .artifacts/npm-input --source-commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: .artifacts/npm/leaperone-vibeface-*.tgz*
          if-no-files-found: error
          retention-days: 14

  npm-smoke:
    needs: [plan, npm-package]
    if: ${{ (needs.plan.outputs.npm == 'true') && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: .artifacts/npm
      - name: Install npm artifact without lifecycle scripts
        id: install
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          prefix="$PWD/.artifacts/npm-installed"
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund "$PWD/.artifacts/npm/leaperone-vibeface-$PACKAGE_VERSION.tgz"
          if [[ "$PACKAGE_TARGET" == *-windows-* ]]; then
            exe='.exe'
            launcher="$prefix/vibeface"
            vendor="$prefix/node_modules/@leaperone/vibeface/vendor/$PACKAGE_TARGET"
          else
            exe=''
            launcher="$prefix/bin/vibeface"
            vendor="$prefix/lib/node_modules/@leaperone/vibeface/vendor/$PACKAGE_TARGET"
          fi
          [[ "$("$launcher" --version)" == "vibeface $PACKAGE_VERSION" ]]
          core_version="$(node -p "require('$vendor/BUILD-INFO.json').core_version")"
          [[ "$("$vendor/vibeface-core$exe" --version)" == "vibeface-core $core_version" ]]
          "$launcher" --help
          printf 'vendor=%s\n' "$vendor" >> "$GITHUB_OUTPUT"
      - name: Verify npm startup and bundled web
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env:
          VENDOR: ${{ steps.install.outputs.vendor }}
        run: |
          prefix="$PWD/.artifacts/npm-installed"
          python3 scripts/verify-node.py --binary "$prefix/bin/vibeface" --core-binary "$VENDOR/vibeface-core" --crypto-module "$VENDOR/web/vibeface_secure.js" --artifacts .artifacts/ci-npm --web-only

  windows-native:
    needs: [plan, package]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop && contains(needs.plan.outputs.package_matrix, 'x86_64-pc-windows-msvc') }}
    uses: ./.github/workflows/ci-windows-native.yml
    with:
      source_sha: ${{ github.sha }}
      package_artifact: node-package-x86_64-pc-windows-msvc-${{ github.sha }}

  desktop-macos:
    needs: [plan, package]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop && contains(needs.plan.outputs.package_matrix, 'aarch64-apple-darwin') }}
    uses: ./.github/workflows/ci-desktop.yml
    with:
      source_sha: ${{ github.sha }}
      runner: macos-15
      target: aarch64-apple-darwin
      package_artifact: node-package-aarch64-apple-darwin-${{ github.sha }}

  desktop-windows:
    needs: [plan, package]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop && contains(needs.plan.outputs.package_matrix, 'x86_64-pc-windows-msvc') }}
    uses: ./.github/workflows/ci-desktop.yml
    with:
      source_sha: ${{ github.sha }}
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      package_artifact: node-package-x86_64-pc-windows-msvc-${{ github.sha }}

  desktop-only-macos:
    needs: [plan, crypto-web, web]
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_only
    uses: ./.github/workflows/ci-desktop.yml
    with:
      source_sha: ${{ github.sha }}
      runner: macos-15
      target: aarch64-apple-darwin

  desktop-only-windows:
    needs: [plan, crypto-web, web]
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_only
    uses: ./.github/workflows/ci-desktop.yml
    with:
      source_sha: ${{ github.sha }}
      runner: windows-2025
      target: x86_64-pc-windows-msvc

  desktop-only-linux-x64:
    needs: [plan, crypto-web, web]
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_only
    uses: ./.github/workflows/ci-desktop.yml
    with:
      source_sha: ${{ github.sha }}
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu

  desktop-only-linux-arm64:
    needs: [plan, crypto-web, web]
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_only
    uses: ./.github/workflows/ci-desktop.yml
    with:
      source_sha: ${{ github.sha }}
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu

  mobile-plan:
    if: github.event_name == 'workflow_dispatch' && inputs.mobile_apps != 'none'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - id: version
        name: Read the committed mobile release version
        run: |
          python3 - <<'PYTHON'
          import json, os
          version = json.load(open('apps/mobile/app.json'))['expo']['extra']['releaseVersion']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('value=' + version + '\n')
          PYTHON

  ios-device:
    needs: [mobile-plan]
    if: github.event_name == 'workflow_dispatch' && (inputs.mobile_apps == 'ios' || inputs.mobile_apps == 'both')
    uses: ./.github/workflows/release-ios.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.mobile-plan.outputs.version }}
    secrets:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

  android-app:
    needs: [mobile-plan]
    if: github.event_name == 'workflow_dispatch' && (inputs.mobile_apps == 'android' || inputs.mobile_apps == 'both')
    uses: ./.github/workflows/release-apps.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.mobile-plan.outputs.version }}
      tag: ''

  mobile-gate:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mobile_apps != 'none' }}
    needs: [mobile-plan, ios-device, android-app]
    runs-on: ubuntu-24.04
    steps:
      - name: Require exactly the selected native mobile applications
        env:
          MOBILE_NEEDS: ${{ toJSON(needs) }}
          SCOPE: ${{ inputs.mobile_apps }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          checks = json.loads(os.environ['MOBILE_NEEDS'])
          required = ['mobile-plan']
          if os.environ['SCOPE'] in ('ios', 'both'): required.append('ios-device')
          if os.environ['SCOPE'] in ('android', 'both'): required.append('android-app')
          failed = {name: checks[name]['result'] for name in required if checks[name]['result'] != 'success'}
          if failed: raise SystemExit('Native mobile builds are incomplete: ' + json.dumps(failed))
          print('Selected native mobile application builds passed')
          PYTHON

  windows-platform:
    if: github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only)
    uses: ./.github/workflows/ci-windows-native.yml
    with:
      source_sha: ${{ github.sha }}

  windows-gate:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.windows_only }}
    needs: [windows-platform]
    runs-on: ubuntu-24.04
    steps:
      - name: Require the native Windows checks
        env:
          RESULT: ${{ needs.windows-platform.result }}
        run: test "$RESULT" = success

  desktop-gate:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.desktop_only }}
    needs: [plan, crypto-web, web, desktop-only-macos, desktop-only-windows, desktop-only-linux-x64, desktop-only-linux-arm64, windows-platform]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all native platforms and their real desktop windows
        env:
          DESKTOP_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          checks = json.loads(os.environ['DESKTOP_NEEDS'])
          failed = {name: job['result'] for name, job in checks.items() if job['result'] != 'success'}
          if failed:
              raise SystemExit('Desktop acceptance is incomplete: ' + json.dumps(failed))
          print('All native desktop applications and Windows platform checks passed')
          PYTHON

  ci-gate:
    name: ci-gate
    if: ${{ (always() && !(github.event_name == 'workflow_dispatch' && inputs.delivery_small)) && !(github.event_name == 'workflow_dispatch' && (inputs.desktop_only || inputs.windows_only || inputs.mobile_apps != 'none')) }}
    needs: [plan, quick-check, crypto-web, web, www, rust-check, rust-fast, rust-slow, delivery, delivery-live, package, npm-package, npm-smoke, windows-native, desktop-macos, desktop-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every check selected for this commit and scenario
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci.py gate --needs-env CI_NEEDS ${{ github.event_name == 'workflow_dispatch' && inputs.delivery_live && '--delivery-live' || '' }} ${{ github.event_name == 'workflow_dispatch' && inputs.desktop && '--desktop' || '' }}

  daily-nightly:
    needs: ci-gate
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: daily-nightly
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Reconcile daily version PR and immutable Nightly archives
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_RELEASE_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
        run: |
          gh auth setup-git
          python3 scripts/daily-nightly.py --run-id "$GITHUB_RUN_ID"
