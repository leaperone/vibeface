name: CI / Core
run-name: >-
  Core · ${{ github.event_name }} · ${{ github.ref_name }} · ${{ inputs.package_policy || 'standard' }}

on:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
  workflow_call:
    inputs:
      package_policy:
        description: Internal package coverage policy, standard or linux-native
        type: string
        default: standard
    outputs:
      source_sha:
        value: ${{ jobs.plan.outputs.source_sha }}
      version:
        value: ${{ jobs.plan.outputs.version }}

concurrency:
  group: ci-core-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.package_policy || 'standard' }}${{ inputs.package_policy == 'linux-native' && format('-proof-{0}', github.run_id) || (github.run_attempt > 1 && format('-rerun-{0}', github.run_id) || '') }}
  cancel-in-progress: ${{ inputs.package_policy != 'linux-native' && github.run_attempt == 1 && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

permissions:
  contents: read

jobs:
  plan:
    name: Select frozen coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      source_sha: ${{ steps.select.outputs.source_sha }}
      web: ${{ steps.select.outputs.web }}
      web_tests: ${{ steps.select.outputs.web_tests }}
      crypto: ${{ steps.select.outputs.crypto }}
      www: ${{ steps.select.outputs.www }}
      mobile: ${{ steps.select.outputs.mobile }}
      desktop: ${{ steps.select.outputs.desktop }}
      rust: ${{ steps.select.outputs.rust }}
      slow: ${{ steps.select.outputs.slow }}
      delivery: ${{ steps.select.outputs.delivery }}
      package: ${{ steps.select.outputs.package }}
      package_matrix: ${{ steps.select.outputs.package_matrix }}
      package_mode: ${{ steps.select.outputs.package_mode }}
      npm: ${{ steps.select.outputs.npm }}
      version: ${{ steps.select.outputs.version }}
      msrv: ${{ steps.select.outputs.msrv }}
      channel: ${{ steps.select.outputs.channel }}
      prerelease: ${{ steps.select.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Select checks from the complete change and event
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          CI_PACKAGE_POLICY: ${{ inputs.package_policy || 'standard' }}
        run: python3 scripts/ci.py plan --package-policy-env CI_PACKAGE_POLICY --github-output "$GITHUB_OUTPUT"

  quick-check:
    name: Workflow and source checks
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: ariga/setup-atlas@d1698c9cc991e6d65a02ce8bb9cd69fba6223cff # v0
        if: needs.plan.outputs.rust == 'true'
        with:
          version: v1.3.0
      - name: Validate migration files without opening a database
        if: needs.plan.outputs.rust == 'true'
        run: atlas migrate validate --dir file://apps/core/migrations
      - name: Check workflow, selectors and shell scripts
        env:
          GOTOOLCHAIN: go1.26.3
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          python3 scripts/ci.py --self-test
          python3 scripts/check-cli-parity.py --self-test
          python3 scripts/check-cli-parity.py
          python3 scripts/check-delivery.py --self-test
          python3 scripts/install-delivery-toolchain.py --self-test
          python3 scripts/run-delivery-live.py --self-test
          python3 scripts/daily-nightly.py --self-test
          python3 scripts/release.py self-test
          python3 -B scripts/test_progressive_publication.py
          python3 scripts/package-node-windows.py --self-test
          python3 scripts/checksum.py --self-test
          python3 scripts/ios_device.py --self-test
          python3 scripts/verify-node.py --binary /usr/bin/true --artifacts .artifacts/native-clipboard-selfcheck --native-clipboard-selfcheck
          python3 -c 'import ast, pathlib; [ast.parse(pathlib.Path(path).read_text(), filename=path) for path in ("scripts/ci.py", "scripts/verify-node.py", "scripts/check-delivery.py", "scripts/install-delivery-toolchain.py", "scripts/run-delivery-live.py", "scripts/verify-delivery-protected.py", "scripts/verify-delivery-restart-observer.py", "scripts/release.py", "scripts/package-node-windows.py", "scripts/verify-windows-imports.py", "scripts/check-release-workflow.py", "scripts/daily-nightly.py", "scripts/nightly_source.py")]'
          bash -n install.sh
          bash -n scripts/package-node.sh scripts/install-node-service.sh scripts/build-web-crypto.sh scripts/build-web.sh scripts/import-mac-identity.sh
          shellcheck install.sh scripts/package-node.sh scripts/install-node-service.sh scripts/build-web-crypto.sh scripts/build-web.sh scripts/import-mac-identity.sh
          bash install.sh --self-test
      - name: Check JavaScript syntax
        run: |
          node --check scripts/crypto-client.mjs
          node --check apps/cli/npm/bin/vibeface.mjs
          node --check scripts/package-npm.mjs
          node --check scripts/build-desktop.mjs
          node --check scripts/verify-desktop.mjs
          node --check scripts/e2e-desktop.mjs
          node scripts/package-npm.mjs --self-test
          node scripts/publish-npm.mjs --self-test
          python3 -B scripts/offline-docs.py --self-test
          node scripts/build-desktop.mjs --self-test
          node scripts/verify-desktop.mjs --self-test
      - run: cargo fmt --all -- --check

  www:
    name: Static portal
    needs: plan
    if: needs.plan.outputs.www == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check and build the static www portal
        run: |
          pnpm --filter vibeface-www run typecheck
          pnpm --filter vibeface-www run build
          pnpm --filter vibeface-www run check:static
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: www-${{ github.sha }}
          path: apps/www/dist/client
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  crypto-web:
    name: Browser cryptography
    needs: plan
    if: needs.plan.outputs.crypto == 'true'
    uses: ./.github/workflows/_ci-crypto.yml
    with:
      source_sha: ${{ github.sha }}

  web:
    name: Web assets and checks
    needs: [plan, crypto-web]
    if: needs.plan.outputs.web == 'true'
    uses: ./.github/workflows/_ci-web.yml
    with:
      source_sha: ${{ github.sha }}

  web-tests:
    name: Web and shared client unit tests
    needs: [plan, crypto-web]
    if: needs.plan.outputs.web_tests == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crypto-web-${{ github.sha }}
          path: apps/app/generated
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Verify crypto inputs and run Web and shared client tests
        run: |
          python3 -B scripts/build-inputs.py check crypto
          pnpm install --frozen-lockfile --filter 'vibeface-web...' --filter 'vibeface-mobile...'
          pnpm --filter vibeface-web generate-routes
          pnpm --filter vibeface-web test
          pnpm --filter vibeface-web typecheck
          pnpm --filter @vibeface/client test
          pnpm --filter @vibeface/client typecheck

  mobile-check:
    name: Mobile types
    needs: plan
    if: needs.plan.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --filter 'vibeface-mobile...'
      - name: Check shared client and native mobile types
        run: |
          pnpm --filter @vibeface/client run typecheck
          pnpm --filter @vibeface/secure-native run typecheck
          pnpm --filter vibeface-mobile run typecheck

  desktop-check:
    name: Native desktop host checks
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: ./.github/actions/native-desktop
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with: {key: gpui-feature-check}
      - name: Check and test the native desktop host
        run: |
          cargo fmt --all -- --check
          cargo test -p vibeface-desktop --locked
          cargo clippy -p vibeface-desktop --all-targets --locked -- -D warnings

  rust-check:
    name: Rust lint and minimum version
    needs: [plan, quick-check]
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Check affected crates with Clippy and optional minimum Rust version
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
          MSRV: ${{ needs.plan.outputs.msrv }}
        run: python3 scripts/ci.py check --plan-env CI_PLAN --msrv "$MSRV"

  rust-fast:
    name: Rust fast tests
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG: 'line-tables-only'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-opt1
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Run affected Rust tests except the exact heavy scenarios
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: /usr/bin/time -v python3 scripts/ci.py test --tier fast --plan-env CI_PLAN --timings-file .artifacts/ci-timings/rust-fast.json
      - name: Keep Rust fast timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-fast-timing-${{ github.sha }}
          path: .artifacts/ci-timings/rust-fast.json
          if-no-files-found: warn
          retention-days: 7

  rust-slow:
    name: Rust heavy scenarios
    needs: plan
    if: needs.plan.outputs.slow == 'true'
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_DEBUG: 'line-tables-only'
      CARGO_PROFILE_TEST_DEBUG_ASSERTIONS: 'true'
      CARGO_PROFILE_TEST_OVERFLOW_CHECKS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test-opt1
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Run the exact heavy Node scenarios
        env:
          CI_PLAN: ${{ needs.plan.outputs.plan }}
        run: /usr/bin/time -v python3 scripts/ci.py test --tier slow --plan-env CI_PLAN --timings-file .artifacts/ci-timings/rust-slow.json
      - name: Keep Rust slow timing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rust-slow-timing-${{ github.sha }}
          path: .artifacts/ci-timings/rust-slow.json
          if-no-files-found: warn
          retention-days: 7

  delivery:
    name: Delivery fixture and contract checks
    needs: plan
    if: needs.plan.outputs.delivery == 'true'
    runs-on: ubuntu-24.04
    env:
      RISC0_HOME: /risc0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: delivery
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          workspaces: |
            . -> .artifacts/vdp/domain-target
            crates/delivery/proof -> ../../../.artifacts/vdp/proof-target
      - name: Check public delivery fixtures when present
        run: python3 scripts/check-delivery.py --check-fixtures
      - name: Install checksum-pinned guest compiler in artifacts
        run: python3 scripts/install-delivery-toolchain.py
      - name: Bind canonical Linux build paths
        run: |
          mkdir -p .artifacts/vdp "${CARGO_HOME:-$HOME/.cargo}"
          sudo mkdir -p /work /cargo /risc0 /artifacts
          sudo mount --bind "$PWD" /work
          sudo mount --bind "${CARGO_HOME:-$HOME/.cargo}" /cargo
          sudo mount --bind "$PWD/.artifacts/vdp/risc0" /risc0
          sudo mount --bind "$PWD/.artifacts/vdp" /artifacts
      - name: Rebuild guest and verify real delivery receipts on host and EVM
        working-directory: /work
        env:
          CARGO_HOME: /cargo
        run: python3 scripts/check-delivery.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: delivery-${{ github.sha }}
          path: |
            .artifacts/vdp/host-info.json
            .artifacts/vdp/proof-results.json
            .artifacts/vdp/public-vectors.json
            .artifacts/vdp/contracts/*-results.json
          if-no-files-found: warn
          retention-days: 7

  package:
    needs: [plan, crypto-web, web]
    if: needs.plan.outputs.package == 'true'
    name: Native package and acceptance (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crypto-web-${{ github.sha }}
          path: apps/app/generated
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-${{ github.sha }}
          path: apps/app/dist/client
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: package-with-probe-${{ matrix.target }}-${{ hashFiles('scripts/release-rustflags.py') }}${{ runner.os == 'Windows' && '-static-crt' || '' }}
          workspaces: |
            . -> target
            tests/fixtures/delivery-probe -> ../../../.artifacts/delivery-probe/target
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'pnpm' || '' }}
          cache-dependency-path: pnpm-lock.yaml
      - name: Import Developer ID signing identity
        if: matrix.target == 'aarch64-apple-darwin' && github.event_name != 'merge_group'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash scripts/import-mac-identity.sh
      - name: Select this platform's Python
        run: printf 'PY=%s\n' "$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/msvc-environment
        if: runner.os == 'Windows'
      - name: Build native release package
        run: |
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == "$PACKAGE_TARGET" ]]
          if [[ "$PACKAGE_TARGET" == *-windows-* ]]; then
            "$PY" scripts/package-node-windows.py
          else
            bash scripts/package-node.sh --target "$PACKAGE_TARGET"
          fi
          if [[ -n "${VIBEFACE_NOTARY_KEY:-}" ]]; then
            security delete-keychain "$RUNNER_TEMP/vibeface-signing.keychain-db"
            rm -f "$VIBEFACE_NOTARY_KEY"
          fi
      - name: Verify checksum and unpacked source identity
        id: unpack
        run: |
          shopt -s nullglob
          archives=(.artifacts/packages/*.tar.gz)
          [[ "${#archives[@]}" == 1 ]]
          archive="${archives[0]}"
          name="$(basename "$archive" .tar.gz)"
          "$PY" -B scripts/checksum.py ".artifacts/packages/$name.tar.gz.sha256"
          mkdir -p .artifacts/unpacked
          tar -xzf "$archive" -C .artifacts/unpacked
          package="$PWD/.artifacts/unpacked/$name"
          "$PY" - "$package/BUILD-INFO.json" <<'PY'
          import json, os, pathlib, re, subprocess, sys
          info = json.load(open(sys.argv[1]))
          config = pathlib.Path("crates/control/src/lib.rs").read_text()
          protocol, epoch = (int(re.search(rf"^pub const {name}: u32 = (\d+);$", config, re.M)[1]) for name in ("UPDATE_PROTOCOL", "DATA_EPOCH"))
          assert set(info) == {"version", "target", "source_commit", "update_protocol", "data_epoch", "core_version", "core_source_commit", "app_version", "app_source_commit"}
          assert info["update_protocol"] == protocol and info["data_epoch"] == epoch
          assert info["source_commit"] == os.environ["GITHUB_SHA"]
          assert info["target"] == os.environ["PACKAGE_TARGET"]
          suffix = ".exe" if info["target"].endswith("-pc-windows-msvc") else ""
          binary = pathlib.Path(sys.argv[1]).parent / f"vibeface{suffix}"
          web = binary.parent / "web"
          assert (web / "_shell.html").stat().st_size > 0
          assert (web / "index.html").stat().st_size > 0
          assert (web / "_redirects").stat().st_size > 0
          assert (web / "_headers").stat().st_size > 0
          assert (web / ".vibeface-build.json").stat().st_size > 0
          assert (web / "vibeface_secure.js").stat().st_size > 0
          assert (web / "vibeface_secure_bg.wasm").read_bytes().startswith(b"\x00asm")
          assert (binary.parent / f"vibeface-core{suffix}").stat().st_size > 0
          installer = "install-node-service.ps1" if suffix else "install-node-service.sh"
          assert (binary.parent / "scripts" / installer).stat().st_size > 0
          assert subprocess.check_output([str(binary), "--version"], text=True).strip() == f'vibeface {info["version"]}'
          assert subprocess.check_output([str(binary.parent / f"vibeface-core{suffix}"), "--version"], text=True).strip() == f'vibeface-core {info["core_version"]}'
          PY
          exe=''
          if [[ "$PACKAGE_TARGET" == *-windows-* ]]; then exe='.exe'; fi
          "$package/vibeface$exe" --help
          "$package/vibeface-core$exe" --help
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
          printf 'exe=%s\n' "$exe" >> "$GITHUB_OUTPUT"
      - name: Verify Developer ID signature
        if: matrix.target == 'aarch64-apple-darwin' && github.event_name != 'merge_group'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: |
          set -o pipefail
          for binary in "$PACKAGE/vibeface" "$PACKAGE/vibeface-core"; do
            codesign --verify --strict "$binary"
            details="$(codesign -dvvv "$binary" 2>&1)"
            printf '%s\n' "$details"
            grep -qx 'Identifier=cn.leaperone.vibeface' <<< "$details"
            grep -qx "TeamIdentifier=$VIBEFACE_CODESIGN_TEAM" <<< "$details"
            grep -Eq '^CodeDirectory .*flags=0x[0-9a-f]+\([^)]*runtime' <<< "$details"
            binary_sha="$(shasum -a 256 "$binary" | cut -d ' ' -f 1)"
            delays=(15 30 60 120 120 120 120 120 120)
            for attempt in $(seq 0 "${#delays[@]}"); do
              assessment="$RUNNER_TEMP/gatekeeper-assessment-$(basename "$binary")-$attempt.txt"
              if spctl -a -vvv --ignore-cache --no-cache -t open --context context:primary-signature "$binary" >"$assessment" 2>&1; then
                assessment_status=0
              else
                assessment_status=$?
              fi
              cat "$assessment"
              printf 'Gatekeeper assessment %s exited %s\n' "$attempt" "$assessment_status"
              test "$(shasum -a 256 "$binary" | cut -d ' ' -f 1)" = "$binary_sha"
              if test "$assessment_status" -eq 0; then
                grep -qx 'source=Notarized Developer ID' "$assessment"
                break
              fi
              if test "$assessment_status" -ne 3 || ! grep -qx 'source=Unnotarized Developer ID' "$assessment" || test "$attempt" -eq "${#delays[@]}"; then
                exit "$assessment_status"
              fi
              sleep "${delays[$attempt]}"
            done
          done
      - name: Verify packaged Web assets and process
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-web --web-only
      - name: Verify packaged free mesh and charity delivery over real Node processes
        if: needs.plan.outputs.delivery == 'true' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
          VIBEFACE_PROBE_SOURCE_ROOT: ${{ github.workspace }}
          CARGO_TARGET_DIR: ${{ github.workspace }}/.artifacts/delivery-probe/target
        run: |
          cargo fmt --manifest-path tests/fixtures/delivery-probe/Cargo.toml -- --check
          cargo build --manifest-path tests/fixtures/delivery-probe/Cargo.toml --locked
          python3 scripts/verify-node.py --delivery-charity --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts "$PWD/.artifacts/ci-delivery" --delivery-probe "$CARGO_TARGET_DIR/debug/vibeface-delivery-probe" --delivery-source-root "$PWD" --delivery-profile "$PWD/crates/delivery/proof/profile.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && needs.plan.outputs.delivery == 'true' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: delivery-charity-${{ github.sha }}
          path: .artifacts/ci-delivery/delivery-charity-*/report.json
          if-no-files-found: warn
          retention-days: 7
      - uses: ./.github/actions/ubuntu-apt
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          apply: 'true'
      - name: Cache Chromium binaries
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .artifacts/e2e/browsers
          key: ${{ matrix.runner }}-${{ runner.arch }}-chromium-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Verify packaged Web onboarding in Chromium
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          VIBEFACE_E2E_BINARY: ${{ steps.unpack.outputs.package }}/vibeface
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.artifacts/e2e/browsers
          E2E_TELEMETRY_DISABLED: '1'
        run: |
          pnpm install --frozen-lockfile --filter .
          pnpm test:e2e:check
          pnpm exec e2e-web install chromium --with-deps
          pnpm test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && matrix.target == 'x86_64-unknown-linux-gnu' }}
        with:
          name: e2e-${{ github.sha }}
          path: |
            tests/e2e/.artifacts/results
            !tests/e2e/.artifacts/results/**/downloads/**
          if-no-files-found: warn
          retention-days: 7
      - name: Verify unpacked Node scheduling and signed log without model calls
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-node --phase1
      - name: Verify multi-Node sync, entrances and delivery over iroh
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-multi-node
      - name: Verify bot tools and startup event recovery
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'aarch64-apple-darwin'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-chat-agent --chat-agent
      - name: Verify cross-device coordination, owner moves and attachments
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-phase4 --phase4
      - name: Verify the complete CLI client against controlled Node processes
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: |
          python3 scripts/check-cli-parity.py --binary "$PACKAGE/vibeface" --output .artifacts/ci-cli-parity.json
          python3 scripts/verify-cli-client.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --artifacts .artifacts/ci-cli-client
      - name: Upload CLI coverage and process evidence
        if: ${{ !cancelled() && needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-client-${{ github.sha }}
          path: |
            .artifacts/ci-cli-parity.json
            .artifacts/ci-cli-client/cli-process-*/summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Verify the public node, its queue and a private relay's token
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-public-node --public-node
      - name: Verify the mesh, volunteer relay adoption and headless Nodes
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-mesh --mesh
      - name: Verify write protection, status and diagnostics
        if: needs.plan.outputs.package_mode == 'node' && matrix.target == 'aarch64-apple-darwin'
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/ci-phase5 --phase5
      - name: Upload verified package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-package-${{ matrix.target }}-${{ github.sha }}
          path: |
            .artifacts/packages/*.tar.gz
            .artifacts/packages/*.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Node failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: node-process-failure-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci-web/web-process-*/report.json
            .artifacts/ci-web/web-process-*/WEB/process.log
            .artifacts/ci-node/phase1-process-*/report.json
            .artifacts/ci-node/phase1-process-*/A/process.log
            .artifacts/ci-node/phase1-process-*/fixture-manager-*.stderr.log
            .artifacts/ci-chat-agent/chat-agent-process-*/report.json
            .artifacts/ci-chat-agent/chat-agent-process-*/A/process.log
            .artifacts/ci-chat-agent/chat-agent-process-*/fixture-manager-*.stderr.log
            .artifacts/ci-chat-agent/chat-agent-process-*/manager-tool-errors.jsonl
            .artifacts/ci-phase4/phase4-*/report.json
            .artifacts/ci-phase4/phase4-*/*/node.log
            .artifacts/ci-mesh/mesh-*/report.json
            .artifacts/ci-mesh/mesh-*/*/node.log
            .artifacts/ci-public-node/public-node-*/report.json
            .artifacts/ci-public-node/public-node-*/*/node.log
            .artifacts/ci-phase5/phase5-*/report.json
            .artifacts/ci-phase5/phase5-*/*/node.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove signing keychain and notary key
        if: always() && matrix.target == 'aarch64-apple-darwin' && github.event_name != 'merge_group'
        run: |
          security delete-keychain "$RUNNER_TEMP/vibeface-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/vibeface-notary.p8" "$RUNNER_TEMP/vibeface-signing.p12"

  npm-package:
    name: npm package
    needs: [plan, package]
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-24.04
    outputs:
      baseline_artifact: ${{ steps.baseline.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: node-package-*-${{ github.sha }}
          path: .artifacts/npm-input
          merge-multiple: true
      - name: Package verified native releases for npm
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node scripts/package-npm.mjs --input .artifacts/npm-input --source-commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: .artifacts/npm/leaperone-vibeface-*.tgz*
          if-no-files-found: error
          retention-days: 14
      - name: Pin one complete public npm baseline for every service runner
        env:
          GH_TOKEN: ${{ github.token }}
          VIBEFACE_RELEASE_SCRATCH: ${{ github.workspace }}/.artifacts/npm-baseline-source
        run: python3 scripts/verify-node.py --npm-baseline-pin --artifacts .artifacts/npm-service-baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: baseline
        with:
          name: npm-service-baseline-${{ github.sha }}
          path: |
            .artifacts/npm-service-baseline/baseline.tgz
            .artifacts/npm-service-baseline/pin.json
            .artifacts/npm-service-baseline/release.json
          if-no-files-found: error
          retention-days: 14

  npm-smoke:
    name: npm installation and service acceptance
    needs: [plan, npm-package]
    if: needs.plan.outputs.npm == 'true'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package-${{ github.sha }}
          path: .artifacts/npm
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: matrix.target != 'x86_64-pc-windows-msvc'
        with:
          artifact-ids: ${{ needs.npm-package.outputs.baseline_artifact }}
          path: .artifacts/npm-service-baseline
          merge-multiple: true
      - name: Install npm artifact without lifecycle scripts
        id: install
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          prefix="$PWD/.artifacts/npm-installed"
          npm install --global --prefix "$prefix" --ignore-scripts --no-audit --no-fund "$PWD/.artifacts/npm/leaperone-vibeface-$PACKAGE_VERSION.tgz"
          if [[ "$PACKAGE_TARGET" == *-windows-* ]]; then
            exe='.exe'
            launcher="$prefix/vibeface"
            vendor="$prefix/node_modules/@leaperone/vibeface/vendor/$PACKAGE_TARGET"
          else
            exe=''
            launcher="$prefix/bin/vibeface"
            vendor="$prefix/lib/node_modules/@leaperone/vibeface/vendor/$PACKAGE_TARGET"
          fi
          [[ "$("$launcher" --version)" == "vibeface $PACKAGE_VERSION" ]]
          core_version="$(node -p 'require(process.argv[1]).core_version' "$vendor/BUILD-INFO.json")"
          [[ "$("$vendor/vibeface-core$exe" --version)" == "vibeface-core $core_version" ]]
          "$launcher" --help
          printf 'vendor=%s\n' "$vendor" >> "$GITHUB_OUTPUT"
      - name: Verify npm startup and bundled web
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env:
          VENDOR: ${{ steps.install.outputs.vendor }}
        run: |
          prefix="$PWD/.artifacts/npm-installed"
          python3 scripts/verify-node.py --binary "$prefix/bin/vibeface" --core-binary "$VENDOR/vibeface-core" --crypto-module "$VENDOR/web/vibeface_secure.js" --artifacts .artifacts/ci-npm --web-only
      - name: Verify native npm service and package replacement
        if: matrix.target != 'x86_64-pc-windows-msvc'
        env:
          VENDOR: ${{ steps.install.outputs.vendor }}
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          NPM_BASELINE_ARTIFACT_ID: ${{ needs.npm-package.outputs.baseline_artifact }}
        run: |
          [[ "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted ]]
          if [[ "$RUNNER_OS" == Linux ]]; then
            if compgen -G "$HOME/.vibeface*" >/dev/null; then exit 1; fi
            [[ "${XDG_CONFIG_HOME:-$HOME/.config}" == "$HOME/.config" ]]
            for directory in "$HOME/.config/systemd/user" /etc/systemd/user /usr/lib/systemd/user /usr/local/lib/systemd/user; do
              if compgen -G "$directory/vibeface*" >/dev/null || compgen -G "$directory/*/vibeface*" >/dev/null; then exit 1; fi
            done
            service_uid="$(id -u)"
            sudo loginctl enable-linger "$(id -un)"
            sudo systemctl start "user@$service_uid.service"
            export XDG_RUNTIME_DIR="/run/user/$service_uid"
            export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
            [[ -S "$XDG_RUNTIME_DIR/bus" ]]
            /usr/bin/systemctl --user show-environment >/dev/null
          fi
          prefix="$PWD/.artifacts/npm-installed"
          python3 scripts/verify-node.py --binary "$prefix/bin/vibeface" --core-binary "$VENDOR/vibeface-core" --crypto-module "$VENDOR/web/vibeface_secure.js" --artifacts .artifacts/ci-npm-service --npm-service --npm-package ".artifacts/npm/leaperone-vibeface-$PACKAGE_VERSION.tgz" --npm-baseline .artifacts/npm-service-baseline

  ci-gate:
    name: ci-gate
    if: always()
    needs: [plan, quick-check, crypto-web, web, web-tests, mobile-check, desktop-check, www, rust-check, rust-fast, rust-slow, delivery, package, npm-package, npm-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every check selected for this commit and scenario
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_PACKAGE_POLICY: ${{ inputs.package_policy || 'standard' }}
        run: python3 scripts/ci.py gate --needs-env CI_NEEDS --package-policy-env CI_PACKAGE_POLICY
