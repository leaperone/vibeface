name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Read package metadata and validate release tag
        id: metadata
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo metadata --no-deps --format-version 1 --locked > "$RUNNER_TEMP/cargo-metadata.json"
          python3 - "$RUNNER_TEMP/cargo-metadata.json" <<'PY'
          import json, os, sys
          package = next(p for p in json.load(open(sys.argv[1]))["packages"] if p["name"] == "vibeface-node")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f'version={package["version"]}\nmsrv={package["rust_version"]}\n')
          if os.environ["REF_TYPE"] == "tag":
              assert os.environ["REF_NAME"] == f'v{package["version"]}', "Release tag must exactly match the Cargo version"
          PY
          if [[ "$REF_TYPE" == tag ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ariga/setup-atlas@d1698c9cc991e6d65a02ce8bb9cd69fba6223cff # v0
        with:
          version: v1.3.0
      - name: Validate migration files without opening a database
        run: atlas migrate validate --dir file://crates/node/migrations
      - name: Check workflow and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          bash -n scripts/package-node.sh scripts/install-node-service.sh
          shellcheck scripts/package-node.sh scripts/install-node-service.sh
      - name: Check JavaScript syntax
        run: |
          node --check crates/node/sdk/codex-manager.mjs
          node --check crates/node/web/app.js
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check declared minimum Rust version
        env:
          MSRV: ${{ steps.metadata.outputs.msrv }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          cargo +"$MSRV" check --workspace --locked

  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    env:
      PACKAGE_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package-${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native release package
        run: |
          [[ "$(rustc -vV | sed -n 's/^host: //p')" == "$PACKAGE_TARGET" ]]
          bash scripts/package-node.sh --target "$PACKAGE_TARGET"
      - name: Verify checksum and unpacked source identity
        id: unpack
        shell: bash
        run: |
          shopt -s nullglob
          archives=(.artifacts/packages/*.tar.gz)
          [[ "${#archives[@]}" == 1 ]]
          archive="${archives[0]}"
          name="$(basename "$archive" .tar.gz)"
          (cd .artifacts/packages && shasum -a 256 -c "$name.tar.gz.sha256")
          mkdir -p .artifacts/unpacked
          tar -xzf "$archive" -C .artifacts/unpacked
          package="$PWD/.artifacts/unpacked/$name"
          python3 - "$package/BUILD-INFO.json" <<'PY'
          import json, os, pathlib, subprocess, sys
          info = json.load(open(sys.argv[1]))
          assert set(info) == {"version", "target", "source_commit"}
          assert info["source_commit"] == os.environ["GITHUB_SHA"]
          assert info["target"] == os.environ["PACKAGE_TARGET"]
          binary = pathlib.Path(sys.argv[1]).parent / "vibeface-node"
          assert subprocess.check_output([str(binary), "--version"], text=True).strip() == f'vibeface-node {info["version"]}'
          PY
          "$package/vibeface-node" --help
          printf 'package=%s\n' "$package" >> "$GITHUB_OUTPUT"
      - name: Verify unpacked Node processes without model calls
        env:
          PACKAGE: ${{ steps.unpack.outputs.package }}
        run: python3 scripts/verify-node.py --binary "$PACKAGE/vibeface-node" --artifacts .artifacts/ci-node --skip-codex
      - uses: actions/setup-node@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          node-version: '22'
      - name: Verify packaged SDK lockfile without model calls
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: ${{ steps.unpack.outputs.package }}/sidecars
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --input-type=module -e 'import { Codex } from "@openai/codex-sdk"; if (typeof Codex !== "function") process.exit(1)'
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: node-package-${{ matrix.target }}-${{ github.sha }}
          path: |
            .artifacts/packages/*.tar.gz
            .artifacts/packages/*.tar.gz.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload Node failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-process-failure-${{ matrix.target }}-${{ github.run_attempt }}
          path: |
            .artifacts/ci-node/node-acceptance-*/report.json
            .artifacts/ci-node/node-acceptance-*/A/process.log
            .artifacts/ci-node/node-acceptance-*/B/process.log
            .artifacts/ci-node/node-acceptance-*/C/process.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: node-package-*-${{ github.sha }}
          path: packages
          merge-multiple: true
      - name: Verify all assets before publishing
        run: |
          [[ "$RELEASE_TAG" == "v$VERSION" ]]
          shopt -s nullglob
          archives=(packages/*.tar.gz)
          checksums=(packages/*.tar.gz.sha256)
          files=(packages/*)
          [[ "${#archives[@]}" == 4 && "${#checksums[@]}" == 4 && "${#files[@]}" == 8 ]]
          for archive in "${archives[@]}"; do
            name="$(basename "$archive")"
            [[ "$name" == "vibeface-node-$VERSION-"* ]]
            (cd packages && sha256sum -c "$name.sha256")
          done
      - name: Upload complete draft and publish
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Refusing to overwrite a public release"' "$RUNNER_TEMP/release.json"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release view "$RELEASE_TAG" --json assets > "$RUNNER_TEMP/release-assets.json"
          python3 - "$RUNNER_TEMP/release-assets.json" <<'PY'
          import json, pathlib, sys
          expected = sorted(p.name for p in pathlib.Path("packages").iterdir())
          actual = sorted(a["name"] for a in json.load(open(sys.argv[1]))["assets"])
          assert actual == expected, "Draft release asset set differs from verified packages"
          PY
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-download"
          for asset in packages/*; do
            cmp "$asset" "$RUNNER_TEMP/release-download/$(basename "$asset")"
          done
          gh release edit "$RELEASE_TAG" --draft=false
