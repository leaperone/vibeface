name: rust

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check crates/node/sdk/codex-manager.mjs
          node --check crates/node/web/app.js
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p vibeface-node --release --locked
      - name: Verify Node processes without model calls
        run: python3 scripts/verify-node.py --binary target/release/vibeface-node --artifacts .artifacts/ci-node --skip-codex
      - name: Upload Node failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: node-process-failure-${{ github.run_attempt }}
          path: |
            .artifacts/ci-node/node-acceptance-*/report.json
            .artifacts/ci-node/node-acceptance-*/A/process.log
            .artifacts/ci-node/node-acceptance-*/B/process.log
            .artifacts/ci-node/node-acceptance-*/C/process.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
