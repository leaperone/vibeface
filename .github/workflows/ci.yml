            .artifacts/vdp/live-public/branches/branch-token-fee.json
            .artifacts/vdp/live-public/branches/branch-token-sender-tax.json
            .artifacts/vdp/live-public/branches/branch-token-precision.json
            .artifacts/vdp/live-public/branches/branch-token-nonreturn.json
