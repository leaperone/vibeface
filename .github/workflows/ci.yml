      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install recording and KVM access tools
        run: |
          printf 'https://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg acl
      - name: Prepare host Web and Android drivers without model calls
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tests/e2e/.artifacts/vdp/live-ui/browsers
        run: |
          pnpm install --frozen-lockfile --filter .
          pnpm test:e2e:check
          pnpm exec e2e-web install chromium --with-deps
          command -v Xvfb
          command -v xvfb-run
          command -v xauth
          command -v ffmpeg
          command -v ffprobe
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
      - name: Generate genuine local proofs and verify actual Web and Android delivery
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: python3 scripts/run-delivery-live.py --package .artifacts/vdp/live-package --android .artifacts/vdp/live-android --source-commit "$SOURCE_COMMIT"
