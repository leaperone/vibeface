name: npm Nightly publication

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      artifact_id:
        description: Immutable npm artifact from the successful publish-native job
        type: string
        required: true
      publish:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Nightly tag whose release npm artifact will be used
        type: string
        required: true
      publish:
        description: Publish publicly to npm instead of validating a dry run
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-nightly-publication
  cancel-in-progress: false

jobs:
  npm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm-release
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Validate matching Nightly tag and workflow ref
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^cli-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-nightly\.[0-9]{8}\.[1-9][0-9]*$ ]]
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@12.2.2
      - name: Resolve and validate the immutable npm artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          NPM_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node scripts/publish-npm.mjs artifact
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ steps.artifact.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .artifacts/npm
      - name: Verify the package against its source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/package-npm.mjs --verify ".artifacts/npm/leaperone-vibeface-${RELEASE_TAG#cli-v}.tgz" --source-commit "$GITHUB_SHA"
      - name: Validate npm publication without registry writes
        if: ${{ !inputs.publish }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: npm publish ".artifacts/npm/leaperone-vibeface-${RELEASE_TAG#cli-v}.tgz" --tag nightly --access public --dry-run --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Publish once using OIDC and reconcile the registry
        if: ${{ inputs.publish }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/publish-npm.mjs publish
