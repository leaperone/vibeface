name: Release / Core
run-name: Release / Core / ${{ inputs.tag || github.ref_name }} / ${{ (github.event_name == 'push' || inputs.publish) && 'publish' || 'build only' }}
on:
  push:
    tags: ['core-v*']
  workflow_dispatch:
    inputs:
      tag: {description: Exact application tag, type: string, default: ''}
      publish: {description: Publish this exact tag, type: boolean, default: false}
permissions:
  contents: read
  actions: read
concurrency:
  group: release-core-${{ inputs.tag || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.run_id || 'publish' }}
  cancel-in-progress: false
jobs:
  identity:
    name: Validate core release identity
    runs-on: ubuntu-24.04
    permissions: {contents: read, actions: read}
    outputs:
      app: ${{ steps.plan.outputs.app }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_commit }}
      publish: ${{ steps.plan.outputs.publish }}
      runtime_tag: ${{ steps.plan.outputs.runtime_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - name: Validate exact tag and source
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' }}
          IOS_SIGNING_CONFIGURED: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
        run: python3 -B scripts/release-entry.py --app core
  native-macos:
    name: Build core / macos
    needs: [identity]
    uses: ./.github/workflows/release-native.yml
    with:
      app: core
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: macos-15
      target: aarch64-apple-darwin
    secrets: inherit
  native-linux-x64:
    name: Build core / linux-x64
    needs: [identity]
    uses: ./.github/workflows/release-native.yml
    with:
      app: core
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
    secrets: inherit
  native-linux-arm64:
    name: Build core / linux-arm64
    needs: [identity]
    uses: ./.github/workflows/release-native.yml
    with:
      app: core
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
    secrets: inherit
  native-windows:
    name: Build core / windows
    needs: [identity]
    uses: ./.github/workflows/release-native.yml
    with:
      app: core
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: windows-2025
      target: x86_64-pc-windows-msvc
    secrets: inherit
  collect:
    needs: [identity, native-macos, native-linux-x64, native-linux-arm64, native-windows]
    uses: ./.github/workflows/release-collect.yml
    with:
      app: core
      source_sha: ${{ needs.identity.outputs.source_sha }}
      artifact_ids: ${{ needs.native-macos.outputs.artifact_id }},${{ needs.native-linux-x64.outputs.artifact_id }},${{ needs.native-linux-arm64.outputs.artifact_id }},${{ needs.native-windows.outputs.artifact_id }}
  publish-core:
    name: publish-core
    needs: [identity, collect]
    if: needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish.yml
    with:
      app: core
      tag: ${{ needs.identity.outputs.tag }}
      artifact_id: ${{ needs.collect.outputs.artifact_id }}
    permissions: {contents: write, actions: read}
  deploy:
    needs: [identity, publish-core]
    uses: ./.github/workflows/release-deploy.yml
    with:
      app: core
      tag: ${{ needs.identity.outputs.tag }}
      source_sha: ${{ needs.identity.outputs.source_sha }}
    permissions: {actions: write, contents: read}
