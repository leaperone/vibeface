name: Build App Assets for Existing Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing version tag to receive app assets
        required: true
        type: string
      prerelease:
        description: Release channel marker for the reusable build
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/release-apps.yml
    with:
      version: ${{ inputs.version }}
      prerelease: ${{ inputs.prerelease }}
    secrets: inherit

  upload:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-macos-${{ github.sha }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-android-${{ github.sha }}
          path: release
      - name: Upload assets to existing GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: gh release upload "$VERSION" release/* --clobber
