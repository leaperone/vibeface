name: deploy-www

on:
  push:
    branches: [main]
    paths:
      - 'apps/www/**'
      - 'docs/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch build and deployment to leaperone-releases
        env:
          GH_TOKEN: ${{ secrets.VIBEFACE_RELEASE_DISPATCH_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'VIBEFACE_RELEASE_DISPATCH_TOKEN is required' >&2; exit 1; }
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/leaperone/leaperone-releases/dispatches \
            -d "{\"event_type\":\"deploy-vibeface-www\",\"client_payload\":{\"ref\":\"$SOURCE_REF\",\"source_sha\":\"$SOURCE_SHA\"}}"
