name: Reusable / Web assets

on:
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: crypto-web-${{ inputs.source_sha }}
          path: apps/app/generated
      - uses: ./.github/actions/setup-js
        with: {pnpm: 'true'}
      - name: Install, check and build the static web client
        run: |
          bash scripts/build-web.sh
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-${{ inputs.source_sha }}
          path: apps/app/dist/client
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
