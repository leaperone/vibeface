name: Reusable / Deploy published service
on:
  workflow_call:
    inputs:
      app: {type: string, required: true}
      tag: {type: string, required: true}
      source_sha: {type: string, required: true}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions: {actions: write, contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - name: Dispatch once and wait for the exact deployment result
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_APP: ${{ inputs.app }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 -B scripts/release-dispatch.py --app "$RELEASE_APP" --tag "$RELEASE_TAG"
