name: Reusable / Compose platform package
on:
  workflow_call:
    inputs:
      source_sha: {type: string, required: true}
      runner: {type: string, required: true}
      target: {type: string, required: true}
      native_artifact_id: {type: string, required: true}
      app_artifact_id: {type: string, required: true}
    outputs:
      artifact_id:
        value: ${{ jobs.compose.outputs.artifact_id }}
permissions:
  contents: read
jobs:
  compose:
    name: Compose CLI + Core / ${{ inputs.target }}
    runs-on: ${{ inputs.runner }}
    defaults:
      run: {shell: bash}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.native_artifact_id }}
          merge-multiple: true
          path: .artifacts/native-input
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ inputs.app_artifact_id }}
          merge-multiple: true
          path: .artifacts/app-input
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Select this platform's Python
        run: printf 'PY=%s\n' "$(command -v python3 || command -v python)" >> "$GITHUB_ENV"
      - name: Compose from this run's exact inputs
        id: package
        env:
          TARGET: ${{ inputs.target }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          exe=''
          if [[ "$TARGET" == *-windows-* ]]; then exe='.exe'; fi
          chmod +x ".artifacts/native-input/vibeface$exe" ".artifacts/native-input/vibeface-core$exe"
          version=$("$PY" -B scripts/release.py plan --app product | "$PY" -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          "$PY" -B scripts/release.py compose --target "$TARGET" --native-dir .artifacts/native-input --app-archive ".artifacts/app-input/vibeface-app-$version.tar.gz" --output .artifacts/release
          mkdir .artifacts/smoke
          tar -xzf ".artifacts/release/vibeface-$version-$TARGET.tar.gz" -C .artifacts/smoke
          {
            printf 'package=%s\n' "$PWD/.artifacts/smoke/vibeface-$version-$TARGET"
            printf 'archive=%s\n' "$PWD/.artifacts/release/vibeface-$version-$TARGET.tar.gz"
            printf 'exe=%s\n' "$exe"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the composed programs and Web resources
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
          EXE: ${{ steps.package.outputs.exe }}
        run: |
          "$PACKAGE/vibeface$EXE" --help
          "$PACKAGE/vibeface-core$EXE" --version
          if [[ -n "$EXE" ]]; then
            "$PY" -B scripts/verify-windows-node.py --package "$PACKAGE" --artifacts .artifacts/release-smoke
          else
            "$PY" -B scripts/verify-node.py --binary "$PACKAGE/vibeface" --core-binary "$PACKAGE/vibeface-core" --crypto-module "$PACKAGE/web/vibeface_secure.js" --artifacts .artifacts/release-smoke --web-only
          fi
      - name: Keep compact Windows process failure evidence
        if: failure() && runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-compose-diagnostics-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: .artifacts/release-smoke/windows-node-failure.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: native-release-${{ inputs.target }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: .artifacts/release/*
          if-no-files-found: error
