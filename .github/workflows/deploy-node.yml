name: Deploy / Node
run-name: Deploy Node from ${{ inputs.tag }} (${{ inputs.apply && 'apply' || 'dry run' }}, ${{ github.ref_name }})

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published product or Core train tag
        type: string
        required: true
      apply:
        description: Activate the verified containers on the configured hosts
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-services.yml
    with:
      service: node
      tag: ${{ inputs.tag }}
      apply: ${{ inputs.apply }}
    secrets: inherit
