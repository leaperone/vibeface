name: macOS app
on:
  workflow_dispatch:
  pull_request:
    paths: [apps/macos/**, .github/workflows/macos.yml]
permissions: {contents: read}
jobs:
  build:
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'nightly')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Build app
        run: scripts/build-macos-app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vibeface-macos-${{ github.sha }}
          path: .artifacts/macos/Vibeface.app
          if-no-files-found: error
