name: Product releases
on:
  push:
    tags: ['v*', 'www-v*']
  workflow_dispatch:
    inputs:
      app:
        description: Product bundle or independent website
        type: choice
        options: [product, www]
        default: product
      tag:
        description: Exact declared tag; leave empty for a build-only run
        type: string
        default: ''
      publish:
        description: Publish an existing tag after verification
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && !inputs.publish && github.run_id || 'publish' }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      app: ${{ steps.plan.outputs.app }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      source_sha: ${{ steps.plan.outputs.source_commit }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}
      - id: plan
        name: Validate build and publication identity
        env:
          RELEASE_APP: ${{ inputs.app || (startsWith(github.ref_name, 'www-v') && 'www' || 'product') }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name || '') }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
          WINDOWS_SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 != '' }}
          IOS_SIGNING_CONFIGURED: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 != '' && secrets.IOS_CERTIFICATE_PASSWORD != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import json, os, subprocess
          scope, tag = os.environ['RELEASE_APP'], os.environ['RELEASE_TAG']
          publish = os.environ['PUBLISH'] == 'true'
          command = ['python3', '-B', 'scripts/release.py', 'plan', '--app', scope]
          if tag:
              command += ['--tag', tag]
          if publish:
              if not tag or os.environ['GITHUB_REF'] != 'refs/tags/' + tag:
                  raise SystemExit('Publishing requires the exact existing tag as the workflow ref')
              command += ['--require-main', '--publish']
          result = json.loads(subprocess.check_output(command, text=True))
          if scope == 'product' and result['channel'] == 'stable' and os.environ['WINDOWS_SIGNING_CONFIGURED'] != 'true':
              raise SystemExit('Stable product builds require a Windows Authenticode certificate before any producers start')
          if scope == 'product' and result['channel'] == 'stable' and os.environ['IOS_SIGNING_CONFIGURED'] != 'true':
              raise SystemExit('Stable product builds require the iOS distribution identity and provisioning profile')
          if result['source_commit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Build source differs from the workflow commit')
          if publish:
              runs = json.loads(subprocess.check_output([
                  'gh', 'run', 'list', '--repo', os.environ['GITHUB_REPOSITORY'],
                  '--workflow', 'ci.yml', '--commit', result['source_commit'],
                  '--json', 'event,headBranch,headSha,status,conclusion',
              ], text=True))
              if not any(run['event'] == 'push' and run['headBranch'] == 'main' and
                         run['headSha'] == result['source_commit'] and run['status'] == 'completed' and
                         run['conclusion'] == 'success' for run in runs):
                  raise SystemExit('The exact source must have a successful main push CI before publication')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('app', 'version', 'tag', 'source_commit', 'channel'):
                  value = result[key]
                  if not isinstance(value, str) or '\n' in value or '\r' in value:
                      raise SystemExit('Release outputs must be single-line identity strings')
                  output.write(f'{key}={value}\n')
              output.write('publish=' + str(publish).lower() + '\n')
          PY
  static:
    needs: [identity]
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ needs.identity.outputs.source_sha }}', persist-credentials: false}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        if: needs.identity.outputs.app == 'product'
        with: {targets: wasm32-unknown-unknown}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        if: needs.identity.outputs.app == 'product'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.9.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: pnpm, cache-dependency-path: pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - name: Build and verify static application
        env:
          SCOPE: ${{ needs.identity.outputs.app }}
        run: |
          if [[ "$SCOPE" == product ]]; then
            cargo install wasm-bindgen-cli --version 0.2.129 --locked
            npm install --global binaryen@132.0.0
            scripts/build-web-crypto.sh
            scripts/build-web.sh
            python3 -B scripts/release.py component app --input apps/app/dist/client --output .artifacts/static
          else
            pnpm --dir apps/www typecheck
            pnpm --dir apps/www build
            pnpm --dir apps/www check:static
            python3 -B scripts/release.py component www --input apps/www/dist/client --output .artifacts/static
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: static-release-${{ needs.identity.outputs.source_sha }}-${{ github.run_attempt }}
          path: .artifacts/static/*
          if-no-files-found: error
  native-macos:
    needs: [identity]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-native.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: macos-15
      target: aarch64-apple-darwin
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
  native-linux-x64:
    needs: [identity]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-native.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
  native-linux-arm64:
    needs: [identity]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-native.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
  native-windows:
    needs: [identity]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-native.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: windows-2025
      target: x86_64-pc-windows-msvc
    secrets:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_SUBJECT: ${{ secrets.WINDOWS_CERTIFICATE_SUBJECT }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
  android:
    needs: [identity]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-apps.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      version: ${{ needs.identity.outputs.version }}
      tag: ${{ needs.identity.outputs.tag }}
  ios:
    needs: [identity]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-ios.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      version: ${{ needs.identity.outputs.version }}
    secrets:
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
  release-start:
    needs: [identity]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ needs.identity.outputs.tag }}', fetch-depth: 0, persist-credentials: false}
      - name: Create or reconcile the single public BUILDING release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -B scripts/release.py plan --app product --tag "$RELEASE_TAG" --require-main --publish
          python3 -B scripts/release.py begin-product
  publish-app:
    name: publish-app
    needs: [identity, release-start, static]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-app, kind: app, artifact_id: '${{ needs.static.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-native-macos:
    name: publish-native-macos
    needs: [identity, release-start, compose-macos]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-native-aarch64-apple-darwin, kind: native, target: aarch64-apple-darwin, artifact_id: '${{ needs.compose-macos.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-native-linux-x64:
    name: publish-native-linux-x64
    needs: [identity, release-start, compose-linux-x64]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-native-x86_64-unknown-linux-gnu, kind: native, target: x86_64-unknown-linux-gnu, artifact_id: '${{ needs.compose-linux-x64.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-native-linux-arm64:
    name: publish-native-linux-arm64
    needs: [identity, release-start, compose-linux-arm64]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-native-aarch64-unknown-linux-gnu, kind: native, target: aarch64-unknown-linux-gnu, artifact_id: '${{ needs.compose-linux-arm64.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-native-windows:
    name: publish-native-windows
    needs: [identity, release-start, compose-windows]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-native-x86_64-pc-windows-msvc, kind: native, target: x86_64-pc-windows-msvc, artifact_id: '${{ needs.compose-windows.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-desktop-macos:
    name: publish-desktop-macos
    needs: [identity, release-start, desktop-macos]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-desktop-aarch64-apple-darwin, kind: desktop, target: aarch64-apple-darwin, artifact_id: '${{ needs.desktop-macos.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-desktop-linux-x64:
    name: publish-desktop-linux-x64
    needs: [identity, release-start, desktop-linux-x64]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-desktop-x86_64-unknown-linux-gnu, kind: desktop, target: x86_64-unknown-linux-gnu, artifact_id: '${{ needs.desktop-linux-x64.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-desktop-linux-arm64:
    name: publish-desktop-linux-arm64
    needs: [identity, release-start, desktop-linux-arm64]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-desktop-aarch64-unknown-linux-gnu, kind: desktop, target: aarch64-unknown-linux-gnu, artifact_id: '${{ needs.desktop-linux-arm64.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-desktop-windows:
    name: publish-desktop-windows
    needs: [identity, release-start, desktop-windows]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-desktop-x86_64-pc-windows-msvc, kind: desktop, target: x86_64-pc-windows-msvc, artifact_id: '${{ needs.desktop-windows.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-android:
    name: publish-android
    needs: [identity, release-start, android]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-android, kind: android, artifact_id: '${{ needs.android.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  publish-ios:
    name: publish-ios
    needs: [identity, release-start, ios]
    if: needs.identity.outputs.app == 'product' && needs.identity.outputs.publish == 'true'
    uses: ./.github/workflows/release-publish-part.yml
    with: {label: publish-ios, kind: ios, artifact_id: '${{ needs.ios.outputs.artifact_id }}'}
    permissions: {contents: write, actions: read}
  compose-macos:
    needs: [identity, static, native-macos]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-compose.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: macos-15
      target: aarch64-apple-darwin
      native_artifact_id: ${{ needs.native-macos.outputs.artifact_id }}
      app_artifact_id: ${{ needs.static.outputs.artifact_id }}
  compose-linux-x64:
    needs: [identity, static, native-linux-x64]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-compose.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      native_artifact_id: ${{ needs.native-linux-x64.outputs.artifact_id }}
      app_artifact_id: ${{ needs.static.outputs.artifact_id }}
  compose-linux-arm64:
    needs: [identity, static, native-linux-arm64]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-compose.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      native_artifact_id: ${{ needs.native-linux-arm64.outputs.artifact_id }}
      app_artifact_id: ${{ needs.static.outputs.artifact_id }}
  compose-windows:
    needs: [identity, static, native-windows]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-compose.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      native_artifact_id: ${{ needs.native-windows.outputs.artifact_id }}
      app_artifact_id: ${{ needs.static.outputs.artifact_id }}
  desktop-macos:
    needs: [identity, compose-macos]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-desktop.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: macos-15
      target: aarch64-apple-darwin
      native_artifact_id: ${{ needs.compose-macos.outputs.artifact_id }}
      sign: true
    secrets:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
  desktop-windows:
    needs: [identity, compose-windows]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-desktop.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: windows-2025
      target: x86_64-pc-windows-msvc
      native_artifact_id: ${{ needs.compose-windows.outputs.artifact_id }}
      sign: true
    secrets:
      WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_CERTIFICATE_SUBJECT: ${{ secrets.WINDOWS_CERTIFICATE_SUBJECT }}
      WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
  desktop-linux-x64:
    needs: [identity, compose-linux-x64]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-desktop.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: ubuntu-24.04
      target: x86_64-unknown-linux-gnu
      native_artifact_id: ${{ needs.compose-linux-x64.outputs.artifact_id }}
  desktop-linux-arm64:
    needs: [identity, compose-linux-arm64]
    if: needs.identity.outputs.app == 'product'
    uses: ./.github/workflows/release-desktop.yml
    with:
      source_sha: ${{ needs.identity.outputs.source_sha }}
      runner: ubuntu-24.04-arm
      target: aarch64-unknown-linux-gnu
      native_artifact_id: ${{ needs.compose-linux-arm64.outputs.artifact_id }}
  collect:
    needs: [identity, static, compose-macos, compose-linux-x64, compose-linux-arm64, compose-windows, desktop-macos, desktop-windows, desktop-linux-x64, desktop-linux-arm64, android, ios]
    if: >-
      always() && !cancelled() && needs.identity.result == 'success' && needs.static.result == 'success' &&
      (needs.identity.outputs.app == 'www' ||
      (needs.compose-macos.result == 'success' && needs.compose-linux-x64.result == 'success' &&
      needs.compose-linux-arm64.result == 'success' && needs.compose-windows.result == 'success' &&
      needs.desktop-macos.result == 'success' && needs.desktop-windows.result == 'success' &&
      needs.desktop-linux-x64.result == 'success' && needs.desktop-linux-arm64.result == 'success' &&
      needs.ios.result == 'success' && needs.android.result == 'success'))
    runs-on: ubuntu-24.04
    outputs:
      release_artifact_id: ${{ steps.release-artifact.outputs.artifact-id }}
      npm_artifact_id: ${{ steps.npm-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ needs.identity.outputs.source_sha }}', persist-credentials: false}
      - name: Assert the collection source
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.static.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/app
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.compose-macos.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/native/aarch64-apple-darwin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.compose-linux-x64.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/native/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.compose-linux-arm64.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/native/aarch64-unknown-linux-gnu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.compose-windows.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/native/x86_64-pc-windows-msvc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.desktop-macos.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/desktop/aarch64-apple-darwin
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.desktop-windows.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/desktop/x86_64-pc-windows-msvc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.desktop-linux-x64.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/desktop/x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.desktop-linux-arm64.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/desktop/aarch64-unknown-linux-gnu
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.android.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/mobile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: needs.identity.outputs.app == 'product'
        with:
          artifact-ids: ${{ needs.ios.outputs.artifact_id }}
          merge-multiple: true
          path: .artifacts/input/ios
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - name: Assemble the complete release without rebuilding
        env:
          SCOPE: ${{ needs.identity.outputs.app }}
        run: |
          if [[ "$SCOPE" == product ]]; then
            python3 -B scripts/check-android-manifest-tool.py
            python3 -B scripts/release.py assemble-product --input-root .artifacts/input --output .artifacts/release
          else
            mv .artifacts/input/app .artifacts/release
          fi
      - name: Prepare npm distribution from the complete product
        if: needs.identity.outputs.app == 'product' && contains(needs.identity.outputs.version, '-nightly.')
        env:
          VERSION: ${{ needs.identity.outputs.version }}
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          mkdir .artifacts/npm-input
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            cp ".artifacts/release/vibeface-$VERSION-$target.tar.gz" ".artifacts/release/vibeface-$VERSION-$target.tar.gz.sha256" .artifacts/npm-input/
          done
          node scripts/package-npm.mjs --input .artifacts/npm-input --source-commit "$SOURCE_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: npm-artifact
        if: needs.identity.outputs.app == 'product' && contains(needs.identity.outputs.version, '-nightly.')
        with:
          name: npm-package-${{ needs.identity.outputs.source_sha }}-${{ github.run_attempt }}
          path: .artifacts/npm/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: release-artifact
        with:
          name: ${{ needs.identity.outputs.app }}-release-${{ needs.identity.outputs.source_sha }}-${{ github.run_attempt }}
          path: .artifacts/release/*
          if-no-files-found: error
  publish:
    needs: [identity, collect]
    if: always() && !cancelled() && needs.identity.result == 'success' && needs.identity.outputs.app == 'www' && needs.identity.outputs.publish == 'true' && needs.collect.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ needs.identity.outputs.tag }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.collect.outputs.release_artifact_id }}
          merge-multiple: true
          path: .artifacts/release
      - name: Publish the verified complete release
        env:
          GH_TOKEN: ${{ github.token }}
          SCOPE: ${{ needs.identity.outputs.app }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -B scripts/release.py plan --app "$SCOPE" --tag "$RELEASE_TAG" --require-main --publish
          python3 -B scripts/release.py publish "$SCOPE" .artifacts/release
  publish-product:
    needs: [identity, collect, publish-app, publish-native-macos, publish-native-linux-x64, publish-native-linux-arm64, publish-native-windows, publish-desktop-macos, publish-desktop-linux-x64, publish-desktop-linux-arm64, publish-desktop-windows, publish-android, publish-ios]
    if: >-
      always() && !cancelled() && needs.identity.outputs.app == 'product' &&
      needs.identity.outputs.publish == 'true' && needs.collect.result == 'success' &&
      needs.publish-app.result == 'success' && needs.publish-native-macos.result == 'success' &&
      needs.publish-native-linux-x64.result == 'success' && needs.publish-native-linux-arm64.result == 'success' &&
      needs.publish-native-windows.result == 'success' && needs.publish-desktop-macos.result == 'success' &&
      needs.publish-desktop-linux-x64.result == 'success' && needs.publish-desktop-linux-arm64.result == 'success' &&
      needs.publish-desktop-windows.result == 'success' && needs.publish-android.result == 'success' &&
      needs.publish-ios.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: '${{ needs.identity.outputs.tag }}', fetch-depth: 0, persist-credentials: false}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {artifact-ids: '${{ needs.collect.outputs.release_artifact_id }}', merge-multiple: true, path: .artifacts/release}
      - name: Audit every original artifact and complete the Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 -B scripts/release.py plan --app product --tag "$RELEASE_TAG" --require-main --publish
          python3 -B scripts/check-android-manifest-tool.py
          python3 -B scripts/release.py publish product .artifacts/release
  npm:
    needs: [identity, collect, publish-product]
    if: needs.publish-product.result == 'success' && needs.identity.outputs.app == 'product' && contains(needs.identity.outputs.version, '-nightly.')
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.identity.outputs.tag }}
      artifact_id: ${{ needs.collect.outputs.npm_artifact_id }}
      publish: true
    permissions:
      contents: read
      actions: read
      id-token: write
  deploy-app:
    needs: [identity, publish-product]
    if: needs.publish-product.result == 'success' && needs.identity.outputs.app == 'product' && !contains(needs.identity.outputs.version, '-')
    uses: ./.github/workflows/deploy-app.yml
    with:
      tag: ${{ needs.identity.outputs.tag }}
      source_sha: ${{ needs.identity.outputs.source_sha }}
    secrets: inherit
  deploy-www:
    needs: [identity, publish]
    if: always() && !cancelled() && needs.identity.result == 'success' && needs.publish.result == 'success' && needs.identity.outputs.app == 'www' && !contains(needs.identity.outputs.version, '-')
    uses: ./.github/workflows/deploy-www.yml
    secrets: inherit
