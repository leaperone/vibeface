name: Release / Core Hourly
run-name: Core hourly release / ${{ github.event_name }} / ${{ github.ref_name }}
on:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows: ['CI / Core']
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: independent-hourly-releases
  cancel-in-progress: false
jobs:
  hourly:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: write, actions: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: main, fetch-depth: 0, persist-credentials: false}
      - id: release-app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.VIBEFACE_RELEASE_APP_ID }}
          private-key: ${{ secrets.VIBEFACE_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write
      - name: Release Core changes from green main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_TOKEN: ${{ steps.release-app.outputs.token }}
        run: |
          gh auth setup-git
          python3 -B scripts/hourly.py
