name: Release Apps

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      prerelease:
        required: true
        type: boolean

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.9.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: pnpm, cache-dependency-path: pnpm-lock.yaml}
      - name: Prepare Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-mobile-secure.sh android
      - name: Set Android nightly version
        run: |
          python3 - <<'PY'
          import datetime, json, os, re
          path = 'apps/mobile/app.json'
          data = json.load(open(path))
          version = os.environ['VERSION'].removeprefix('v')
          match = re.search(r'nightly\.(\d{8})\.(\d+)$', version)
          if match:
              date = datetime.date.fromisoformat(match.group(1)[:4] + '-' + match.group(1)[4:6] + '-' + match.group(1)[6:])
              code = (date - datetime.date(2020, 1, 1)).days * 100 + int(match.group(2))
          else:
              code = 1
          data['expo']['version'] = version
          data['expo'].setdefault('android', {})['versionCode'] = code
          json.dump(data, open(path, 'w'), indent=2)
          open(path, 'a').write('\n')
          print(f'Android version={version} versionCode={code}')
          PY
      - name: Build release APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Package APK and checksum
        run: |
          mkdir -p .artifacts/android
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk ".artifacts/android/vibeface-${VERSION#v}-android.apk"
          (cd .artifacts/android && shasum -a 256 "vibeface-${VERSION#v}-android.apk" > "vibeface-${VERSION#v}-android.apk.sha256")
          python3 - <<'PY'
          import hashlib, json, os
          name = f"vibeface-{os.environ['VERSION'].removeprefix('v')}-android.apk"
          path = f".artifacts/android/{name}"
          json.dump({'version': os.environ['VERSION'].removeprefix('v'), 'sourceCommit': os.environ['GITHUB_SHA'], 'sha256': hashlib.sha256(open(path, 'rb').read()).hexdigest()}, open(f'{path}.provenance.json', 'w'), indent=2)
          open(f'{path}.provenance.json', 'a').write('\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-android-${{ github.sha }}
          path: .artifacts/android/vibeface-*
          if-no-files-found: error
