name: Release Apps

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    outputs:
      artifact_id:
        value: ${{ jobs.build-android.outputs.artifact_id }}

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ inputs.source_sha }}", persist-credentials: false}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with: {version: 11.9.0}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24', cache: pnpm, cache-dependency-path: pnpm-lock.yaml}
      - name: Prepare Android toolchain
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - run: pnpm install --frozen-lockfile
      - run: scripts/build-mobile-secure.sh android
      - name: Validate committed mobile version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -B scripts/release.py plan --app product --tag "$RELEASE_TAG"
          python3 -B scripts/run-delivery-live.py --verify-source-commit "$SOURCE_SHA"
      - name: Build release APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          cd android && ./gradlew assembleRelease --build-cache -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Package APK and checksum
        run: |
          mkdir -p .artifacts/android
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk ".artifacts/android/vibeface-${VERSION#v}-android.apk"
          (cd .artifacts/android && shasum -a 256 "vibeface-${VERSION#v}-android.apk" > "vibeface-${VERSION#v}-android.apk.sha256")
          python3 -B scripts/release.py mobile-provenance ".artifacts/android/vibeface-${VERSION#v}-android.apk"
          python3 -B scripts/release.py manifest product .artifacts/android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: upload
        with:
          name: android-release-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: .artifacts/android/*
          if-no-files-found: error
