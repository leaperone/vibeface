name: deploy-app

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source_sha:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing stable app tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  request-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch verified app release to leaperone-releases
        env:
          GH_TOKEN: ${{ secrets.VIBEFACE_RELEASE_DISPATCH_TOKEN }}
          SOURCE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^app-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo 'An exact stable app tag is required' >&2; exit 1;
          }
          test -n "$GH_TOKEN" || { echo 'VIBEFACE_RELEASE_DISPATCH_TOKEN is required' >&2; exit 1; }
          source_sha=$(gh api "repos/leaperone/vibeface/commits/$SOURCE_TAG" --jq .sha)
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          if [[ -n "$EXPECTED_SHA" && "$source_sha" != "$EXPECTED_SHA" ]]; then
            echo 'Release tag source does not match the build' >&2; exit 1
          fi
          gh api --method POST repos/leaperone/leaperone-releases/dispatches \
            -f event_type=deploy-vibeface-app \
            -f "client_payload[ref]=$SOURCE_TAG" \
            -f "client_payload[source_sha]=$source_sha"
