[package]
name = "vibeface-secure-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["lib", "staticlib"]

[dependencies]
# The workspace version without its default features: the app only dials, so no port mapping, and
# no Apple fast datapath, which calls private APIs App Review can flag.
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uniffi = { version = "=0.31.2", default-features = false }
vibeface-secure = { path = "../secure" }

[dev-dependencies]
hex.workspace = true
