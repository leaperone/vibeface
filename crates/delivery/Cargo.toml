[package]
name = "vibeface-delivery"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"


[dependencies]
alloy-primitives = { version = "=1.4.1", default-features = false, features = ["serde"] }
alloy-sol-types = { version = "=1.4.1", default-features = false, features = ["more-tuple-impls"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["alloc", "zeroize"] }
hpke = { version = "=0.12.0", default-features = false, features = ["alloc", "x25519"] }
rand_chacha = { version = "=0.3.1", default-features = false }
rand_core = { version = "=0.6.4", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
x25519-dalek = { version = "=2.0.1", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc", "derive", "serde"] }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
