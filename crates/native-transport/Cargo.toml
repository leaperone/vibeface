[package]
name = "vibeface-native-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Outbound LAN uses the minimal transport without the Apple fast datapath.
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio.workspace = true
vibeface-protocol.workspace = true
vibeface-secure = { path = "../secure" }

# netdev under iroh reads libc::in6_ifreq on iOS. Keep the known-good App Store pin.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"
